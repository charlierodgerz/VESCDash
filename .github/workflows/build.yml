name: Build iPhone app
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: Build app
        run: |
          xcodebuild -project VESCDash.xcodeproj -scheme VESCDash -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build
      - name: Make ipa
        run: |
          mkdir Payload
          cp -R build/Build/Products/Release-iphoneos/VESCDash.app Payload/
          zip -qry VESCDash.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: VESCDash-ipa
          path: VESCDash.ipa
