  if (st.source !== 'ble') return;
  st.connLost = true;
  if (client) client.cancelAll();
  client = null; st.ready = false; sessionId++;
  st.alerts = [{ kind: 'conn', level: 'critical', title: 'Connection to controller lost', detail: 'No telemetry or alerts. The scooter keeps running on its own settings — use your brakes.' }];
  buzz('error'); log('Connection lost'); render();
}

async function beginSession(tr) {
  const id = ++sessionId;
  client = new Client(tr);
  const c = client;
  st.ready = false; st.trip.breakContinuity();
  st.handshake = 'Reading firmware version…'; render();
  let fw = null;
  for (let i = 0; i < 3 && !fw; i++) { try { fw = await c.fw(); } catch (e) { log(`FW attempt ${i + 1}: ${e.message}`); } if (id !== sessionId) return; }
  if (!fw) { st.handshake = 'No VESC response. Check the module is a VESC UART bridge, UART is enabled on the controller, and the baud rate matches (usually 115200).'; render(); return; }
  st.fw = fw; log(`Firmware ${fw.version} on ${fw.hw} (UUID ${fw.uuid})`);
  st.handshake = 'Reading limits…'; render();
  try { st.temp = await c.temp(); st.tempOK = true; } catch (e) { st.tempOK = false; log('Temporary limits not supported: ' + e.message); }
  st.handshake = 'Reading configuration…'; render();
  await refreshConfig('mcconf'); await refreshConfig('appconf');
  if (id !== sessionId) return;
  reconcileBaseline();
  st.ready = true; st.handshake = ''; st.connLost = false; st.alerts = st.alerts.filter((a) => a.kind !== 'conn');
  buzz(); render();
  gpsStart();
  pollLoop(id, c);
  if (S.autoMode && S.lastMode && modeById(S.lastMode) && !S.readOnly && st.tempOK && st.activeProfile !== S.lastMode) {
    await sleep(1500); if (id !== sessionId) return;
    try { const plan = planFor(S.lastMode); const msg = await applyPlan(plan); toast(`${plan.profile.icon || ''} ${msg}`); render(); }
    catch (e) { toast('Auto mode not applied: ' + e.message.split('\n')[0], 'warn'); }
  }
  if (S.keepRegen && S.regenPref && !S.readOnly && coastCalFor() && st.fw.versionNumber >= 600 && id === sessionId) {
    const cur = Math.round((C.currentCoastRegen(st.app, coastCalFor()) || 0) * 100), want = S.regenPref.on ? S.regenPref.pct : 0;
    if (Math.abs(cur - want) > 1) {
      await sleep(800);
      try { await applyRegen(want, true); toast(want ? `🔋 Regen braking on · ${want} %` : 'Regen braking off'); render(); }
      catch (e) { toast('Regen not applied: ' + e.message.split('\n')[0], 'warn'); }
    }
  }
}

async function refreshConfig(kind) {
  if (!client) return;
  try {
    const raw = await client.readRaw(kind);
    try {
      const b = C.ConfigBlob.fromReply(kind, raw);
      if (kind === 'mcconf') { st.mc = b; st.mcErr = null; st.editMc = b.clone(); } else { st.app = b; st.appErr = null; st.editApp = b.clone(); }
      log(`${kind}: verified layout (firmware ${b.layout.fw.join('/')})`);
    } catch (e) {
      if (kind === 'mcconf') { st.mc = null; st.mcErr = e.message; } else { st.app = null; st.appErr = e.message; }
      log(`${kind}: ${e.message}. Read-only.`);
    }
  } catch (e) { if (kind === 'mcconf') st.mcErr = 'Could not read: ' + e.message; else st.appErr = 'Could not read: ' + e.message; }
}

function reconcileBaseline() {
  const id = uuid(); if (!id || !st.temp) return;
  st.tempUnknown = false;
  const b = baselines[id];
  if (!b) { baselines[id] = { limits: st.temp, appHex: st.app ? C.hex(st.app.bytes) : null, at: Date.now() }; st.profileStatus = 'Baseline captured from the controller\'s current configuration.'; st.activeProfile = null; }
  else if (C.tempLimitsEqual(st.temp, b.limits)) { st.activeProfile = null; b.lastProfile = null; b.lastLimits = null; st.profileStatus = 'Normal configuration (no mode active).'; }
  else if (b.lastLimits && C.tempLimitsEqual(st.temp, b.lastLimits)) { st.activeProfile = b.lastProfile; st.profileStatus = `${(modeById(b.lastProfile) || { name: 'A mode' }).name} still active (controller not power-cycled).`; }
  else { st.tempUnknown = true; st.profileStatus = 'Controller limits differ from the saved baseline (changed by another tool?). Review, then use "Use current as baseline".'; }
  saveBaselines();
}

async function pollLoop(id, c) {
  let lastOdo = 0;
  while (id === sessionId && client === c) {
    const t0 = Date.now();
    try { ingest(await c.values()); st.timeouts = 0; }
    catch { if (id !== sessionId) return; if (++st.timeouts === 5) { st.alerts.unshift({ kind: 'conn', level: 'critical', title: 'Controller not responding', detail: 'No telemetry for several requests.' }); buzz('error'); renderAlerts(); } }
    if (st.odoSupported !== false && Date.now() - lastOdo > 5000) {
      lastOdo = Date.now();
      try { st.odo = await c.odo(); st.odoSupported = st.odo != null; } catch { st.odoSupported = false; }
    }
    const wait = 1000 / Math.max(2, Math.min(S.pollHz, 20)) - (Date.now() - t0);
    if (wait > 0) await sleep(wait);
  }
}

function ingest(v) {
  const now = Date.now();
  st.v = v; st.vAt = now;
  st.trip.ingest(v, geo());
  const kmh = C.speedKmh(v.erpm, geo());
  trackStats(v, Math.abs(kmh), now);
  st.history.push({ t: now, speed: kmh, watts: v.voltage * v.inputCurrent, voltage: v.voltage, motorA: v.motorCurrent, battA: v.inputCurrent, fet: v.tempMosfet });
  if (st.history.length > 6000) st.history.splice(0, st.history.length - 6000);
  if (st.recording) st.rec.push({ t: now, speed: kmh, erpm: v.erpm, voltage: v.voltage, batteryCurrent: v.inputCurrent, motorCurrent: v.motorCurrent, watts: v.voltage * v.inputCurrent, duty: v.duty, tempMosfet: v.tempMosfet, tempMotor: motorSensor() ? v.tempMotor : null, tripKm: st.trip.km, fault: v.fault });
  if (v.fault && v.fault !== st.lastFault) { st.faults.unshift({ t: now, code: v.fault }); log('FAULT: ' + C.faultName(v.fault)); }
  st.lastFault = v.fault;
  const prev = new Set(st.alerts.map((a) => a.kind + a.level));
  const fresh = C.evaluateAlerts(v, pct(), S.battery, thresholds());
  if (fresh.some((a) => !prev.has(a.kind + a.level))) buzz(fresh[0].level === 'critical' ? 'error' : 'warn');
  st.alerts = st.alerts.filter((a) => a.kind === 'conn' && st.timeouts >= 5).concat(fresh);
  renderLive();
}

// ---------------- stats, performance, speed alert, ride history ----------------
function trackStats(v, kmh, now) {
  const p = st.peaks, w = v.voltage * v.inputCurrent;
  if (st._lastT && kmh > 2) st.movingMs += Math.min(now - st._lastT, 1000);
  st._lastT = now;
  p.maxKmh = Math.max(p.maxKmh, kmh); p.maxW = Math.max(p.maxW, w); p.maxRegenW = Math.max(p.maxRegenW, -w);
  p.maxBattA = Math.max(p.maxBattA, v.inputCurrent); p.maxMotorA = Math.max(p.maxMotorA, Math.abs(v.motorCurrent));
  p.maxFet = Math.max(p.maxFet, v.tempMosfet); if (motorSensor()) p.maxMotor = Math.max(p.maxMotor ?? -99, v.tempMotor);
  p.minV = p.minV == null ? v.voltage : Math.min(p.minV, v.voltage); if (p.startV == null) p.startV = v.voltage;
  // standing-start timer (0 → 25 / 40 / 50 km/h)
  const pf = st.perf;
  if (kmh < 1) { pf.armed = true; pf.t0 = null; pf.hit = {}; }
  else if (pf.armed && pf.t0 == null) pf.t0 = now;
  if (pf.t0 != null) for (const target of [25, 40, 50]) {
    if (!pf.hit[target] && kmh >= target) {
      const sec = (now - pf.t0) / 1000; pf.hit[target] = sec; pf.last = { target, sec };
      const key = (st.source === 'demo' ? 'demo' : 'real') + target;
      if (!perfBest[key] || sec < perfBest[key]) { perfBest[key] = sec; store.set('perf', perfBest); }
    }
  }
  if (pf.t0 != null && now - pf.t0 > 30000) pf.armed = false;
  // speed alert
  const lim = S.speedAlert ? U.toKmh(S.speedAlert) : 0;
  if (lim && kmh > lim && !st.overSpeed) { st.overSpeed = true; buzz('warn'); beep(); }
  else if (!lim || kmh < lim - 2) st.overSpeed = false;
  // ride series (1 sample / 2 s) for the ride chart
  if (!st._lastSeries || now - st._lastSeries >= 2000) { st._lastSeries = now; st.series.push(Math.round(kmh * 10) / 10); if (st.series.length > 5400) st.series.splice(0, 2); }
  // all-time top speed alert (real rides only)
  const rec = allTimeTop(st.source === 'demo');
  if (rec > 5 && kmh > rec + 0.3 && !st._recToasted && st.trip.km > 0.05) { st._recToasted = true; toast(`🏆 New top speed: ${show(U.spd(kmh), 1)} ${U.s}`); buzz(); }
  // auto-end the ride after 5 minutes standing still
  if (kmh > 2) st._lastMoving = now;
  else if (st._lastMoving && now - st._lastMoving > 5 * 60000 && st.trip.km >= 0.05) { st._lastMoving = null; if (resetTrip()) toast('Ride saved to Rides'); }
}
const allTimeTop = (demo) => Math.max(0, ...rides.filter((r) => !!r.demo === !!demo).map((r) => r.maxKmh));

// ---------------- GPS route + parking spot ----------------
let geoWatch = null;
function gpsStart() {
  if (!S.gps || geoWatch != null || !navigator.geolocation || st.source === 'demo') return;
  geoWatch = navigator.geolocation.watchPosition((pos) => {
    const { latitude: la, longitude: lo, accuracy } = pos.coords; if (accuracy > 35) return;
    st.lastFix = { lat: la, lon: lo, t: Date.now() };
    const kmh = st.v ? Math.abs(C.speedKmh(st.v.erpm, geo())) : 0, tr = st.track, last = tr[tr.length - 1];
    if (!last || distM(last[0] / 1e5, last[1] / 1e5, la, lo) > 12) { tr.push([Math.round(la * 1e5), Math.round(lo * 1e5), Math.round(kmh)]); if (tr.length > 4000) tr.splice(1, 1); }
  }, () => {}, { enableHighAccuracy: true, maximumAge: 2000 });
}
function gpsStop() { if (geoWatch != null) navigator.geolocation.clearWatch(geoWatch); geoWatch = null; }
function distM(a, b, c, d) { const R = 6371000, r = Math.PI / 180, x = (d - b) * r * Math.cos((a + c) / 2 * r), y = (c - a) * r; return Math.sqrt(x * x + y * y) * R; }

// ---------------- toast ----------------
function toast(msg, kind = '') {
  const t = document.createElement('div'); t.className = 'toast ' + kind; t.textContent = msg; $('#toasts').appendChild(t);
  setTimeout(() => t.classList.add('out'), 3200); setTimeout(() => t.remove(), 3700);
}
let audio;
function beep() {
  if (!S.beep) return;
  try {
    audio = audio || new (window.AudioContext || window.webkitAudioContext)();
    const o = audio.createOscillator(), g = audio.createGain(); o.frequency.value = 1320; o.connect(g); g.connect(audio.destination);
    g.gain.setValueAtTime(0.25, audio.currentTime); g.gain.exponentialRampToValueAtTime(0.001, audio.currentTime + 0.35); o.start(); o.stop(audio.currentTime + 0.36);
  } catch { /* no audio */ }
}
function saveRide() {
  if (st.trip.km < 0.05) return false;
  const p = st.peaks;
  rides.unshift({ id: Date.now(), start: p.start, end: Date.now(), demo: st.source === 'demo', km: st.trip.km, movingS: st.movingMs / 1000,
    maxKmh: p.maxKmh, avgKmh: st.movingMs ? st.trip.km / (st.movingMs / 3600000) : 0, wh: st.trip.netWh, whKm: st.trip.whPerKm,
    maxW: p.maxW, maxBattA: p.maxBattA, maxFet: p.maxFet, minV: p.minV, startV: p.startV, mode: st.activeProfile && (modeById(st.activeProfile) || {}).name,
    series: st.series.slice(), track: st.track.length > 1 ? st.track.slice() : null, vehicle: S.vehicleName });
  if (st.lastFix && st.source !== 'demo') store.set('parked', { ...st.lastFix, t: Date.now() });
  saveRides(); return true;
}
function resetTrip(save = true) {
  const saved = save && saveRide();
  st.trip.reset(); st.peaks = freshPeaks(); st.movingMs = 0; st.series = []; st.track = []; st._recToasted = false; st._lastMoving = null;
  return saved;
}

// ---------------- safety-gated writes ----------------
async function stationary() {
  if (!client) return { ok: false, failures: ['Not connected.'] };
  let v = null; try { v = await client.values(); ingest(v); } catch {}
  const p = caps().throttlePrefix; let thr = null;
  if (p) try { thr = await client.throttle(p === 'app_ppm_conf'); } catch {}
  return C.stationaryCheck(v, v ? 0 : Infinity, thr, !!p);
}

function planFor(kind) {
  if (!st.temp || !st.tempOK) throw new Error('Temporary limits are not supported by this controller.');
  const b = baselines[uuid()]; if (!b) throw new Error('No baseline for this controller.');
  if (st.tempUnknown) throw new Error('Controller limits don\'t match the saved baseline. Review them, then tap "Use current as baseline".');
  if (!S.geometryConfirmed) throw new Error('Confirm wheel size and pole pairs in Setup first.');
  let baseApp = st.app;
  if (b.appHex) try { baseApp = new C.ConfigBlob('appconf', C.unhex(b.appHex)); } catch {}
  let mode = modeById(kind); if (!mode) throw new Error('Mode not found.');
  if (mode.regen == null && S.regenPref && coastCalFor()) mode = { ...mode, regen: S.regenPref.on ? S.regenPref.pct : 0 };
  return C.planProfile(mode, b.limits, st.temp, geo(), caps(), baseApp);
}

/** Before enabling coast regen: the live resting throttle voltage must match calibration and give brake, never drive. */
async function checkThrottleRest(app) {
  const cal = coastCalFor(); let thr;
  try { thr = await client.throttle(false); } catch { throw new Error('Could not read the throttle voltage.'); }
  if (Math.abs(thr.raw - cal.rest) > 0.12) throw new Error(`Throttle resting voltage is ${thr.raw.toFixed(2)} V but was calibrated at ${cal.rest.toFixed(2)} V. Re-calibrate coast regen.`);
  if (C.simulateAdc(app, thr.raw + 0.05) > 0) throw new Error('Throttle noise at rest could cause drive with this regen setting. Re-calibrate coast regen.');
}
/** Turn coast regen on (pct > 0) or off (0). Temporary on firmware 6.00+, stored on older firmware. */
async function applyRegen(pct, silent = false) {
  if (S.readOnly) throw new Error('Read-only mode is on.');
  const cal = coastCalFor(); if (!cal) throw new Error('Calibrate the throttle first.');
  const r = C.planCoastRegen(st.app, cal, pct);
  if (r.app.equals(st.app)) return pct ? `Regen braking already at ${pct} %.` : 'Regen braking already off.';
  const chk = await stationary(); if (!chk.ok) throw new Error(chk.failures.join('\n'));
  if (pct > 0) await checkThrottleRest(r.app);
  if (st.fw.versionNumber >= 600) { await client.writeConfig(r.app, false); await refreshConfig('appconf'); }
  else await writeConfig(st.app, r.app, C.COAST_FIELDS);
  const now = Math.round((C.currentCoastRegen(st.app, cal) || 0) * 100);
  if (Math.abs(now - pct) > 2) throw new Error(`Controller reports ${now} % instead of ${pct} %.`);
  log(`Regen braking ${pct ? pct + ' %' : 'off'}`);
  return pct ? `Regen braking on · ${pct} %${st.fw.versionNumber >= 600 ? '' : ' (saved to controller)'}` : 'Regen braking off.';
}
async function applyPlan(plan) {
  if (S.readOnly) throw new Error('Read-only mode is on.');
  const chk = await stationary(); if (!chk.ok) throw new Error(chk.failures.join('\n'));
  if (plan.regen) await checkThrottleRest(plan.app);
  await client.setTemp(plan.limits);
  if (plan.app) await client.writeConfig(plan.app, false);
  const back = await client.temp(); st.temp = back;
  if (!C.tempLimitsEqual(back, plan.limits)) throw new Error('Controller reports different limits than requested (hardware clamp?).');
  if (plan.app) await refreshConfig('appconf');
  const b = baselines[uuid()]; b.lastProfile = plan.profile.id; b.lastLimits = back; saveBaselines();
  S.lastMode = plan.profile.id; saveSettings();
  st.activeProfile = plan.profile.id; st.profileStatus = `${plan.profile.name} active (temporary until power-off).`;
  log(`Applied ${plan.profile.name}: max ERPM ${Math.round(back.maxERPM)}, max ${Math.round(back.wattMax)} W`);
  return `${plan.profile.name} applied and verified.`;
}

async function restoreBaseline() {
  if (S.readOnly) throw new Error('Read-only mode is on.');
  const b = baselines[uuid()]; if (!b) throw new Error('No baseline.');
  const chk = await stationary(); if (!chk.ok) throw new Error(chk.failures.join('\n'));
  await client.setTemp(b.limits);
  if (caps().fwNumber >= 600 && b.appHex && st.app && C.hex(st.app.bytes) !== b.appHex) {
    try { let blob = new C.ConfigBlob('appconf', C.unhex(b.appHex)); if (S.regenPref && S.regenPref.on && coastCalFor() && !C.coastRegenSupport(blob, coastCalFor())) blob = C.planCoastRegen(blob, coastCalFor(), S.regenPref.pct).app; if (blob.sig === st.app.sig && !blob.equals(st.app)) { await client.writeConfig(blob, false); await refreshConfig('appconf'); } } catch (e) { log(e.message); }
  }
  st.temp = await client.temp(); b.lastProfile = null; b.lastLimits = null; saveBaselines();
  st.activeProfile = null; st.tempUnknown = false; st.profileStatus = 'Normal configuration restored.';
  return 'Normal limits restored.';
}

function addBackup(blob, note) {
  backups.unshift({ id: Date.now() + Math.random().toString(36).slice(2, 6), at: Date.now(), uuid: st.fw.uuid, hw: st.fw.hw, fw: st.fw.version, kind: blob.kind, sig: blob.sig, hex: C.hex(blob.bytes), note });
  saveBackups();
}

async function writeConfig(orig, edited, extraAllowed = []) {
  if (S.readOnly) throw new Error('Read-only mode is on.');
  if (C.validate(orig, edited, S.hw, geo(), extraAllowed).some((i) => i.severity === 'blocked')) throw new Error('Blocked by validation.');
  if (edited.kind === 'mcconf' && (st.activeProfile || st.tempUnknown)) throw new Error('A riding mode is active. Restore normal limits on the Modes tab first, otherwise the mode\'s limits would be saved permanently.');
  const fresh = C.ConfigBlob.fromReply(edited.kind, await client.readRaw(edited.kind));
  if (!fresh.equals(orig)) throw new Error('The controller configuration changed since it was read. Reload and try again.');
  addBackup(fresh, 'Automatic backup before editing ' + edited.changes(orig).map((c) => c.name).join(', '));
  const chk = await stationary(); if (!chk.ok) throw new Error(chk.failures.join('\n'));
  await client.writeConfig(edited, true);
  const after = C.ConfigBlob.fromReply(edited.kind, await client.readRaw(edited.kind));
  if (edited.kind === 'mcconf') { st.mc = after; st.editMc = after.clone(); try { st.temp = await client.temp(); baselines[uuid()].limits = st.temp; saveBaselines(); } catch {} }
  else { st.app = after; st.editApp = after.clone(); if (baselines[uuid()]) { baselines[uuid()].appHex = C.hex(after.bytes); saveBaselines(); } }
  const bad = edited.changes(orig).filter((c) => Math.abs((after.get(c.name) ?? NaN) - c.new) > Math.max(1e-3, Math.abs(c.new) * 1e-4));
  if (bad.length) throw new Error(`Written, but the controller adjusted: ${bad.map((c) => c.name).join(', ')} (hardware clamp). A backup was saved.`);
  log(`Wrote ${edited.kind}: ${edited.changes(orig).map((c) => `${c.name}=${c.new}`).join(', ')}`);
  return 'Saved to the controller and verified. A backup was stored first.';
}

async function restoreBackup(bk) {
  if (S.readOnly) throw new Error('Read-only mode is on.');
  if (bk.uuid !== uuid()) throw new Error('This backup belongs to a different controller.');
  const target = new C.ConfigBlob(bk.kind, C.unhex(bk.hex));
  const cur = bk.kind === 'mcconf' ? st.mc : st.app;
  if (!cur || cur.sig !== target.sig) throw new Error('Different firmware configuration layout — cannot restore here.');
  if (bk.kind === 'mcconf' && (st.activeProfile || st.tempUnknown)) throw new Error('Restore normal limits on the Modes tab first.');
  const fresh = C.ConfigBlob.fromReply(bk.kind, await client.readRaw(bk.kind));
  addBackup(fresh, 'Automatic backup before rollback');
  const chk = await stationary(); if (!chk.ok) throw new Error(chk.failures.join('\n'));
  await client.writeConfig(target, true);
  const after = C.ConfigBlob.fromReply(bk.kind, await client.readRaw(bk.kind));
  if (bk.kind === 'mcconf') { st.mc = after; st.editMc = after.clone(); try { st.temp = await client.temp(); baselines[uuid()].limits = st.temp; saveBaselines(); } catch {} } else { st.app = after; st.editApp = after.clone(); }
  return after.equals(target) ? 'Restored and verified.' : 'Restored, but read-back differs (firmware may clamp values).';
}

async function backupNow() {
  for (const kind of ['mcconf', 'appconf']) {
    const raw = await client.readRaw(kind); const bytes = raw.slice(1);
    let sig = 0; try { sig = new C.Reader(bytes).u32(); } catch {}
    backups.unshift({ id: Date.now() + kind, at: Date.now(), uuid: st.fw.uuid, hw: st.fw.hw, fw: st.fw.version, kind, sig, hex: C.hex(bytes), note: 'Manual backup' });
  }
  saveBackups(); downloadBackups();
  return 'Backed up both configurations and downloaded a copy.';
}

function downloadBackups() { download(`vescdash-backups-${stamp()}.json`, JSON.stringify(backups, null, 1), 'application/json'); }

// ---------------- recording ----------------
function startRecording() { st.rec = []; st.recStart = Date.now(); st.recording = true; render(); }
function stopRecording() {
  st.recording = false;
  if (st.rec.length) { download(`ride_${stamp(st.recStart)}.csv`, C.renderCSV(st.rec), 'text/csv'); log(`Ride log saved (${st.rec.length} samples)`); }
  st.rec = []; render();
}
function stamp(t = Date.now()) { const d = new Date(t), p = (n) => String(n).padStart(2, '0'); return `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())}_${p(d.getHours())}-${p(d.getMinutes())}-${p(d.getSeconds())}`; }
function download(name, text, type) {
  const url = URL.createObjectURL(new Blob([text], { type }));
  const a = Object.assign(document.createElement('a'), { href: url, download: name }); document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 5000);
}

// ---------------- UI: shell ----------------
const TABS = [['dash', 'Ride', 'M12 21a9 9 0 1 1 9-9M12 12l5-5'], ['modes', 'Modes', 'M4 6h16M4 12h10M4 18h6'], ['rides', 'Rides', 'M5 18a2 2 0 1 0 0 .01M19 18a2 2 0 1 0 0 .01M7 18h10l-4-9h4M9 9l-2 9'], ['data', 'Live', 'M3 17l5-6 4 4 8-10'], ['settings', 'Settings', 'M6 4v16M18 4v16M12 4v16M4 9h4M10 14h4M16 7h4'], ['bt', 'Connect', 'M7 7l10 10-5 5V2l5 5L7 17']];

function render() {
  $('#demo').hidden = st.source !== 'demo';
  $('#tabs').innerHTML = TABS.map(([id, label, d]) => `<button class="tab ${st.tab === id ? 'on' : ''}" data-tab="${id}"><svg viewBox="0 0 24 24"><path d="${d}"/></svg><span>${label}</span></button>`).join('');
  renderAlerts();
  $('#view').innerHTML = ({ dash: viewDash, modes: viewModes, rides: viewRides, data: viewData, settings: viewSettings, bt: viewBT })[st.tab]();
  if (st.tab === 'dash') updateDash();

function gaugeArc(frac, r, w, cls) {
  const a0 = 135, sweep = 270 * Math.min(Math.max(frac, 0), 1), rad = (d) => d * Math.PI / 180;
  const p = (d) => `${150 + r * Math.cos(rad(d))} ${150 + r * Math.sin(rad(d))}`;
  const track = `M${p(a0)} A${r} ${r} 0 1 1 ${p(a0 + 270)}`;
  const fill = sweep < 0.5 ? '' : `M${p(a0)} A${r} ${r} 0 ${sweep > 180 ? 1 : 0} 1 ${p(a0 + sweep)}`;
  return `<path class="track" d="${track}" stroke-width="${w}"/><path class="${cls}" d="${fill}" stroke-width="${w}"/>`;
}
function gaugeTicks(max) {
  let out = '';
  const step = max <= 50 ? 5 : 10;
  for (let v = 0; v <= max; v += step) {
    const a = (135 + 270 * v / max) * Math.PI / 180, major = v % (step * 2) === 0;
    const r1 = 112, r2 = major ? 100 : 105;
    out += `<line x1="${150 + r1 * Math.cos(a)}" y1="${150 + r1 * Math.sin(a)}" x2="${150 + r2 * Math.cos(a)}" y2="${150 + r2 * Math.sin(a)}" class="tick${major ? ' major' : ''}"/>`;
    if (major) out += `<text x="${150 + 88 * Math.cos(a)}" y="${150 + 88 * Math.sin(a) + 4}" class="ticklbl">${v}</text>`;
  }
  return out;
}
function modeChips(compact) {
  const act = st.activeProfile;
  return `<div class="chips${compact ? ' compact' : ''}">${S.modes.map((m) => `<button class="chip ${act === m.id ? 'on' : ''}" style="--c:${m.color}" data-act="plan" data-k="${m.id}"><span>${m.icon || '●'}</span>${esc(m.name)}</button>`).join('')}
    ${act ? '<button class="chip normal" data-act="restore">↺ Normal</button>' : ''}</div>`;
}

function tile(title, val, unit, cls = '', foot = '', icon = '') {
  return `<div class="tile">${icon ? `<div class="ticon">${icon}</div>` : ''}<div class="tt">${title}</div><div class="tv ${val === '—' ? 'faint' : cls}">${val}<small>${unit}</small></div>${foot ? `<div class="tf">${foot}</div>` : ''}</div>`;
}
function tempCls(t, start) { return t == null ? '' : t >= start ? 'red' : t >= start - 10 ? 'amber' : ''; }

function gaugeSVG(frac, powFrac, regenFrac, gmax, limFrac, over) {
  const cx = 150, cy = 150, a0 = 135, rad = (d) => d * Math.PI / 180, P = (r, d) => [cx + r * Math.cos(rad(d)), cy + r * Math.sin(rad(d))];
  const arc = (r, f) => { const to = a0 + 270 * Math.min(Math.max(f, 0), 1); if (to - a0 < 0.5) return ''; const [x0, y0] = P(r, a0), [x1, y1] = P(r, to); return `M${x0.toFixed(1)} ${y0.toFixed(1)} A${r} ${r} 0 ${to - a0 > 180 ? 1 : 0} 1 ${x1.toFixed(1)} ${y1.toFixed(1)}`; };
  const N = 60; let s = '';
  const lit = Math.round(Math.min(Math.max(frac, 0), 1) * N);
  for (let i = 0; i <= N; i++) {
    const d = a0 + 270 * i / N, [x0, y0] = P(116, d), [x1, y1] = P(i % 5 === 0 ? 140 : 136, d), on = i <= lit && lit > 0;
    s += `<line x1="${x0.toFixed(1)}" y1="${y0.toFixed(1)}" x2="${x1.toFixed(1)}" y2="${y1.toFixed(1)}" class="seg${on ? (over ? ' over' : ' on') : ''}${on && i === lit ? ' tip' : ''}" style="${on ? `opacity:${(0.35 + 0.65 * i / Math.max(lit, 1)).toFixed(2)}` : ''}"/>`;
  }
  const step = gmax <= 50 ? 10 : 20;
  for (let v = step; v < gmax; v += step) { const [x, y] = P(96, a0 + 270 * v / gmax); s += `<text x="${x.toFixed(1)}" y="${(y + 4).toFixed(1)}" class="glbl">${v}</text>`; }
  s += `<path class="ptrack" d="${arc(106, 1)}"/>`;
  if (regenFrac > 0.005) s += `<path class="regenarc" d="${arc(106, regenFrac)}"/>`;
  else s += `<path class="powarc" d="${arc(106, powFrac)}"/>`;
  if (limFrac != null && limFrac < 1) { const d = a0 + 270 * limFrac, [x0, y0] = P(112, d), [x1, y1] = P(146, d); s += `<line x1="${x0}" y1="${y0}" x2="${x1}" y2="${y1}" class="limit"/>`; }
  return s;
}

function updateDash() {
  const v = st.v; if (!v || !$('#gsvg')) return;
  const kmh = Math.abs(C.speedKmh(v.erpm, geo())), w = v.voltage * v.inputCurrent, p = pct(), th = thresholds();
  const maxPow = Math.max(2000, ...S.modes.map((x) => x.power)), gmax = S.gaugeMax || 80;
  const lim = st.temp ? Math.abs(C.speedKmh(st.temp.maxERPM, geo())) : null;
  $('#gsvg').innerHTML = gaugeSVG(U.spd(kmh) / gmax, Math.max(w, 0) / maxPow, w < -20 ? -w / (maxPow / 2) : 0, gmax, lim && U.spd(lim) < gmax ? U.spd(lim) / gmax : null, st.overSpeed);
  $('#speed').textContent = show(U.spd(kmh)); $('#speed').classList.toggle('over', st.overSpeed);
  $('#watts').innerHTML = w < -20 ? `<span class="green">${ICON.regen} ${show(-w)} W regen</span>` : `${show(w)} W`;
  const pf = st.perf.last; $('#perf').textContent = pf ? `0–${pf.target} in ${pf.sec.toFixed(1)} s` : '';
  const bc = p <= S.battery.critical ? 'var(--red)' : p <= S.battery.low ? 'var(--amber)' : 'var(--green)';
  const ring = $('#bring'), circ = 2 * Math.PI * 16; ring.style.strokeDasharray = `${circ * p / 100} ${circ}`; ring.style.stroke = bc;
  $('#bpct').textContent = `${show(p)}%`; $('#bvolt').textContent = `${show(v.voltage, 1)} V`;
  $('#htrip').textContent = show(U.dist(st.trip.km), 1); $('#htemp').textContent = show(v.tempMosfet);
  const remWh = C.nominalWh(S.battery) * p / 100, wpk = st.trip.whPerKm;
  $('#tiles').innerHTML = [
    tile('Battery', show(v.inputCurrent, 1), 'A', v.inputCurrent < 0 ? 'green' : '', v.inputCurrent < 0 ? 'charging (regen)' : `${show(v.voltage / S.battery.cells, 2)} V/cell`, ICON.batt),
    tile('Motor current', show(v.motorCurrent, 1), 'A', '', '', ICON.motor),
    tile('Motor RPM', show(v.erpm / geo().polePairs), '', '', `ERPM ${show(v.erpm)}`, ICON.rpm),
    tile('Duty cycle', show(v.duty * 100), '%', Math.abs(v.duty) > 0.9 ? 'amber' : '', Math.abs(v.duty) > 0.9 ? 'near motor top speed' : '', ICON.duty),
    tile('Controller', show(v.tempMosfet), '°C', tempCls(v.tempMosfet, th.fetStart), `limit from ${th.fetStart} °C`, ICON.temp),
    tile('Motor', motorSensor() ? show(v.tempMotor) : '—', '°C', motorSensor() ? tempCls(v.tempMotor, th.motorStart) : '', motorSensor() ? `limit from ${th.motorStart} °C` : 'no sensor', ICON.temp),
    tile('Odometer', show(st.odo == null ? null : U.dist(st.odo / 1000), 1), U.d, '', st.odoSupported === false ? 'not reported' : `max ${show(U.spd(st.trip.maxKmh))} ${U.s} this trip`, ICON.odo),
    tile('Consumption', show(wpk == null ? null : S.units === 'mph' ? wpk / MPH : wpk, 1), S.units === 'mph' ? 'Wh/mi' : 'Wh/km', '', wpk == null ? 'needs ≥ 0.3 km' : `${show(st.trip.netWh, 1)} Wh this trip`, ICON.eff),
    tile('Est. range', show(wpk ? U.dist(remWh / wpk) : null), U.d, 'neon', `≈${show(remWh)} Wh left`, ICON.range),
    tile('Power', show(w), 'W', w < 0 ? 'green' : '', `peak ${show(st.peaks.maxW)} W`, ICON.bolt),
  ].join('');
}

function curveSVG(expo, w = 90, h = 56, col = 'var(--neon)') {

}

    <label>Empty voltage (V)<input type="number" id="vs-empty" value="${b.empty}" step="0.1"></label>
    <label>Capacity (Ah)<input type="number" id="vs-ah" value="${b.capacityAh}" step="0.5"></label>
    <label>Low warning (%)<input type="number" id="vs-low" value="${b.low}"></label><label>Critical warning (%)<input type="number" id="vs-crit" value="${b.critical}"></label>
    <p class="small dim">16S Li-ion: full 67.2 V. Empty 48.0 V = 3.0 V/cell; raise it if your BMS cuts off earlier.</p>`,
  [['Cancel'], ['Save & confirm', () => {
    const ng = { wheelDiameter: +$('#vs-wheel').value / 1000, polePairs: Math.round(+$('#vs-pp').value), gearRatio: +$('#vs-gear').value };
    if (!C.geometryValid(ng)) { modalInfo('Setup', 'Wheel diameter, pole pairs or gear ratio look invalid.'); return; }
    S.geometry = ng; S.geometryConfirmed = true; S.vehicleName = $('#vs-vname').value.trim() || S.vehicleName;
    S.battery = { cells: +$('#vs-cells').value, full: +$('#vs-full').value, empty: +$('#vs-empty').value, capacityAh: +$('#vs-ah').value, low: +$('#vs-low').value, critical: +$('#vs-crit').value };
    saveSettings(); render();
  }, 'primary']]);
  const imp = $('#vs-import');
  if (imp) imp.onclick = () => {
    const poles = st.mc ? st.mc.get('si_motor_poles') : st.temp && st.temp.poles, wheel = st.mc ? st.mc.get('si_wheel_diameter') : st.temp && st.temp.wheelDiameter, gear = st.mc ? st.mc.get('si_gear_ratio') : st.temp && st.temp.gearRatio;
    const cells = st.mc && st.mc.has('si_battery_cells') ? st.mc.get('si_battery_cells') : 0; if (cells >= 6 && cells <= 30) { $('#vs-cells').value = cells; $('#vs-full').value = (cells * 4.2).toFixed(1); $('#vs-empty').value = (cells * 3.0).toFixed(1); }
    if (poles >= 2 && wheel > 0.05) { $('#vs-wheel').value = Math.round(wheel * 1000); $('#vs-pp').value = Math.round(poles / 2); $('#vs-gear').value = gear || 1; imp.textContent = 'Imported — check the values'; }
    else imp.textContent = 'Controller has no usable values';
  };
}

// GPS wheel calibration: compares GPS ground speed with controller-derived speed while riding
// steadily, then suggests a corrected wheel diameter.
let gpsWatch = null;
function gpsCalibrate() {
  if (!navigator.geolocation) return modalInfo('GPS', 'This browser has no location access.');
  const samples = [];
  modal('Calibrate speed with GPS', `<p class="small">Ride in a straight line at a steady speed above 15 km/h for about 20 seconds, somewhere safe with open sky. Keep the phone mounted — don't look at it while riding.</p>
    <div class="kv"><span>GPS speed</span><b id="gp-g">—</b><span>App speed</span><b id="gp-a">—</b><span>Good samples</span><b id="gp-n">0</b><span>Suggested wheel</span><b id="gp-w">—</b></div>`,
  [['Cancel', stopGps], ['Use suggested size', () => {
    stopGps(); if (samples.length < 10) return modalInfo('GPS', 'Not enough steady samples yet (need 10).');
    const ratio = samples.reduce((a, b) => a + b, 0) / samples.length;
    S.geometry.wheelDiameter = Math.round(S.geometry.wheelDiameter * ratio * 1000) / 1000; saveSettings();
    modalInfo('Calibrated', `Wheel diameter set to ${Math.round(S.geometry.wheelDiameter * 1000)} mm (correction ${((ratio - 1) * 100).toFixed(1)} %).`); render();
  }, 'primary']]);
  gpsWatch = navigator.geolocation.watchPosition((pos) => {
    const g = pos.coords.speed == null ? null : pos.coords.speed * 3.6, a = st.v ? Math.abs(C.speedKmh(st.v.erpm, geo())) : null;
    if ($('#gp-g')) { $('#gp-g').textContent = g == null ? 'no speed from GPS yet' : `${g.toFixed(1)} km/h (±${(pos.coords.accuracy || 0).toFixed(0)} m)`; $('#gp-a').textContent = a == null ? '—' : `${a.toFixed(1)} km/h`; }
    if (g != null && a != null && g > 15 && a > 15 && (pos.coords.accuracy || 99) < 20) {
      samples.push(g / a); if (samples.length > 60) samples.shift();
      const r = samples.reduce((x, y) => x + y, 0) / samples.length;
      if ($('#gp-n')) { $('#gp-n').textContent = samples.length; $('#gp-w').textContent = `${Math.round(S.geometry.wheelDiameter * r * 1000)} mm`; }
    }
  }, (err) => { if ($('#gp-g')) $('#gp-g').textContent = 'GPS error: ' + err.message; }, { enableHighAccuracy: true, maximumAge: 0 });
}
function stopGps() { if (gpsWatch != null) navigator.geolocation.clearWatch(gpsWatch); gpsWatch = null; }

function hardwareSetup() {
  const h = S.hw;
  modal('Hardware limits', `<p class="small dim">Defaults: FSESC 75/200 Pro model designation (75 V / 200 A) and your current 55 A battery setting; 10 A regen is a placeholder. Enter your battery/BMS real ratings.</p>
    <label>Controller max voltage (V)<input type="number" id="hw-v" value="${h.maxVoltage}"></label>
    <label>Controller max motor current (A)<input type="number" id="hw-mc" value="${h.maxMotorCurrent}"></label>
    <label>Battery max discharge (A)<input type="number" id="hw-bd" value="${h.battMaxDischarge}"></label>
    <label>Battery max charge / regen (A)<input type="number" id="hw-bc" value="${h.battMaxCharge}"></label>
    <label>Max MOSFET cutoff (°C)<input type="number" id="hw-ft" value="${h.maxFetCutoff}"></label>
    <label>Max motor cutoff (°C)<input type="number" id="hw-mt" value="${h.maxMotorCutoff}"></label>
    <label>Field weakening ≤ % of motor current<input type="number" id="hw-fw" value="${Math.round(h.maxFwFraction * 100)}"></label>
    <label>Absolute speed limit (km/h)<input type="number" id="hw-sp" value="${h.maxSpeedKmh}"></label>`,
  [['Cancel'], ['Save & confirm', () => {
    Object.assign(S.hw, { maxVoltage: +$('#hw-v').value, maxMotorCurrent: +$('#hw-mc').value, battMaxDischarge: +$('#hw-bd').value, battMaxCharge: +$('#hw-bc').value, maxFetCutoff: +$('#hw-ft').value, maxMotorCutoff: +$('#hw-mt').value, maxFwFraction: +$('#hw-fw').value / 100, maxSpeedKmh: +$('#hw-sp').value });
    S.hwConfirmed = true; saveSettings(); render();
  }, 'primary']]);
}

function backupsView() {
  modal('Configuration backups', `<p class="small dim">Stored in this browser. Download a copy to keep it safe. Restoring only works on the same controller with the same firmware layout, and makes a new backup first.</p>
    <div class="row"><button class="btn small" id="bk-dl">Download all</button><label class="btn small">Import file<input type="file" id="bk-up" accept=".json" hidden></label></div>
    ${backups.length ? backups.map((b) => `<div class="chg"><b>${b.kind === 'mcconf' ? 'Motor' : 'App'} config · FW ${b.fw}</b> <span class="small dim">${new Date(b.at).toLocaleString()}</span>
      <div class="small dim">${esc(b.note)}${st.fw && b.uuid !== st.fw.uuid ? ' · <span class="amber">different controller</span>' : ''}</div>
      <button class="btn small" data-restore="${b.id}" ${st.ready ? '' : 'disabled'}>Restore…</button></div>`).join('') : '<p class="dim">No backups yet.</p>'}`, [['Close']]);
  $('#bk-dl').onclick = downloadBackups;
  $('#bk-up').onchange = async (e) => { try { const arr = JSON.parse(await e.target.files[0].text()); const ids = new Set(backups.map((b) => b.id)); backups = backups.concat(arr.filter((b) => b.hex && !ids.has(b.id))).sort((a, b) => b.at - a.at); saveBackups(); backupsView(); } catch (err) { modalInfo('Import', err.message); } };
  $('#modal').addEventListener('click', (e) => {
    const id = e.target.dataset.restore; if (!id) return;
    const bk = backups.find((b) => b.id === id); let summary = 'Cannot compare with the connected controller.';
    try { const t = new C.ConfigBlob(bk.kind, C.unhex(bk.hex)), cur = bk.kind === 'mcconf' ? st.mc : st.app; const ch = cur && cur.sig === t.sig ? t.changes(cur) : null; if (ch) summary = ch.length ? `${ch.length} field(s) will change:<br>` + ch.slice(0, 12).map((c) => `<span class="mono small">${esc(c.name)}: ${show(c.old, 3)} → ${show(c.new, 3)}</span>`).join('<br>') : 'Identical to current configuration.'; } catch {}
    modal('Restore this backup?', `<p>${summary}</p><p class="small">Scooter must be stationary with throttle released.</p>`, [['Cancel'], ['Restore', () => runTask(() => restoreBackup(bk)), 'danger', S.readOnly]]);
  });
}

// ---------------- modal helpers ----------------
function modal(title, body, buttons) {
  const m = $('#modal'); const fresh = m.cloneNode(false); m.replaceWith(fresh);
  fresh.innerHTML = `<div class="sheet"><h2>${esc(title)}</h2><div class="body">${body}</div><div class="actions">${buttons.map(([l, , cls, dis], i) => `<button class="btn ${cls || ''}" data-i="${i}" ${dis ? 'disabled' : ''}>${l}</button>`).join('')}</div></div>`;
  fresh.hidden = false;
  fresh.querySelectorAll('.actions button').forEach((b) => b.onclick = () => { const fn = buttons[+b.dataset.i][1]; closeModal(); fn && fn(); });
  fresh.onclick = (e) => { if (e.target === fresh) closeModal(); };
}
function closeModal() { $('#modal').hidden = true; if (typeof stopGps === 'function') stopGps(); }
function modalInfo(title, html) { modal(title, `<p>${html.replace(/\n/g, '<br>')}</p>`, [['OK', null, 'primary']]); }
async function runTask(fn) {
  modal('Working…', '<div class="spinner"></div><p class="center dim">Checking the scooter is stationary and talking to the controller…</p>', []);
  try { const msg = await fn(); modalInfo('Done', esc(msg)); } catch (e) { modalInfo('Not done', esc(e.message)); }
  render();
}

// ---------------- events ----------------
document.addEventListener('click', (e) => {
  const tb = e.target.closest('[data-tab]'); if (tb) { st.tab = tb.dataset.tab; render(); window.scrollTo(0, 0); return; }
  const rg = e.target.closest('[data-range]'); if (rg) { graphRange = +rg.dataset.range; render(); return; }
  const rc = e.target.closest('[data-ride]'); if (rc) { rideDetail(rc.dataset.ride); return; }
  const pr = e.target.closest('[data-pref]'); if (pr) { const k = pr.dataset.pref; S[k] = k === 'gaugeMax' ? +pr.dataset.val : pr.dataset.val; saveSettings(); render(); return; }
  if (e.target.closest('#ride') && !e.target.closest('[data-act]')) return;
  const el = e.target.closest('[data-act]'); if (!el) return;
  const k = el.dataset.k;
  switch (el.dataset.act) {
    case 'connect': connectBLE(); break;
    case 'demo': startDemo(); break;
    case 'disconnect': disconnect(); break;
    case 'retry': if (transport) beginSession(transport); break;
    case 'rec': st.recording ? stopRecording() : startRecording(); break;
    case 'resettrip': modalInfo('Trip', resetTrip() ? 'Ride saved to the Rides tab and trip reset.' : 'Trip reset.'); render(); break;
    case 'plan': reviewPlan(k); break;
    case 'editmode': editMode(modeById(k)); break;
    case 'newmode': newMode(); break;
    case 'moveup': { const i = S.modes.findIndex((m) => m.id === k); if (i > 0) { [S.modes[i - 1], S.modes[i]] = [S.modes[i], S.modes[i - 1]]; saveSettings(); render(); } break; }
    case 'rideview': openRideView(); break;
    case 'closeride': closeRideView(); break;
    case 'exportrides': exportRides(); break;
    case 'gpson': S.gps = true; saveSettings(); if (st.ready) gpsStart(); if (navigator.geolocation) navigator.geolocation.getCurrentPosition(() => {}, () => modalInfo('GPS', 'Location permission was denied. Allow it in your browser settings.')); render(); break;
    case 'regencal': regenCalibrate(); break;
    case 'regenperm': regenPermanent(); break;
    case 'regenapply': regenConfirm(); break;
    case 'quick': quickReconnect().then((ok) => { if (!ok) connectBLE(); }); break;
    case 'clearrides': modal('Delete all rides?', '<p>All saved rides, routes and records in this browser will be deleted.</p>', [['Cancel'], ['Clear', () => { rides = []; saveRides(); render(); }, 'danger']]); break;
    case 'exportapp': download(`vescdash-settings-${stamp()}.json`, JSON.stringify({ settings: S, baselines, rides, perf: perfBest }, null, 1), 'application/json'); break;
    case 'gps': gpsCalibrate(); break;
    case 'restore': modal('Restore normal limits?', '<p>Scooter must be stationary with the throttle released.</p>', [['Cancel'], ['Restore', () => runTask(restoreBaseline), 'primary']]); break;
    case 'recapture': baselines[uuid()] = { limits: st.temp, appHex: st.app ? C.hex(st.app.bytes) : null, at: Date.now() }; saveBaselines(); st.tempUnknown = false; st.activeProfile = null; st.profileStatus = 'Baseline re-captured.'; render(); break;
    case 'reloadcfg': runTask(async () => { await refreshConfig('mcconf'); await refreshConfig('appconf'); return 'Configuration reloaded.'; }); break;
    case 'review': reviewChanges(); break;
    case 'backupnow': runTask(backupNow); break;
    case 'backups': backupsView(); break;
    case 'vehicle': vehicleSetup(); break;
    case 'hw': hardwareSetup(); break;
    case 'clearlog': st.console = []; renderConsole(); break;
    case 'readonly':
      e.preventDefault();
      if (S.readOnly) modal('Enable writing to the controller?', '<p>Profiles and settings changes will be sent to your controller after confirmation. Wrong settings can damage the controller, motor or battery, or make the scooter unsafe. Backups are made automatically before every write.</p>',
        [['Keep read-only'], ['Enable writes', () => { S.readOnly = false; saveSettings(); render(); }, 'danger']]);
      else { S.readOnly = true; saveSettings(); render(); }
      break;
  }
});
document.addEventListener('change', (e) => {
  const t = e.target;
  if (t.dataset.setting) {
    const k = t.dataset.setting; S[k] = t.type === 'checkbox' ? t.checked : (t.dataset.str ? t.value : +t.value); saveSettings();
    if (k === 'pollHz') $('#hzv').textContent = t.value; else if (['units', 'accent', 'gaugeMax', 'speedAlert', 'showDemoRides', 'showAllDevices', 'autoMode', 'gps'].includes(k)) { if (k === 'gps') { S.gps ? (st.ready && gpsStart()) : gpsStop(); } render(); }
  }
  if (t.id === 'importapp' && t.files[0]) {
    t.files[0].text().then((txt) => { const d = JSON.parse(txt); if (!d.settings || !Array.isArray(d.settings.modes)) throw new Error('Not a VESCDash settings file.');
      Object.assign(S, d.settings); saveSettings(); if (d.baselines) { Object.assign(baselines, d.baselines); saveBaselines(); } if (d.rides) { rides = d.rides; saveRides(); }
      modalInfo('Imported', 'Settings, modes and ride history imported.'); render(); }).catch((err) => modalInfo('Import failed', esc(err.message)));
  }
  if (t.dataset.settingSt) st[t.dataset.settingSt] = t.checked;
  if (t.id === 'rg-on') { st.regenDraft.on = t.checked; render(); return; }
  if (t.id === 'rg-pct') { render(); return; }
  if (t.dataset.field) {
    const blob = t.dataset.kind === 'mcconf' ? st.editMc : st.editApp;
    try { blob.set(t.dataset.field, +t.value / +t.dataset.factor); } catch (err) { modalInfo('Invalid value', esc(err.message)); }
    render();
  }
});
document.addEventListener('input', (e) => {
  if (e.target.id === 'rg-pct') {
    const v = +e.target.value; st.regenDraft.pct = v; e.target.style.setProperty('--p', (v - 5) / 55 * 100 + '%');
    $('#rg-pv').textContent = `${v} % · ${v < 20 ? 'Light' : v < 40 ? 'Medium' : v < 55 ? 'Strong' : 'Max'}`;
    const maxA = st.mc && st.mc.has('l_current_min') ? Math.abs(st.mc.get('l_current_min')) * (st.temp ? st.temp.currentMinScale : 1) : null;
    if (maxA && $('#rg-info')) $('#rg-info').textContent = `≈ ${Math.round(v / 100 * maxA)} A of brake current when the throttle is released`;
  } if (e.target.dataset.setting === 'pollHz') $('#hzv').textContent = e.target.value; });
setInterval(() => { if (st.tab === 'bt' && $('#linkstats')) $('#linkstats').innerHTML = linkStats(); }, 1000);

applyAccent();
render();

})();
</script></body></html>
