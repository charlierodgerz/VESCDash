<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#000000"><meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<title>VESCDash</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
<style>:root{--bg:#000;--panel:#090d13;--stroke:rgba(0,140,255,.22);--neon:#00b8ff;--neon2:#3de3ff;--amber:#ffb021;--red:#ff3b4f;--green:#33f29a;--dim:rgba(255,255,255,.55);--faint:rgba(255,255,255,.32);--font:ui-rounded,"SF Pro Rounded",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:#fff;font-family:var(--font);font-size:15px}
body{padding-bottom:calc(76px + env(safe-area-inset-bottom))}
h1{font-size:24px;margin:14px 2px 10px}h2{margin:0 0 8px;font-size:19px}
main{max-width:640px;margin:0 auto;padding:0 14px 20px}
#demo{background:var(--amber);color:#000;font-weight:800;font-size:11px;letter-spacing:.06em;text-align:center;padding:6px;position:sticky;top:0;z-index:5}
#alerts{position:sticky;top:0;z-index:4;max-width:640px;margin:0 auto;padding:0 10px}
.alert{display:flex;flex-direction:column;padding:9px 12px;border-radius:12px;margin-top:6px;font-size:13px}
.alert b{font-size:14px}.alert.critical{background:rgba(255,59,79,.92)}.alert.caution{background:rgba(255,176,33,.92);color:#000}
.card{background:var(--panel);border:1px solid var(--stroke);border-radius:18px;padding:14px;margin:12px 0}
.center{text-align:center}
.head,.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.row{margin:8px 0}.sp{flex:1}
.lbl{font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--dim);margin:6px 0}
.dim{color:var(--dim)}.faint{color:var(--faint)}.small{font-size:12px}.mono{font-family:ui-monospace,Menlo,monospace}
.neon{color:var(--neon)}.amber{color:var(--amber)}.red{color:var(--red)}.green{color:var(--green)}.warn{color:var(--amber)}
.btn{font:inherit;font-weight:600;color:#fff;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.12);border-radius:12px;padding:10px 14px;cursor:pointer}
.btn:disabled{opacity:.35}.btn.primary{background:var(--neon);border-color:var(--neon);color:#001018}.btn.danger{background:var(--red);border-color:var(--red)}
.btn.amber{background:var(--amber);border-color:var(--amber);color:#000}.btn.ghost{background:none;border-color:transparent;color:var(--neon)}.btn.small{padding:6px 10px;font-size:13px}.btn.wide{width:100%;margin-top:6px}
.brand{color:var(--neon);font-weight:800;letter-spacing:.15em;font-size:13px}
.pill{border:1.5px solid var(--neon);color:var(--neon);border-radius:99px;padding:3px 11px;font-weight:800;font-size:12px;margin-left:auto}.pill.solid{background:var(--neon);color:#000;margin-left:0}
.gauge{position:relative;width:min(300px,82vw);margin:0 auto;aspect-ratio:1}
.gauge svg{width:100%;height:100%}.gauge path{fill:none;stroke-linecap:round}.gauge .track{stroke:rgba(255,255,255,.07)}
.gauge .fill{stroke:var(--neon);filter:drop-shadow(0 0 8px var(--neon));transition:d .3s}.gauge .fill2{stroke:var(--neon2);filter:drop-shadow(0 0 5px var(--neon2))}
.gcenter{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.big{font-size:min(84px,22vw);font-weight:700;font-variant-numeric:tabular-nums;line-height:1;text-shadow:0 0 18px rgba(0,184,255,.6)}
.unit{color:var(--dim);font-weight:600}.watts{margin-top:12px;font-size:20px;color:var(--neon2);font-variant-numeric:tabular-nums}.watts.green{color:var(--green)}
.batt{display:flex;align-items:baseline;gap:6px;font-size:18px;font-weight:600;font-variant-numeric:tabular-nums;margin-top:4px}
.bar{height:8px;border-radius:9px;background:rgba(255,255,255,.07);overflow:hidden;margin-top:6px}.bar div{height:100%;border-radius:9px;transition:width .5s;background:var(--green)}
.bar .amber{background:var(--amber)}.bar .red{background:var(--red)}.bar .green{background:var(--green);box-shadow:0 0 8px var(--green)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:8px 0}
.tile{background:var(--panel);border:1px solid var(--stroke);border-radius:14px;padding:11px 12px;min-width:0}
.tt{font-size:10px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tv{font-size:22px;font-weight:600;font-variant-numeric:tabular-nums;margin-top:3px;white-space:nowrap}.tv small{font-size:11px;color:var(--dim);margin-left:3px;font-weight:500}
.tf{font-size:10px;color:var(--faint);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.foot{color:var(--faint);font-size:11px;margin:10px 4px}
.pname{font-size:26px;font-weight:800}.curve path{fill:none;stroke:var(--neon);stroke-width:2}.curve{border:1px solid var(--stroke);border-radius:8px}
.seg{display:flex;background:rgba(255,255,255,.06);border-radius:10px;padding:3px}.seg button{flex:1;font:inherit;color:var(--dim);background:none;border:0;padding:7px;border-radius:8px}.seg .on{background:rgba(255,255,255,.14);color:#fff}
.chart canvas{width:100%;height:110px;display:block}
.set{padding:10px 0;border-top:1px solid rgba(255,255,255,.06)}.set:first-of-type{border-top:0}.set.changed{background:linear-gradient(90deg,rgba(0,184,255,.08),transparent);margin:0 -14px;padding:10px 14px}
.set label{display:flex;justify-content:space-between;align-items:center;gap:10px}.in{display:flex;align-items:center;gap:5px}.in small{color:var(--dim);min-width:30px}
input[type=number]{font:inherit;font-variant-numeric:tabular-nums;color:#fff;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.14);border-radius:9px;padding:8px;width:110px;text-align:right}
.sheet input[type=number]{width:100%;text-align:left;margin-top:4px}.sheet label{display:block;margin:8px 0;font-size:13px;color:var(--dim)}
input[type=range]{width:100%;accent-color:var(--neon)}
.chk{display:flex!important;align-items:center;gap:8px;margin:10px 0;color:#fff!important}.chk input{width:20px;height:20px;accent-color:var(--neon)}.chk.big{font-size:16px;font-weight:600}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 12px;font-size:14px}.kv span{color:var(--dim)}.kv b{font-weight:500;word-break:break-all}
.dot{width:9px;height:9px;border-radius:50%;display:inline-block}.dot.green{background:var(--green);box-shadow:0 0 6px var(--green)}.dot.amber{background:var(--amber)}.dot.red{background:var(--red)}.dot.grey{background:var(--faint)}
.console{font-family:ui-monospace,Menlo,monospace;font-size:11px;max-height:260px;overflow:auto;line-height:1.5;word-break:break-all}
.chg{padding:6px 0;border-bottom:1px solid rgba(255,255,255,.06)}.issue{font-size:13px;padding:6px 8px;border-radius:8px;margin:4px 0}.issue.blocked{background:rgba(255,59,79,.18);color:#ff8d99}.issue.warning{background:rgba(255,176,33,.15);color:var(--amber)}
#tabs{position:fixed;bottom:0;left:0;right:0;display:flex;background:#050608;border-top:1px solid rgba(255,255,255,.08);padding-bottom:env(safe-area-inset-bottom);z-index:6}
.tab{flex:1;background:none;border:0;color:var(--faint);font:inherit;font-size:10px;padding:8px 0 6px;display:flex;flex-direction:column;align-items:center;gap:3px}
.tab svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}.tab.on{color:var(--neon)}
#modal{position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:10;display:flex;align-items:flex-end;justify-content:center}#modal[hidden]{display:none}
.sheet{background:#0d1219;border:1px solid var(--stroke);border-radius:20px 20px 0 0;width:100%;max-width:640px;max-height:88vh;display:flex;flex-direction:column;padding:16px 16px calc(14px + env(safe-area-inset-bottom))}
.sheet .body{overflow:auto;flex:1}.actions{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;padding-top:12px}
.spinner{width:34px;height:34px;border:3px solid rgba(255,255,255,.15);border-top-color:var(--neon);border-radius:50%;margin:16px auto;animation:spin 1s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}
ul{padding-left:18px}
/* v2 */
.cen{justify-content:center}.hero{padding:30px 16px}.logo{font-size:44px;filter:drop-shadow(0 0 14px var(--neon))}
.iconbtn{font:inherit;font-size:16px;color:#fff;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.12);border-radius:10px;width:34px;height:34px;cursor:pointer}.iconbtn:disabled{opacity:.3}
.dimpill{border-color:var(--faint)!important;color:var(--dim)!important;margin-left:0}
.chips{display:flex;gap:8px;overflow-x:auto;padding:12px 2px 2px;scrollbar-width:none}.chips::-webkit-scrollbar{display:none}
.chip{flex:none;font:inherit;font-weight:700;font-size:14px;color:#fff;background:var(--panel);border:1.5px solid color-mix(in srgb,var(--c) 45%,transparent);border-radius:99px;padding:8px 14px;display:flex;gap:6px;align-items:center;cursor:pointer}
.chip.on{background:var(--c);color:#000;box-shadow:0 0 16px color-mix(in srgb,var(--c) 60%,transparent)}.chip.normal{--c:#888;color:var(--dim)}
.gauge-card{border-color:color-mix(in srgb,var(--mc,var(--neon)) 35%,transparent)}
.gauge .tick{stroke:rgba(255,255,255,.18);stroke-width:1.5}.gauge .tick.major{stroke:rgba(255,255,255,.4);stroke-width:2}
.gauge .ticklbl{fill:rgba(255,255,255,.4);font-size:10px;text-anchor:middle;font-family:var(--font)}
.gauge .limit{stroke:var(--red);stroke-width:4;stroke-linecap:round;filter:drop-shadow(0 0 4px var(--red))}
.gauge .fill.over{stroke:var(--red);filter:drop-shadow(0 0 10px var(--red))}.big.over{color:var(--red);text-shadow:0 0 22px rgba(255,59,79,.8)}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.mode{border-color:color-mix(in srgb,var(--c) 40%,transparent);background:linear-gradient(160deg,color-mix(in srgb,var(--c) 10%,var(--panel)),var(--panel) 55%)}
.micon{font-size:24px}.mode .pname{font-size:22px}
.mbar{display:grid;grid-template-columns:64px 1fr 74px;gap:8px;align-items:center;font-size:12px;margin:5px 0}.mbar span{color:var(--dim)}.mbar b{text-align:right;font-variant-numeric:tabular-nums}
.mbar div{height:7px;background:rgba(255,255,255,.07);border-radius:9px;overflow:hidden}.mbar i{display:block;height:100%;border-radius:9px;box-shadow:0 0 8px currentColor}
.modebtn{background:color-mix(in srgb,var(--c) 85%,#000);border-color:var(--c);color:#000}
.tpls{display:grid;grid-template-columns:1fr 1fr;gap:8px}.tpl{font:inherit;color:#fff;background:var(--panel);border:1.5px solid color-mix(in srgb,var(--c) 50%,transparent);border-radius:14px;padding:12px;text-align:left;display:flex;flex-direction:column;gap:2px;cursor:pointer}.tpl span{font-size:22px}.tpl small{color:var(--dim)}
.sl{display:block!important;margin:12px 0!important;color:#fff!important}.slh{display:flex;justify-content:space-between;font-size:14px}.slh b{color:var(--neon);font-variant-numeric:tabular-nums}.sl small{display:block;margin-top:2px}
.colors{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}.sw{width:28px;height:28px;border-radius:50%;border:2px solid transparent;cursor:pointer}.sw.on{border-color:#fff;box-shadow:0 0 0 2px #000 inset}
input[type=text]{font:inherit;color:#fff;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.14);border-radius:9px;padding:9px}.emoji{width:52px;text-align:center;font-size:20px}.name{flex:1;font-weight:700;font-size:17px}
.ride{padding:9px 0;border-top:1px solid rgba(255,255,255,.06)}.rgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:2px 8px;font-size:12px;color:var(--dim);margin-top:3px}.rgrid b{color:#fff}
.prefrow{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:10px 0}.prefrow .seg{flex:none}.seg.small button{padding:5px 10px;font-size:13px}.prefrow input{width:80px}
#ride{position:fixed;inset:0;z-index:9;background:radial-gradient(circle at 50% 40%,color-mix(in srgb,var(--mc) 16%,#000),#000 70%);display:flex;flex-direction:column;padding:calc(12px + env(safe-area-inset-top)) 18px calc(18px + env(safe-area-inset-bottom))}#ride[hidden]{display:none}
.rv-top{display:flex;align-items:center;gap:10px;font-weight:700}.rv-mode{color:var(--mc);font-size:18px;letter-spacing:.06em}
.rv-speed{font-size:min(46vw,40vh);font-weight:800;text-align:center;line-height:1;margin-top:auto;font-variant-numeric:tabular-nums;text-shadow:0 0 40px color-mix(in srgb,var(--mc) 70%,transparent)}.rv-speed.over{color:var(--red)}
.rv-unit{text-align:center;color:var(--dim);font-size:20px;font-weight:600}
.rv-power{height:12px;border-radius:9px;background:rgba(255,255,255,.08);margin:24px 0 18px;overflow:hidden}.rv-power div{height:100%;background:var(--mc);box-shadow:0 0 14px var(--mc);transition:width .25s}
.rv-row{display:grid;grid-template-columns:repeat(4,1fr);text-align:center;margin-bottom:auto}.rv-row b{display:block;font-size:24px;font-variant-numeric:tabular-nums}.rv-row small{color:var(--dim)}
@media (orientation:landscape){.rv-speed{font-size:min(30vw,52vh)}}
.gauge-card .gauge .fill:not(.over){stroke:var(--mc,var(--neon));filter:drop-shadow(0 0 8px var(--mc,var(--neon)))}
/* v3 */
#toasts{position:fixed;left:0;right:0;top:calc(10px + env(safe-area-inset-top));z-index:20;display:flex;flex-direction:column;align-items:center;gap:6px;pointer-events:none}
.toast{background:rgba(20,26,36,.96);border:1px solid var(--neon);color:#fff;padding:10px 16px;border-radius:14px;font-weight:600;box-shadow:0 8px 30px rgba(0,0,0,.6);animation:tin .3s;transition:opacity .4s,transform .4s}
.toast.warn{border-color:var(--amber)}.toast.out{opacity:0;transform:translateY(-10px)}@keyframes tin{from{opacity:0;transform:translateY(-10px)}}
.hero-rec{text-align:center;background:radial-gradient(circle at 50% 0%,color-mix(in srgb,var(--neon) 22%,var(--panel)),var(--panel) 70%)}
.rec-big{font-size:64px;font-weight:800;font-variant-numeric:tabular-nums;line-height:1.05;text-shadow:0 0 24px color-mix(in srgb,var(--neon) 60%,transparent)}.rec-big small{font-size:18px;color:var(--dim);margin-left:6px}
.month{margin:18px 4px 6px}
.ridecard{display:block;width:100%;text-align:left;font:inherit;color:#fff;background:var(--panel);border:1px solid var(--stroke);border-radius:16px;padding:12px;margin:8px 0;cursor:pointer}
.rc-top{display:flex;align-items:center;gap:6px;flex-wrap:wrap}.tag{font-size:11px;padding:2px 7px;border-radius:99px;background:rgba(255,255,255,.08);color:var(--dim)}.tag.gold{background:rgba(255,200,40,.18);color:#ffd447}
.spark{width:100%;height:34px;display:block;margin:6px 0}
.map{height:240px;border-radius:14px;overflow:hidden;margin:10px 0;background:#111}.legend{display:flex;align-items:center;gap:6px;color:var(--dim)}.legend i{flex:1;height:5px;border-radius:5px;background:linear-gradient(90deg,hsl(200,100%,55%),hsl(100,100%,55%),hsl(0,100%,55%))}
.rdchart{width:100%;height:120px;display:block}
.regen{border-color:rgba(51,242,154,.35);background:linear-gradient(160deg,rgba(51,242,154,.08),var(--panel) 55%)}
.shake{animation:shake .35s}@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
#tabs .tab span{font-size:9.5px}
/* ================= v4 theme ================= */
:root{--font:"Inter",ui-rounded,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;--num:"Rajdhani","SF Pro Rounded",ui-rounded,system-ui,sans-serif;
  --bg:#03050a;--glass:rgba(16,22,34,.62);--glass2:rgba(22,30,46,.7);--line:rgba(120,170,255,.12);--line2:rgba(120,170,255,.22)}
html,body{background:var(--bg)}
body{font-family:var(--font);letter-spacing:-.005em;padding-bottom:calc(96px + env(safe-area-inset-bottom))}
.bgfx{position:fixed;inset:0;z-index:-1;pointer-events:none;
  background:radial-gradient(60% 40% at 15% -5%,color-mix(in srgb,var(--neon) 22%,transparent),transparent 70%),
    radial-gradient(50% 35% at 100% 10%,rgba(176,124,255,.14),transparent 70%),
    radial-gradient(70% 50% at 50% 110%,color-mix(in srgb,var(--neon) 10%,transparent),transparent 70%),var(--bg)}
.bgfx::after{content:"";position:absolute;inset:0;background-image:linear-gradient(rgba(255,255,255,.025) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.025) 1px,transparent 1px);background-size:32px 32px;mask-image:linear-gradient(#000,transparent 75%)}
h1{font-family:var(--num);font-weight:700;font-size:30px;letter-spacing:.01em;margin:18px 2px 8px}
h2{font-family:var(--num);font-weight:700;font-size:22px}
.card,.tile,.ridecard{background:var(--glass);border:1px solid var(--line);backdrop-filter:blur(18px) saturate(140%);-webkit-backdrop-filter:blur(18px) saturate(140%);box-shadow:0 10px 30px rgba(0,0,0,.35),inset 0 1px 0 rgba(255,255,255,.05)}
.card{border-radius:22px;padding:16px}
.lbl{font-family:var(--num);font-size:12px;letter-spacing:.18em}
.btn{border-radius:14px;padding:11px 16px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);transition:transform .12s,box-shadow .2s,background .2s}
.btn:active{transform:scale(.97)}
.btn.primary{background:linear-gradient(135deg,color-mix(in srgb,var(--neon) 85%,#fff),var(--neon) 45%,color-mix(in srgb,var(--neon) 70%,#5a2bff));border:0;color:#00121c;font-weight:700}
.btn.glow{box-shadow:0 0 0 1px color-mix(in srgb,var(--neon) 50%,transparent),0 8px 28px color-mix(in srgb,var(--neon) 45%,transparent)}
.btn.big{font-size:17px;padding:15px 28px;border-radius:18px}
.btn.ghost{background:none;border:0}
.iconbtn{width:40px;height:40px;border-radius:14px;background:var(--glass2);border:1px solid var(--line);display:grid;place-items:center;padding:0}
.iconbtn svg{width:20px;height:20px}
.linkbtn{font:inherit;font-size:13px;color:var(--dim);background:none;border:0;padding:6px 0;text-decoration:underline;text-underline-offset:3px;cursor:pointer}

/* hero (not connected) */
.hero{display:flex;flex-direction:column;align-items:center;gap:12px;padding:40px 10px 10px;text-align:center}
.hero-title{font-size:34px;margin:6px 0 0}
.hero-orb{position:relative;width:170px;height:170px;display:grid;place-items:center;margin-bottom:6px}
.orb-ring{position:absolute;inset:0;border-radius:50%;background:conic-gradient(from 0deg,transparent,var(--neon),transparent 40%);animation:spin 3.5s linear infinite;mask:radial-gradient(circle,transparent 62%,#000 63%)}
.orb-core{width:110px;height:110px;border-radius:50%;display:grid;place-items:center;color:var(--neon);background:radial-gradient(circle at 35% 30%,color-mix(in srgb,var(--neon) 30%,#0b1220),#05070c 70%);box-shadow:0 0 50px color-mix(in srgb,var(--neon) 35%,transparent),inset 0 0 20px color-mix(in srgb,var(--neon) 25%,transparent)}
.orb-core svg{width:50px;height:50px;filter:drop-shadow(0 0 10px var(--neon))}

/* topbar */
.topbar{display:flex;align-items:center;gap:10px;padding:16px 2px 2px}
.topbar .brand{font-family:var(--num);font-size:22px;font-weight:700;letter-spacing:.06em;color:#fff;text-transform:uppercase}
.topbar .sub{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--dim)}
.chips{padding-top:14px}
.chip{background:var(--glass);backdrop-filter:blur(12px);border-width:1px;padding:9px 15px;font-family:var(--num);font-size:15px;letter-spacing:.04em;transition:all .2s}
.chip.on{color:#000;transform:translateY(-1px)}

/* HUD gauge */
.hud{position:relative;margin:14px 0;padding:8px 10px 14px;border-radius:30px;background:radial-gradient(80% 70% at 50% 40%,color-mix(in srgb,var(--mc) 14%,rgba(10,14,22,.7)),rgba(8,11,18,.75));border:1px solid color-mix(in srgb,var(--mc) 25%,transparent);box-shadow:0 20px 60px rgba(0,0,0,.5),inset 0 1px 0 rgba(255,255,255,.06),0 0 80px color-mix(in srgb,var(--mc) 12%,transparent)}
.hud .gauge{width:min(330px,88vw)}
.gauge .seg{stroke:rgba(255,255,255,.08);stroke-width:5;stroke-linecap:round}
.gauge .seg.on{stroke:var(--mc)}.gauge .seg.over{stroke:var(--red)}
.gauge .seg.tip{stroke:#fff;stroke-width:6;filter:drop-shadow(0 0 6px var(--mc)) drop-shadow(0 0 12px var(--mc))}
.gauge .glbl{fill:rgba(255,255,255,.38);font:600 12px var(--num);text-anchor:middle}
.gauge .ptrack{fill:none;stroke:rgba(255,255,255,.05);stroke-width:4;stroke-linecap:round}
.gauge .powarc{fill:none;stroke:#3de3ff;stroke-width:4;stroke-linecap:round;filter:drop-shadow(0 0 4px #3de3ff)}
.gauge .regenarc{fill:none;stroke:var(--green);stroke-width:5;stroke-linecap:round;filter:drop-shadow(0 0 6px var(--green))}
.gauge .limit{stroke:var(--red);stroke-width:3;stroke-linecap:round;filter:drop-shadow(0 0 4px var(--red))}
.gmode{font-family:var(--num);font-size:13px;font-weight:700;letter-spacing:.2em;color:var(--mc);margin-bottom:2px}
.big{font-family:var(--num);font-size:min(104px,26vw);font-weight:700;letter-spacing:-.02em;text-shadow:0 0 30px color-mix(in srgb,var(--mc) 55%,transparent)}
.unit{font-family:var(--num);font-size:16px;letter-spacing:.15em;text-transform:uppercase}
.watts{font-family:var(--num);font-size:20px;font-weight:600;margin-top:6px;display:flex;align-items:center;gap:4px}
.watts svg{width:16px;height:16px}.perf{font-size:11px;color:var(--faint);margin-top:2px;min-height:14px}
.hud-row{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:-6px}
.hstat{display:flex;align-items:center;gap:8px;justify-content:center;background:rgba(255,255,255,.035);border:1px solid var(--line);border-radius:16px;padding:9px 6px}
.hstat b{display:block;font-family:var(--num);font-size:20px;line-height:1}.hstat small{color:var(--dim);font-size:10.5px}
.hic{width:30px;height:30px;border-radius:10px;display:grid;place-items:center;background:color-mix(in srgb,var(--mc) 16%,transparent);color:var(--mc)}.hic svg{width:17px;height:17px}
.ring{width:34px;height:34px;transform:rotate(-90deg)}.rtrack{fill:none;stroke:rgba(255,255,255,.08);stroke-width:4}.rfill{fill:none;stroke-width:4;stroke-linecap:round;transition:stroke-dasharray .5s}

/* tiles */
.grid{gap:10px}
.tile{position:relative;border-radius:18px;padding:13px 13px 12px}
.ticon{position:absolute;top:11px;right:11px;width:26px;height:26px;border-radius:9px;display:grid;place-items:center;color:var(--neon);background:color-mix(in srgb,var(--neon) 12%,transparent)}.ticon svg{width:15px;height:15px}
.tt{font-family:var(--num);font-size:11px;letter-spacing:.14em;padding-right:30px}
.tv{font-family:var(--num);font-size:28px;font-weight:700;margin-top:4px}.tv small{font-family:var(--font);font-size:11px}
.tv.neon{color:var(--neon)}
.recbar .btn{display:flex;align-items:center;gap:8px}.recdot{width:10px;height:10px;border-radius:50%;background:var(--red)}.recdot.on{animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.25}}

/* regen control */
.regen-ctl{border-radius:24px;transition:border-color .3s,box-shadow .3s}
.regen-ctl.is-on{border-color:rgba(51,242,154,.4);box-shadow:0 10px 40px rgba(51,242,154,.12),inset 0 1px 0 rgba(255,255,255,.06);background:linear-gradient(160deg,rgba(51,242,154,.12),var(--glass) 55%)}
.rg-head{display:flex;align-items:center;gap:12px}
.rg-ico{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;background:rgba(255,255,255,.06);color:var(--dim);transition:all .3s}.rg-ico svg{width:24px;height:24px}
.is-on .rg-ico{background:rgba(51,242,154,.18);color:var(--green);box-shadow:0 0 18px rgba(51,242,154,.35)}
.rg-title{font-family:var(--num);font-weight:700;font-size:20px;letter-spacing:.02em}.rg-sub{font-size:12px;color:var(--dim)}
.rg-body{margin:14px 0 10px;transition:opacity .3s}.rg-body.off{opacity:.35}
.rg-row{display:flex;justify-content:space-between;align-items:baseline}.rg-row b{font-family:var(--num);font-size:20px;color:var(--green)}
.rg-scale{display:flex;justify-content:space-between;font-size:10.5px;color:var(--faint);margin-top:2px}
.rg-info{font-size:12px;color:var(--dim);margin-top:8px}
.rg-foot{display:flex;justify-content:space-between;margin-top:4px}
input.rg-slider{-webkit-appearance:none;appearance:none;width:100%;height:10px;border-radius:10px;margin:12px 0 4px;background:linear-gradient(90deg,#1fd18a,var(--green) var(--p),rgba(255,255,255,.08) var(--p))}
input.rg-slider::-webkit-slider-thumb{-webkit-appearance:none;width:28px;height:28px;border-radius:50%;background:#fff;border:0;box-shadow:0 0 0 5px rgba(51,242,154,.3),0 4px 12px rgba(0,0,0,.5)}
input.rg-slider::-moz-range-thumb{width:28px;height:28px;border-radius:50%;background:#fff;border:0;box-shadow:0 0 0 5px rgba(51,242,154,.3)}
.switch{position:relative;width:58px;height:34px;flex:none;cursor:pointer}.switch input{opacity:0;width:0;height:0;position:absolute}
.switch span{position:absolute;inset:0;border-radius:34px;background:rgba(255,255,255,.12);transition:.25s}
.switch span::before{content:"";position:absolute;width:28px;height:28px;left:3px;top:3px;border-radius:50%;background:#fff;box-shadow:0 2px 8px rgba(0,0,0,.4);transition:.25s cubic-bezier(.3,1.4,.5,1)}
.switch input:checked+span{background:var(--green);box-shadow:0 0 16px rgba(51,242,154,.5)}.switch input:checked+span::before{transform:translateX(24px)}
.switch.dis{opacity:.4;cursor:not-allowed}
.bigchg{display:flex;align-items:center;justify-content:center;gap:18px;font-family:var(--num);font-size:34px;font-weight:700;margin:10px 0}.bigchg span{color:var(--dim)}.bigchg i{font-style:normal;color:var(--faint)}.bigchg b{color:var(--green)}

/* floating tab bar */
#tabs{left:10px;right:10px;bottom:calc(10px + env(safe-area-inset-bottom));padding:6px;border-radius:24px;background:rgba(12,16,26,.78);backdrop-filter:blur(20px) saturate(160%);-webkit-backdrop-filter:blur(20px) saturate(160%);border:1px solid var(--line2);box-shadow:0 12px 40px rgba(0,0,0,.6);max-width:620px;margin:0 auto}
.tab{border-radius:18px;padding:7px 0 5px;transition:all .2s}
.tab.on{background:color-mix(in srgb,var(--neon) 16%,transparent);box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--neon) 30%,transparent)}
.tab.on svg{filter:drop-shadow(0 0 6px var(--neon))}
#tabs .tab span{font-size:10px;font-weight:600}

/* sheets & misc */
#modal{background:rgba(0,0,0,.55);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.sheet{background:linear-gradient(180deg,rgba(24,32,48,.97),rgba(12,16,26,.98));border:1px solid var(--line2);border-radius:28px 28px 0 0;animation:sheetin .28s cubic-bezier(.2,.9,.3,1)}
@keyframes sheetin{from{transform:translateY(40px);opacity:0}}
.sheet h2{font-size:24px}
.pname{font-family:var(--num);letter-spacing:.03em}
.mode{border-radius:22px}
.mbar div{height:8px}.mbar span{font-size:12px}
.hero-rec .rec-big,.rec-big{font-family:var(--num)}
.ridecard{border-radius:20px}
.seg button{font-family:var(--num);font-size:14px;letter-spacing:.04em}
input[type=number],input[type=text]{background:rgba(255,255,255,.05);border-color:var(--line2);border-radius:12px}
.alert{border-radius:16px;backdrop-filter:blur(10px)}
.rv-speed{font-family:var(--num)}.rv-row b{font-family:var(--num)}
.kv b{font-family:var(--font)}
</style></head>

// ---------- CRC + framing ----------
const CRC_TABLE = (() => {
  const t = new Uint16Array(256);
  for (let i = 0; i < 256; i++) {
    let c = i << 8;
    for (let j = 0; j < 8; j++) c = (c & 0x8000) ? ((c << 1) ^ 0x1021) & 0xffff : (c << 1) & 0xffff;
    t[i] = c;
  }
  return t;
})();

function crc16(data) {
  let crc = 0;
  for (let i = 0; i < data.length; i++) crc = (CRC_TABLE[((crc >> 8) ^ data[i]) & 0xff] ^ (crc << 8)) & 0xffff;
  return crc;
}

const MAX_PAYLOAD = 512; // firmware PACKET_MAX_PL_LEN

function encodePacket(payload) {
  const n = payload.length;
  if (n === 0) throw new Error('empty packet');
  const head = n <= 255 ? [2, n] : n <= 65535 ? [3, n >> 8, n & 0xff] : [4, (n >> 16) & 0xff, (n >> 8) & 0xff, n & 0xff];

  return Uint8Array.from([...head, ...payload, c >> 8, c & 0xff, 3]);

    this.maxPayload = maxPayload; this.buf = []; this.resyncing = false;

  probe(s) {

const f32buf = new DataView(new ArrayBuffer(4));

function f32autoBits(v) {
  if (!isFinite(v)) throw new Error('non-finite float');

class Writer {

function decodeValues(p) {

    id: r.f32(100), iq: r.f32(100), duty: r.f16(1000), erpm: r.f32(1), voltage: r.f16(10),

const TEMP_KEYS = ['currentMinScale', 'currentMaxScale', 'minERPM', 'maxERPM', 'minDuty', 'maxDuty', 'wattMin', 'wattMax'];
function decodeTempLimits(p) {

  for (const k of TEMP_KEYS) t[k] = r.f32auto();

  if (r.remaining >= 9) { t.poles = r.u8(); t.gearRatio = r.f32auto(); t.wheelDiameter = r.f32auto(); }

/** COMM_SET_MCCONF_TEMP with store = 0 (never written to flash), ack = 1. */
function encodeTempLimits(t) {
  const w = new Writer().u8(CMD.SET_MCCONF_TEMP).u8(0).u8(0).u8(1).u8(0);
  for (const k of TEMP_KEYS) w.f32auto(t[k]);
  if (t.inCurrentMin != null && t.inCurrentMax != null) w.f32auto(t.inCurrentMin).f32auto(t.inCurrentMax);
  return w.bytes();
}

function tempLimitsEqual(a, b) {
  const eq = (x, y) => Math.abs(x - y) <= Math.max(1e-4, Math.abs(x) * 1e-5);
  for (const k of TEMP_KEYS) if (!eq(a[k], b[k])) return false;
  for (const k of ['inCurrentMin', 'inCurrentMax']) {
    if ((a[k] == null) !== (b[k] == null)) return false;
    if (a[k] != null && !eq(a[k], b[k])) return false;

}

// ---------- configuration layouts ----------

const TYPE = { a: ['u8', 1], b: ['u16', 2], c: ['i16', 2], d: ['u32', 4], e: ['i32', 4], f: ['f16', 2], g: ['f32s', 4], h: ['f32', 4] };
const layoutCache = {};
function getLayout(kind, sig) {
  const key = kind + sig;
  if (key in layoutCache) return layoutCache[key];
  const d = LAYOUT_DATA[kind][String(sig)];
  if (!d) return (layoutCache[key] = null);
  const fields = []; const map = {}; let off = 4;
  for (const tok of d.f.split(' ')) {
    const m = tok.match(/^(\d+)([a-h])(.*)$/);
    const [type, size] = TYPE[m[2]];
    const f = { name: LAYOUT_DATA.names[+m[1]], type, size, scale: m[3] ? parseFloat(m[3]) : 1, off };
    fields.push(f); map[f.name] = f; off += size;
  }
  return (layoutCache[key] = { kind, sig, fw: d.fw, fields, map, size: off });
}
const supportedFirmware = () => [...new Set(Object.values(LAYOUT_DATA.mcconf).flatMap((x) => x.fw))].sort();

class ConfigBlob {
  /** bytes = config blob without command id (starts with 32-bit signature). */
  constructor(kind, bytes) {
    if (bytes.length < 4) throw new Error('configuration too short');
    const sig = new Reader(bytes).u32();
    const layout = getLayout(kind, sig);
    if (!layout) throw new Error(`unknown configuration signature ${sig} — this firmware build is not in the verified layout table`);
    if (bytes.length !== layout.size) throw new Error(`configuration length mismatch (layout ${layout.size}, got ${bytes.length})`);
    this.kind = kind; this.layout = layout; this.bytes = Uint8Array.from(bytes);
  }
  static fromReply(kind, p) {
    expectCmd(p, kind === 'mcconf' ? CMD.GET_MCCONF : CMD.GET_APPCONF);
    return new ConfigBlob(kind, p.slice(1));
  }
  get sig() { return this.layout.sig; }
  clone() { return new ConfigBlob(this.kind, this.bytes); }
  has(n) { return n in this.layout.map; }
  get(n) {
    const f = this.layout.map[n]; if (!f) return null;
    const r = new Reader(this.bytes, f.off);
    switch (f.type) {
      case 'u8': return r.u8(); case 'u16': return r.u16(); case 'i16': return r.i16();
      case 'u32': return r.u32(); case 'i32': return r.i32();
      case 'f16': return r.f16(f.scale); case 'f32s': return r.f32(f.scale); case 'f32': return r.f32auto();
    }
  }
  set(n, v) {
    const f = this.layout.map[n]; if (!f) throw new Error(`field ${n} does not exist in this firmware`);
    if (!isFinite(v)) throw new Error(`invalid value for ${n}`);
    const w = new Writer(); const iv = Math.round(v);
    const range = (lo, hi) => { if (iv < lo || iv > hi) throw new Error(`${v} out of range for ${n}`); };
    switch (f.type) {
      case 'u8': range(0, 255); w.u8(iv); break;
      case 'u16': range(0, 65535); w.u16(iv); break;
      case 'i16': range(-32768, 32767); w.i16(iv); break;
      case 'u32': range(0, 4294967295); w.u32(iv); break;
      case 'i32': range(-2147483648, 2147483647); w.i32(iv); break;
      case 'f16': w.f16(v, f.scale); break;
      case 'f32s': w.f32(v, f.scale); break;
      case 'f32': w.f32auto(v); break;
    }
    this.bytes.set(w.bytes(), f.off);
  }
  equals(o) { return o && o.kind === this.kind && hex(o.bytes) === hex(this.bytes); }
  changes(orig) {
    if (!orig || orig.sig !== this.sig) return [];
    const out = [];
    for (const f of this.layout.fields) {
      for (let i = f.off; i < f.off + f.size; i++) {
        if (this.bytes[i] !== orig.bytes[i]) { out.push({ name: f.name, old: orig.get(f.name), new: this.get(f.name) }); break; }
      }
    }
    return out;
  }
  writePayload(cmd) { return Uint8Array.from([cmd, ...this.bytes]); }
}

// ---------- vehicle, battery, trip ----------
function speedKmh(erpm, g) {
  if (!geometryValid(g)) return 0;
  return erpm / g.polePairs / g.gearRatio * Math.PI * g.wheelDiameter * 60 / 1000;
}
function erpmForKmh(kmh, g) {
  if (!geometryValid(g)) return 0;
  return kmh * 1000 / 60 / (Math.PI * g.wheelDiameter) * g.gearRatio * g.polePairs;
}
const geometryValid = (g) => g && g.wheelDiameter > 0.05 && g.wheelDiameter < 2 && g.polePairs > 0 && g.polePairs < 100 && g.gearRatio > 0;
const tachoMeters = (steps, g) => geometryValid(g) ? steps / (g.polePairs * 6) / g.gearRatio * Math.PI * g.wheelDiameter : 0;

const CELL_CURVE = [[3.0, 0], [3.3, 5], [3.45, 10], [3.55, 20], [3.62, 30], [3.68, 40], [3.74, 50], [3.8, 60], [3.87, 70], [3.95, 80], [4.05, 90], [4.2, 100]];
function batteryPercent(v, b) {
  if (!(b.full > b.empty)) return 0;
  const t = Math.min(Math.max((v - b.empty) / (b.full - b.empty), 0), 1);
  const cell = 3.0 + t * 1.2;
  for (let i = 1; i < CELL_CURVE.length; i++) {
    const [v1, p1] = CELL_CURVE[i], [v0, p0] = CELL_CURVE[i - 1];
    if (cell <= v1) return p0 + (cell - v0) / (v1 - v0) * (p1 - p0);
  }
  return 100;
}
const nominalWh = (b) => b.cells * 3.6 * b.capacityAh;

class Trip {
  constructor() { this.reset(); }
  reset() { this.meters = 0; this.wh = 0; this.whRegen = 0; this.maxKmh = 0; this.last = null; }
  breakContinuity() { this.last = null; }
  ingest(v, g) {
    if (this.last) {
      const d = v.tachoAbs - this.last.tachoAbs;
      if (d > 0) { const m = tachoMeters(d, g); if (m < 1000) this.meters += m; }
      const dw = v.wh - this.last.wh; if (dw >= 0 && dw < 100) this.wh += dw;
      const dr = v.whCharged - this.last.whCharged; if (dr >= 0 && dr < 100) this.whRegen += dr;
    }
    this.last = { tachoAbs: v.tachoAbs, wh: v.wh, whCharged: v.whCharged };
    this.maxKmh = Math.max(this.maxKmh, Math.abs(speedKmh(v.erpm, g)));
  }
  get km() { return this.meters / 1000; }
  get netWh() { return this.wh - this.whRegen; }
  get whPerKm() { return this.km >= 0.3 && this.netWh > 0 ? this.netWh / this.km : null; }
}

const DEFAULT_HW = { controller: 'Flipsky FSESC 75/200 Pro', maxVoltage: 75, maxMotorCurrent: 200, battMaxDischarge: 55, battMaxCharge: 10, maxFetCutoff: 100, maxMotorCutoff: 140, maxFwFraction: 0.5, maxSpeedKmh: 90 };

const INCREASE_UP = ['l_current_max', 'l_in_current_max', 'l_max_erpm', 'foc_fw_current_max', 'l_temp_fet_start', 'l_temp_fet_end', 'l_temp_motor_start', 'l_temp_motor_end'];
const INCREASE_DOWN = ['l_current_min', 'l_in_current_min', 'l_min_erpm'];
const fmt = (x) => (Math.abs(x) >= 100 || x === Math.round(x)) ? x.toFixed(0) : x.toFixed(2);

/** Returns [{field, severity: 'blocked'|'warning', message}]. */
function validate(orig, edited, hw, g, extraAllowed = []) {
  const issues = []; const add = (field, severity, message) => issues.push({ field, severity, message });
  if (orig.sig !== edited.sig) { add('signature', 'blocked', 'Configuration layout changed.'); return issues; }
  const changes = edited.changes(orig); const changed = new Set(changes.map((c) => c.name));
  const allowed = new Set([...SETTINGS.filter((s) => s.kind === edited.kind).map((s) => s.field), ...extraAllowed]);
  const v = (n) => edited.get(n);
  for (const c of changes) {
    if (!allowed.has(c.name)) { add(c.name, 'blocked', `${c.name} is not an app-editable setting.`); continue; }
    if ((c.new > c.old && INCREASE_UP.includes(c.name)) || (c.new < c.old && INCREASE_DOWN.includes(c.name)))
      add(c.name, 'warning', `This INCREASES a protection/power limit (${fmt(c.old)} → ${fmt(c.new)}).`);
  }
  if (edited.kind === 'mcconf') {
    if (changed.has('l_current_max')) {
      const x = v('l_current_max');
      if (x <= 0) add('l_current_max', 'blocked', 'Motor current max must be positive.');
      if (x > hw.maxMotorCurrent) add('l_current_max', 'blocked', `Exceeds controller limit of ${hw.maxMotorCurrent} A.`);
      else if (x > hw.maxMotorCurrent * 0.75) add('l_current_max', 'warning', 'Above 75 % of the controller rating — expect high heat.');
    }
    if (changed.has('l_current_min')) {
      const x = v('l_current_min');
      if (x > 0) add('l_current_min', 'blocked', 'Brake current must be zero or negative.');
      if (-x > hw.maxMotorCurrent) add('l_current_min', 'blocked', `Exceeds controller limit of ${hw.maxMotorCurrent} A.`);
    }
    if (changed.has('l_in_current_max')) {
      const x = v('l_in_current_max');
      if (x <= 0) add('l_in_current_max', 'blocked', 'Battery current max must be positive.');
      if (x > hw.battMaxDischarge) add('l_in_current_max', 'blocked', `Exceeds your battery discharge rating of ${hw.battMaxDischarge} A.`);
    }
    if (changed.has('l_in_current_min')) {
      const x = v('l_in_current_min');
      if (x > 0) add('l_in_current_min', 'blocked', 'Regen current must be zero or negative.');
      if (-x > hw.battMaxCharge) add('l_in_current_min', 'blocked', `Exceeds your battery charge rating of ${hw.battMaxCharge} A.`);
    }
    if (changed.has('l_max_erpm')) {
      const x = v('l_max_erpm');
      if (x <= 0) add('l_max_erpm', 'blocked', 'Forward ERPM limit must be positive.');
      if (geometryValid(g)) {
        const k = speedKmh(x, g);
        if (k > hw.maxSpeedKmh) add('l_max_erpm', 'blocked', `≈ ${fmt(k)} km/h — above the absolute limit of ${hw.maxSpeedKmh} km/h.`);
        else if (k > 60) add('l_max_erpm', 'warning', `≈ ${fmt(k)} km/h. Check local laws, brakes and tyres.`);
      } else add('l_max_erpm', 'blocked', 'Set up wheel size and pole pairs first.');
    }
    if (changed.has('l_min_erpm') && v('l_min_erpm') > 0) add('l_min_erpm', 'blocked', 'Reverse ERPM limit must be zero or negative.');
    if (changed.has('foc_fw_current_max')) {
      const x = v('foc_fw_current_max'), cap = (v('l_current_max') || 0) * hw.maxFwFraction;
      if (x < 0) add('foc_fw_current_max', 'blocked', 'Cannot be negative.');
      if (x > cap) add('foc_fw_current_max', 'blocked', `Above ${Math.round(hw.maxFwFraction * 100)} % of motor current max (${fmt(cap)} A).`);
      else if (x > 0) add('foc_fw_current_max', 'warning', 'Field weakening enabled: a fault at high speed can cause dangerous overvoltage. Test at low speed first.');
    }
    if (changed.has('foc_fw_duty_start')) { const x = v('foc_fw_duty_start'); if (x < 0.5 || x > 0.99) add('foc_fw_duty_start', 'blocked', 'Must be between 50 % and 99 %.'); }
    for (const [s, e, max, label] of [['l_temp_fet_start', 'l_temp_fet_end', hw.maxFetCutoff, 'MOSFET'], ['l_temp_motor_start', 'l_temp_motor_end', hw.maxMotorCutoff, 'Motor']]) {
      if (!changed.has(s) && !changed.has(e)) continue;
      const a = v(s), b = v(e);
      if (a >= b) add(e, 'blocked', `${label} cutoff must be higher than the limit start.`);
      if (b > max) add(e, 'blocked', `${label} cutoff above the allowed ${max} °C.`);
      if (a < 20) add(s, 'blocked', `${label} limit start below 20 °C would throttle constantly.`);
    }
  } else {
    for (const p of ['app_adc_conf', 'app_ppm_conf']) {
      if (changed.has(`${p}.hyst`)) { const x = v(`${p}.hyst`); if (x < 0 || x > 0.5) add(`${p}.hyst`, 'blocked', 'Deadband must be 0–50 %.'); else if (x < 0.02) add(`${p}.hyst`, 'warning', 'Very small deadband: throttle noise may move the scooter.'); }
      if (changed.has(`${p}.throttle_exp`) && Math.abs(v(`${p}.throttle_exp`)) > 5) add(`${p}.throttle_exp`, 'blocked', 'Expo must be between -5 and 5.');
      for (const r of ['ramp_time_pos', 'ramp_time_neg']) {
        if (!changed.has(`${p}.${r}`)) continue;
        const x = v(`${p}.${r}`);
        if (x < 0 || x > 5) add(`${p}.${r}`, 'blocked', 'Ramp time must be 0–5 s.');
        else if (r === 'ramp_time_pos' && x < 0.1) add(`${p}.${r}`, 'warning', 'Ramp under 0.1 s gives very abrupt acceleration.');
      }
    }
  }
  return issues.sort((a, b) => (a.severity === 'blocked' ? 0 : 1) - (b.severity === 'blocked' ? 0 : 1));
}

// ---------- riding modes ----------
const THROTTLE_PRESETS = { smooth: { ramp: 0.6, expo: -1.0 }, medium: { ramp: 0.3, expo: -0.4 }, direct: { ramp: 0.15, expo: 0 } };
const MODE_COLORS = ['#33f29a', '#00b8ff', '#ff3b4f', '#ffb021', '#b07cff', '#ff5cc8', '#3de3ff', '#ffffff'];

/**
 * A riding mode. Every limit is a *ceiling below the controller's normal configuration*:
 * speed (km/h), power (W), torque % and brake % of normal motor current, battery amps
 * (null = normal), reverse speed (null = normal). Throttle: ramp up (s), ramp down (s), expo.
 */
const MODE_TEMPLATES = [
  { name: 'ECO', regen: null, icon: '🌿', color: '#33f29a', speed: 25, power: 1000, torque: 60, brake: 100, battA: null, reverse: null, ramp: 0.6, rampNeg: 0.2, expo: -1.0, applyThrottle: true },
  { name: 'SPORT', regen: null, icon: '⚡', color: '#00b8ff', speed: 60, power: 2000, torque: 100, brake: 100, battA: null, reverse: null, ramp: 0.3, rampNeg: 0.1, expo: -0.4, applyThrottle: true },
  { name: 'BOOST', regen: null, icon: '🚀', color: '#ff3b4f', speed: 70, power: 3000, torque: 100, brake: 100, battA: null, reverse: null, ramp: 0.15, rampNeg: 0.1, expo: 0, applyThrottle: true },
  { name: 'WALK', regen: null, icon: '🚶', color: '#ffffff', speed: 6, power: 300, torque: 30, brake: 100, battA: 10, reverse: 3, ramp: 1.2, rampNeg: 0.3, expo: -2, applyThrottle: true },
  { name: 'LEARNER', regen: null, icon: '🎓', color: '#ffb021', speed: 18, power: 600, torque: 40, brake: 100, battA: 20, reverse: 5, ramp: 1.0, rampNeg: 0.3, expo: -1.5, applyThrottle: true },
  { name: 'RAIN', regen: null, icon: '🌧️', color: '#3de3ff', speed: 30, power: 1200, torque: 50, brake: 70, battA: null, reverse: null, ramp: 0.9, rampNeg: 0.5, expo: -1.2, applyThrottle: true },
  { name: 'HILL', regen: null, icon: '⛰️', color: '#b07cff', speed: 35, power: 3000, torque: 100, brake: 100, battA: null, reverse: null, ramp: 0.4, rampNeg: 0.1, expo: -0.3, applyThrottle: true },
  { name: 'RANGE', regen: null, icon: '🔋', color: '#ff5cc8', speed: 28, power: 800, torque: 70, brake: 100, battA: 25, reverse: null, ramp: 0.7, rampNeg: 0.2, expo: -0.8, applyThrottle: true },
];
const newModeId = () => 'm' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
const makeMode = (tpl) => ({ id: newModeId(), ...structuredClone(tpl) });
const DEFAULT_MODES = () => MODE_TEMPLATES.slice(0, 3).map(makeMode);
// legacy alias used by older code/tests
const DEFAULT_PROFILES = MODE_TEMPLATES.slice(0, 3).map((m, i) => ({ ...m, kind: ['eco', 'sport', 'boost'][i] }));

function throttleCurve(x, expo) { x = Math.min(Math.max(Math.abs(x), 0), 1); return expo >= 0 ? 1 - Math.pow(1 - x, 1 + expo) : Math.pow(x, 1 - expo); }
const throttlePrefix = (app) => app == null ? null : ADC_APPS.includes(app) ? 'app_adc_conf' : PPM_APPS.includes(app) ? 'app_ppm_conf' : null;

/** Problems with a mode's own values (independent of the controller). */
function checkMode(m) {
  const e = [];
  if (!m.name || !String(m.name).trim()) e.push('Give the mode a name.');
  if (!(m.speed >= 3 && m.speed <= 200)) e.push('Speed limit must be 3–200 km/h.');
  if (!(m.power >= 100)) e.push('Power limit must be at least 100 W.');
  if (!(m.torque >= 10 && m.torque <= 100)) e.push('Torque must be 10–100 %.');
  if (!(m.brake >= 30 && m.brake <= 100)) e.push('Electric brake strength must be 30–100 %.');
  if (m.battA != null && !(m.battA >= 3)) e.push('Battery current must be at least 3 A (or empty for normal).');
  if (m.reverse != null && !(m.reverse >= 0)) e.push('Reverse speed cannot be negative.');
  if (!(m.ramp >= 0.05 && m.ramp <= 3)) e.push('Acceleration ramp must be 0.05–3 s.');
  if (!(m.rampNeg >= 0 && m.rampNeg <= 1.5)) e.push('Release/brake ramp must be 0–1.5 s.');
  if (!(Math.abs(m.expo) <= 5)) e.push('Throttle curve must be between -5 and 5.');
  if (m.regen != null && !(m.regen >= 0 && m.regen <= 60)) e.push('Coast regen must be 0–60 %.');
  return e;
}

/**
 * Plan a mode from the baseline (the controller's normal limits). Starts from an exact copy of
 * the baseline and only ever LOWERS: max ERPM, max power, motor-current scale, brake-current
 * scale, battery current max and reverse ERPM. Nothing can exceed the baseline.
 */
function planProfile(profile, baseline, current, g, caps, baseApp) {
  const m = { torque: 100, brake: 100, battA: null, reverse: null, rampNeg: null, ...profile };
  if (!caps.tempLimits) throw new Error('This controller did not answer COMM_GET_MCCONF_TEMP; modes are not supported.');
  if (!geometryValid(g)) throw new Error('Set and confirm wheel size and pole pairs first (Bluetooth › Vehicle setup).');
  const bad = checkMode({ ...m, rampNeg: m.rampNeg ?? 0.1 }); if (bad.length) throw new Error(bad.join(' '));
  const notes = []; const limits = { ...baseline };
  const lower = (a, b) => Math.min(a, b);

  const want = erpmForKmh(m.speed, g);
  if (want >= baseline.maxERPM) { limits.maxERPM = baseline.maxERPM; notes.push(`Speed capped at the controller's normal max (≈ ${fmt(speedKmh(baseline.maxERPM, g))} km/h). The app never raises it.`); }
  else limits.maxERPM = want;
  if (m.power >= baseline.wattMax) { limits.wattMax = baseline.wattMax; notes.push(`Power capped at the controller's normal ${fmt(baseline.wattMax)} W.`); }
  else limits.wattMax = m.power;
  limits.currentMaxScale = lower(baseline.currentMaxScale, baseline.currentMaxScale * m.torque / 100);
  limits.currentMinScale = lower(baseline.currentMinScale, baseline.currentMinScale * m.brake / 100);
  if (m.brake < 100) notes.push(`Electric brake reduced to ${m.brake} %. Your mechanical brakes must stop the scooter on their own.`);
  if (m.battA != null && baseline.inCurrentMax != null) {
    if (m.battA >= baseline.inCurrentMax) notes.push(`Battery current capped at the normal ${fmt(baseline.inCurrentMax)} A.`);
    limits.inCurrentMax = lower(baseline.inCurrentMax, m.battA);
  } else if (m.battA != null) notes.push('Battery current limit not changed: firmware does not support it in temporary limits.');
  if (m.reverse != null) {
    const r = erpmForKmh(m.reverse, g);
    limits.minERPM = -lower(Math.abs(baseline.minERPM), r);
  }
  notes.push(`Real power is also limited by battery current${limits.inCurrentMax != null ? ` (${fmt(limits.inCurrentMax)} A)` : ''} and motor current.`);

  const changes = [];
  const add = (setting, from, to, note) => changes.push({ setting, from, to, note });
  if (Math.abs(limits.maxERPM - current.maxERPM) >= 1) add('Top speed', `${fmt(speedKmh(current.maxERPM, g))} km/h`, `${fmt(speedKmh(limits.maxERPM, g))} km/h`, `max ERPM ${fmt(current.maxERPM)} → ${fmt(limits.maxERPM)}`);
  if (Math.abs(limits.wattMax - current.wattMax) >= 0.5) add('Max power', `${fmt(current.wattMax)} W`, `${fmt(limits.wattMax)} W`);
  const pctOf = (x, base) => `${Math.round(x / (base || 1) * 100)} %`;
  if (Math.abs(limits.currentMaxScale - current.currentMaxScale) > 1e-3) add('Torque (motor current)', pctOf(current.currentMaxScale, baseline.currentMaxScale), pctOf(limits.currentMaxScale, baseline.currentMaxScale), 'of normal');
  if (Math.abs(limits.currentMinScale - current.currentMinScale) > 1e-3) add('Electric brake strength', pctOf(current.currentMinScale, baseline.currentMinScale), pctOf(limits.currentMinScale, baseline.currentMinScale), 'of normal');
  if (current.inCurrentMax != null && limits.inCurrentMax != null && Math.abs(current.inCurrentMax - limits.inCurrentMax) > 1e-3) add('Battery current max', `${fmt(current.inCurrentMax)} A`, `${fmt(limits.inCurrentMax)} A`);
  if (Math.abs(limits.minERPM - current.minERPM) >= 1) add('Reverse speed', `${fmt(Math.abs(speedKmh(current.minERPM, g)))} km/h`, `${fmt(Math.abs(speedKmh(limits.minERPM, g)))} km/h`);
  for (const [label, k] of [['Max duty', 'maxDuty'], ['Min duty', 'minDuty'], ['Regen power', 'wattMin'], ['Battery regen current', 'inCurrentMin']]) {
    if (current[k] != null && limits[k] != null && Math.abs(current[k] - limits[k]) > 1e-3) add(label, fmt(current[k]), fmt(limits[k]), 'restored to normal');
  }

  let app = null;
  if (m.applyThrottle) {
    const p = caps.throttlePrefix;
    if (baseApp && p && caps.fwNumber >= 600 && baseApp.has(`${p}.ramp_time_pos`) && baseApp.has(`${p}.throttle_exp`)) {
      app = baseApp.clone();
      app.set(`${p}.ramp_time_pos`, Math.min(Math.max(m.ramp, 0.05), 3));
      app.set(`${p}.throttle_exp`, Math.min(Math.max(m.expo, -5), 5));
      if (m.rampNeg != null && baseApp.has(`${p}.ramp_time_neg`)) app.set(`${p}.ramp_time_neg`, Math.min(Math.max(m.rampNeg, 0), 1.5));
      const names = { ramp_time_pos: 'Acceleration ramp', ramp_time_neg: 'Release/brake ramp', throttle_exp: 'Throttle curve' };
      for (const c of app.changes(baseApp)) { const k = c.name.replace(`${p}.`, ''); add(names[k] || k, k === 'throttle_exp' ? fmt(c.old) : `${fmt(c.old)} s`, k === 'throttle_exp' ? fmt(c.new) : `${fmt(c.new)} s`); }
    } else {
      notes.push('Throttle feel not changed: ' + (caps.fwNumber < 600 ? 'needs firmware 6.00+.' : !p ? 'controller is not using the ADC or PPM throttle app.' : 'app configuration not readable with a verified layout.'));
    }
  }
  let regen = null;
  if (m.regen != null) {
    const why = !caps.coastCal ? 'calibrate the throttle first (Modes › Coast regen).' : caps.fwNumber < 600 ? 'needs firmware 6.00+.' : caps.throttlePrefix !== 'app_adc_conf' ? 'needs the ADC throttle app.' : !baseApp ? 'app configuration not readable.' : coastRegenSupport(baseApp, caps.coastCal);
    if (why) notes.push('Coast regen not changed: ' + why);
    else {
      const before = currentCoastRegen(caps.currentApp || app || baseApp, caps.coastCal) || 0;
      const r = planCoastRegen(app || baseApp, caps.coastCal, m.regen);
      app = r.app; regen = { pct: m.regen, restBrake: r.restBrake };
      if (Math.abs(before - r.restBrake) > 0.005) add('Coast regen (throttle released)', before ? `${Math.round(before * 100)} %` : 'off', r.restBrake ? `${Math.round(r.restBrake * 100)} %` : 'off', 'of max brake current, scaled by e-brake strength');
      if (m.regen > 0) notes.push('Releasing the throttle now brakes gently. This runs on the controller itself, so it keeps working if your phone disconnects.');
    }
  }
  notes.push('Changes are temporary (not saved to flash) and clear when the controller is powered off.');
  return { profile: m, limits, app, regen, changes, notes, speed: speedKmh(limits.maxERPM, g), power: limits.wattMax };
}

function stationaryCheck(v, age, throttle, throttleActive) {
  const f = [];
  if (!v) return { ok: false, failures: ['No live telemetry from the controller.'] };
  if (age > 1) f.push(`Telemetry is stale (${age.toFixed(1)} s).`);
  if (Math.abs(v.erpm) > 50) f.push(`Wheel is turning (${Math.round(v.erpm)} ERPM). Stop the scooter.`);
  if (Math.abs(v.motorCurrent) > 1) f.push(`Motor current ${v.motorCurrent.toFixed(1)} A. Release the throttle.`);
  if (Math.abs(v.duty) > 0.02) f.push(`Motor is being driven (duty ${Math.round(v.duty * 100)} %).`);
  if (v.fault) f.push(`Controller fault ${faultName(v.fault)}.`);
  if (throttleActive) {
    if (!throttle) f.push('Could not read the throttle position.');
    else if (Math.abs(throttle.level) > 0.05) f.push(`Throttle is not released (${Math.round(throttle.level * 100)} %).`);
  }
  return { ok: f.length === 0, failures: f };
}

// ---------- alerts + CSV ----------
function thresholdsFrom(mc) {
  const t = { fetStart: 85, fetEnd: 100, motorStart: 85, motorEnd: 100, motorSensor: false };
  if (!mc) return t;
  const fs = mc.get('l_temp_fet_start'), fe = mc.get('l_temp_fet_end'), ms = mc.get('l_temp_motor_start'), me = mc.get('l_temp_motor_end');
  if (fs > 0 && fe > fs) { t.fetStart = fs; t.fetEnd = fe; }
  if (ms > 0 && me > ms) { t.motorStart = ms; t.motorEnd = me; }
  if (mc.has('m_motor_temp_sens_type')) t.motorSensor = mc.get('m_motor_temp_sens_type') !== 8; // 8 = disabled (fw 6+)
  return t;
}

function evaluateAlerts(v, pct, bat, t) {
  const a = [];
  if (v.tempMosfet >= t.fetStart) a.push({ kind: 'fet', level: 'critical', title: 'Controller overheating', detail: `MOSFETs ${Math.round(v.tempMosfet)} °C — power reduced (cutoff ${t.fetEnd} °C).` });
  else if (v.tempMosfet >= t.fetStart - 10) a.push({ kind: 'fet', level: 'caution', title: 'Controller hot', detail: `MOSFETs ${Math.round(v.tempMosfet)} °C, limiting from ${t.fetStart} °C.` });
  if (t.motorSensor && v.tempMotor > -40 && v.tempMotor < 250) {
    if (v.tempMotor >= t.motorStart) a.push({ kind: 'motor', level: 'critical', title: 'Motor overheating', detail: `Motor ${Math.round(v.tempMotor)} °C — power reduced (cutoff ${t.motorEnd} °C).` });
    else if (v.tempMotor >= t.motorStart - 10) a.push({ kind: 'motor', level: 'caution', title: 'Motor hot', detail: `Motor ${Math.round(v.tempMotor)} °C, limiting from ${t.motorStart} °C.` });
  }
  if (pct <= bat.critical) a.push({ kind: 'battery', level: 'critical', title: 'Battery critically low', detail: `${v.voltage.toFixed(1)} V (≈${Math.round(pct)} %). Stop soon.` });
  else if (pct <= bat.low) a.push({ kind: 'battery', level: 'caution', title: 'Battery low', detail: `${v.voltage.toFixed(1)} V (≈${Math.round(pct)} %).` });
  if (v.fault) a.push({ kind: 'fault', level: 'critical', title: `Controller fault: ${faultName(v.fault)}`, detail: faultHelp(v.fault) });
  if (v.status != null && (v.status & 2)) a.push({ kind: 'kill', level: 'caution', title: 'Kill switch active', detail: 'Controller output is disabled.' });
  return a.sort((x, y) => (x.level === 'critical' ? 0 : 1) - (y.level === 'critical' ? 0 : 1));
}

const CSV_HEADER = 'timestamp_iso8601,elapsed_s,speed_kmh,erpm,voltage_v,battery_current_a,motor_current_a,power_w,duty_pct,temp_controller_c,temp_motor_c,trip_km,fault';
function renderCSV(samples) {
  const t0 = samples.length ? samples[0].t : 0;
  return [CSV_HEADER, ...samples.map((s) => [new Date(s.t).toISOString(), ((s.t - t0) / 1000).toFixed(2), s.speed.toFixed(2), s.erpm.toFixed(0), s.voltage.toFixed(2),
    s.batteryCurrent.toFixed(2), s.motorCurrent.toFixed(2), s.watts.toFixed(1), (s.duty * 100).toFixed(1), s.tempMosfet.toFixed(1),
    s.tempMotor == null ? '' : s.tempMotor.toFixed(1), s.tripKm.toFixed(3), faultName(s.fault)].join(','))].join('\n') + '\n';
}

// ---------- coast regen (brake when the throttle is released) ----------
// Implemented the firmware-native way: the ADC app's "Current, no reverse, brake center" control
// type (ctrl_type 6). The center voltage is placed just above the throttle's resting voltage, so
// a released throttle sits slightly in the brake region. The controller itself brakes — nothing
// depends on the phone or Bluetooth. Pipeline mirrors applications/app_adc.c (fw 5.x–7.x).
const ADC_CTRL = { CURRENT: 1, NOREV_BRAKE_CENTER: 6 };
const CENTER_TYPES = [2, 5, 6, 10, 13];

function deadband(v, h) { if (Math.abs(v) < h) return 0; const k = 1 / (1 - h); return v > 0 ? k * v + (1 - k) : -(k * -v + (1 - k)); }
const fmap = (x, a, b, c, d) => (x - a) * (d - c) / (b - a) + c;

/** Signed relative output (drive > 0, brake < 0) the ADC app produces for throttle voltage v (no ramping). */
function simulateAdc(app, v) {
  const P = 'app_adc_conf.', g = (k) => app.get(P + k);
  const type = g('ctrl_type'), S = g('voltage_start'), E = g('voltage_end'), Cv = g('voltage_center');
  let p = CENTER_TYPES.includes(type) ? (v < Cv ? fmap(v, S, Cv, 0, 0.5) : fmap(v, Cv, E, 0.5, 1)) : fmap(v, S, E, 0, 1);
  p = Math.min(Math.max(p, 0), 1);
  if (g('voltage_inverted')) p = 1 - p;
  if (CENTER_TYPES.includes(type)) p = p * 2 - 1;
  p = deadband(p, g('hyst'));
  const expo = p < 0 ? g('throttle_exp_brake') : g('throttle_exp');
  return Math.sign(p) * throttleCurve(Math.abs(p), expo);
}

/** Problems that stop coast regen from being used with this controller's throttle setup. */
function coastRegenSupport(app, cal) {
  const P = 'app_adc_conf.';
  if (!app) return 'App configuration is not readable with a verified layout.';
  for (const k of ['ctrl_type', 'voltage_start', 'voltage_end', 'voltage_center', 'hyst', 'voltage_inverted', 'throttle_exp_brake']) if (!app.has(P + k)) return 'This firmware does not expose the needed throttle settings.';
  const t = app.get(P + 'ctrl_type');
  if (t !== ADC_CTRL.CURRENT && t !== ADC_CTRL.NOREV_BRAKE_CENTER) return 'Coast regen needs the throttle control type "Current" (no reverse, single throttle). Yours uses a different type (e.g. a separate brake lever input) — keep using that.';
  if (app.get(P + 'voltage_inverted')) return 'Inverted throttles are not supported for coast regen.';
  if (app.has(P + 'throttle_exp_mode') && app.get(P + 'throttle_exp_mode') !== 0 && Math.abs(app.get(P + 'throttle_exp_brake')) > 1e-6) return 'Brake curve mode not supported (set brake expo to 0 or exponential mode in VESC Tool).';
  if (cal) {
    if (!(cal.rest > 0.1 && cal.rest < 3)) return 'Calibrated resting throttle voltage looks wrong — calibrate again.';
    if (!(cal.full > cal.rest + 0.5)) return 'Full-throttle voltage must be at least 0.5 V above resting — calibrate again.';
  }
  return null;
}

/**
 * Returns a copy of `baseApp` with coast regen set to `pct` % of the maximum brake current
 * (0 = off), plus the resulting brake level at rest. Drive feel above the center is unchanged.
 */
function planCoastRegen(baseApp, cal, pct) {
  const why = coastRegenSupport(baseApp, cal); if (why) throw new Error(why);
  if (!(pct >= 0 && pct <= 60)) throw new Error('Coast regen must be 0–60 %.');
  const P = 'app_adc_conf.', app = baseApp.clone(), g = (k) => baseApp.get(P + k);
  const type = g('ctrl_type'), h = g('hyst'), expB = g('throttle_exp_brake');
  // Where drive currently starts: start voltage (type 1) or center (type 6).
  const driveStart = type === ADC_CTRL.CURRENT ? g('voltage_start') : g('voltage_center');
  if (pct === 0) {
    if (type === ADC_CTRL.CURRENT) return { app, restBrake: 0 };
    app.set(P + 'ctrl_type', ADC_CTRL.CURRENT); app.set(P + 'voltage_start', driveStart);
    return { app, restBrake: 0 };
  }
  const gap = Math.max(0.05, 0.04 * (cal.full - cal.rest));
  const C = Math.max(driveStart, cal.rest + gap);
  if (C >= g('voltage_end') - 0.3) throw new Error('Throttle range too small for coast regen.');
  // invert brake curve: want throttleCurve(e, expB) = pct/100
  let lo = 0, hi = 1; for (let i = 0; i < 60; i++) { const m = (lo + hi) / 2; if (throttleCurve(m, expB) < pct / 100) lo = m; else hi = m; }
  const pr = h + lo * (1 - h);                // |pwr| at rest before deadband
  const S = C - (C - cal.rest) / pr;
  app.set(P + 'ctrl_type', ADC_CTRL.NOREV_BRAKE_CENTER); app.set(P + 'voltage_center', C); app.set(P + 'voltage_start', S);
  const restBrake = -simulateAdc(app, cal.rest);
  return { app, restBrake, center: C, start: S };
}

/** Current coast-regen level (0..1 of max brake current) a config gives at the calibrated rest voltage. */
function currentCoastRegen(app, cal) {
  if (!app || !cal || coastRegenSupport(app, null)) return null;
  const out = simulateAdc(app, cal.rest);
  return out < 0 ? -out : 0;
