<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#000000"><meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<title>VESCDash</title>
<style>:root{--bg:#000;--panel:#090d13;--stroke:rgba(0,140,255,.22);--neon:#00b8ff;--neon2:#3de3ff;--amber:#ffb021;--red:#ff3b4f;--green:#33f29a;--dim:rgba(255,255,255,.55);--faint:rgba(255,255,255,.32);--font:ui-rounded,"SF Pro Rounded",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:#fff;font-family:var(--font);font-size:15px}
body{padding-bottom:calc(76px + env(safe-area-inset-bottom))}
h1{font-size:24px;margin:14px 2px 10px}h2{margin:0 0 8px;font-size:19px}
main{max-width:640px;margin:0 auto;padding:0 14px 20px}
#demo{background:var(--amber);color:#000;font-weight:800;font-size:11px;letter-spacing:.06em;text-align:center;padding:6px;position:sticky;top:0;z-index:5}
#alerts{position:sticky;top:0;z-index:4;max-width:640px;margin:0 auto;padding:0 10px}
.alert{display:flex;flex-direction:column;padding:9px 12px;border-radius:12px;margin-top:6px;font-size:13px}
.alert b{font-size:14px}.alert.critical{background:rgba(255,59,79,.92)}.alert.caution{background:rgba(255,176,33,.92);color:#000}
.card{background:var(--panel);border:1px solid var(--stroke);border-radius:18px;padding:14px;margin:12px 0}
.center{text-align:center}
.head,.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.row{margin:8px 0}.sp{flex:1}
.lbl{font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--dim);margin:6px 0}
.dim{color:var(--dim)}.faint{color:var(--faint)}.small{font-size:12px}.mono{font-family:ui-monospace,Menlo,monospace}
.neon{color:var(--neon)}.amber{color:var(--amber)}.red{color:var(--red)}.green{color:var(--green)}.warn{color:var(--amber)}
.btn{font:inherit;font-weight:600;color:#fff;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.12);border-radius:12px;padding:10px 14px;cursor:pointer}
.btn:disabled{opacity:.35}.btn.primary{background:var(--neon);border-color:var(--neon);color:#001018}.btn.danger{background:var(--red);border-color:var(--red)}
.btn.amber{background:var(--amber);border-color:var(--amber);color:#000}.btn.ghost{background:none;border-color:transparent;color:var(--neon)}.btn.small{padding:6px 10px;font-size:13px}.btn.wide{width:100%;margin-top:6px}
.brand{color:var(--neon);font-weight:800;letter-spacing:.15em;font-size:13px}
.pill{border:1.5px solid var(--neon);color:var(--neon);border-radius:99px;padding:3px 11px;font-weight:800;font-size:12px;margin-left:auto}.pill.solid{background:var(--neon);color:#000;margin-left:0}
.gauge{position:relative;width:min(300px,82vw);margin:0 auto;aspect-ratio:1}
.gauge svg{width:100%;height:100%}.gauge path{fill:none;stroke-linecap:round}.gauge .track{stroke:rgba(255,255,255,.07)}
.gauge .fill{stroke:var(--neon);filter:drop-shadow(0 0 8px var(--neon));transition:d .3s}.gauge .fill2{stroke:var(--neon2);filter:drop-shadow(0 0 5px var(--neon2))}
.gcenter{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.big{font-size:min(84px,22vw);font-weight:700;font-variant-numeric:tabular-nums;line-height:1;text-shadow:0 0 18px rgba(0,184,255,.6)}
.unit{color:var(--dim);font-weight:600}.watts{margin-top:12px;font-size:20px;color:var(--neon2);font-variant-numeric:tabular-nums}.watts.green{color:var(--green)}
.batt{display:flex;align-items:baseline;gap:6px;font-size:18px;font-weight:600;font-variant-numeric:tabular-nums;margin-top:4px}
.bar{height:8px;border-radius:9px;background:rgba(255,255,255,.07);overflow:hidden;margin-top:6px}.bar div{height:100%;border-radius:9px;transition:width .5s;background:var(--green)}
.bar .amber{background:var(--amber)}.bar .red{background:var(--red)}.bar .green{background:var(--green);box-shadow:0 0 8px var(--green)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:8px 0}
.tile{background:var(--panel);border:1px solid var(--stroke);border-radius:14px;padding:11px 12px;min-width:0}
.tt{font-size:10px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tv{font-size:22px;font-weight:600;font-variant-numeric:tabular-nums;margin-top:3px;white-space:nowrap}.tv small{font-size:11px;color:var(--dim);margin-left:3px;font-weight:500}
.tf{font-size:10px;color:var(--faint);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.foot{color:var(--faint);font-size:11px;margin:10px 4px}
.pname{font-size:26px;font-weight:800}.curve path{fill:none;stroke:var(--neon);stroke-width:2}.curve{border:1px solid var(--stroke);border-radius:8px}
.seg{display:flex;background:rgba(255,255,255,.06);border-radius:10px;padding:3px}.seg button{flex:1;font:inherit;color:var(--dim);background:none;border:0;padding:7px;border-radius:8px}.seg .on{background:rgba(255,255,255,.14);color:#fff}
.chart canvas{width:100%;height:110px;display:block}
.set{padding:10px 0;border-top:1px solid rgba(255,255,255,.06)}.set:first-of-type{border-top:0}.set.changed{background:linear-gradient(90deg,rgba(0,184,255,.08),transparent);margin:0 -14px;padding:10px 14px}
.set label{display:flex;justify-content:space-between;align-items:center;gap:10px}.in{display:flex;align-items:center;gap:5px}.in small{color:var(--dim);min-width:30px}
input[type=number]{font:inherit;font-variant-numeric:tabular-nums;color:#fff;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.14);border-radius:9px;padding:8px;width:110px;text-align:right}
.sheet input[type=number]{width:100%;text-align:left;margin-top:4px}.sheet label{display:block;margin:8px 0;font-size:13px;color:var(--dim)}
input[type=range]{width:100%;accent-color:var(--neon)}
.chk{display:flex!important;align-items:center;gap:8px;margin:10px 0;color:#fff!important}.chk input{width:20px;height:20px;accent-color:var(--neon)}.chk.big{font-size:16px;font-weight:600}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 12px;font-size:14px}.kv span{color:var(--dim)}.kv b{font-weight:500;word-break:break-all}
.dot{width:9px;height:9px;border-radius:50%;display:inline-block}.dot.green{background:var(--green);box-shadow:0 0 6px var(--green)}.dot.amber{background:var(--amber)}.dot.red{background:var(--red)}.dot.grey{background:var(--faint)}
.console{font-family:ui-monospace,Menlo,monospace;font-size:11px;max-height:260px;overflow:auto;line-height:1.5;word-break:break-all}
.chg{padding:6px 0;border-bottom:1px solid rgba(255,255,255,.06)}.issue{font-size:13px;padding:6px 8px;border-radius:8px;margin:4px 0}.issue.blocked{background:rgba(255,59,79,.18);color:#ff8d99}.issue.warning{background:rgba(255,176,33,.15);color:var(--amber)}
#tabs{position:fixed;bottom:0;left:0;right:0;display:flex;background:#050608;border-top:1px solid rgba(255,255,255,.08);padding-bottom:env(safe-area-inset-bottom);z-index:6}
.tab{flex:1;background:none;border:0;color:var(--faint);font:inherit;font-size:10px;padding:8px 0 6px;display:flex;flex-direction:column;align-items:center;gap:3px}
.tab svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}.tab.on{color:var(--neon)}
#modal{position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:10;display:flex;align-items:flex-end;justify-content:center}#modal[hidden]{display:none}
.sheet{background:#0d1219;border:1px solid var(--stroke);border-radius:20px 20px 0 0;width:100%;max-width:640px;max-height:88vh;display:flex;flex-direction:column;padding:16px 16px calc(14px + env(safe-area-inset-bottom))}
.sheet .body{overflow:auto;flex:1}.actions{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;padding-top:12px}
.spinner{width:34px;height:34px;border:3px solid rgba(255,255,255,.15);border-top-color:var(--neon);border-radius:50%;margin:16px auto;animation:spin 1s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}
ul{padding-left:18px}
</style></head>

// VESCDash core: VESC protocol, telemetry decoding, config layouts, validation, profiles.
// Ported from the VESCCore Swift package. Wire formats follow the VESC firmware
// (vedderb/bldc comm/commands.c, comm/packet.c, util/buffer.c, util/crc.c).

// ---------- CRC + framing ----------
const CRC_TABLE = (() => {
  const t = new Uint16Array(256);
  for (let i = 0; i < 256; i++) {
    let c = i << 8;
    for (let j = 0; j < 8; j++) c = (c & 0x8000) ? ((c << 1) ^ 0x1021) & 0xffff : (c << 1) & 0xffff;
    t[i] = c;
  }
  return t;
})();

function crc16(data) {
  let crc = 0;
  for (let i = 0; i < data.length; i++) crc = (CRC_TABLE[((crc >> 8) ^ data[i]) & 0xff] ^ (crc << 8)) & 0xffff;
  return crc;
}

const MAX_PAYLOAD = 512; // firmware PACKET_MAX_PL_LEN

function encodePacket(payload) {
  const n = payload.length;
  if (n === 0) throw new Error('empty packet');
  const head = n <= 255 ? [2, n] : n <= 65535 ? [3, n >> 8, n & 0xff] : [4, (n >> 16) & 0xff, (n >> 8) & 0xff, n & 0xff];
  const c = crc16(payload);
  return Uint8Array.from([...head, ...payload, c >> 8, c & 0xff, 3]);
}

class PacketDecoder {
  constructor(maxPayload = MAX_PAYLOAD) {
    this.maxPayload = maxPayload; this.buf = []; this.resyncing = false;
    this.crcErrors = 0; this.framingErrors = 0; this.packets = 0;

  reset() { this.buf = []; this.resyncing = false; }
  probe(s) {

    if (b.length - s < h) return { t: 'inc' };

    for (let i = 1; i < h; i++) len = len * 256 + b[s + i];
    if (len === 0 || len > this.maxPayload) return { t: 'inv' };
    const total = h + len + 3;
    if (b.length - s < total) return { t: 'inc' };
    const p0 = s + h, pl = b.slice(p0, p0 + len);
    const crc = (b[p0 + len] << 8) | b[p0 + len + 1];
    if (b[p0 + len + 2] !== 3 || crc !== crc16(pl)) return { t: 'inv' };
    return { t: 'pkt', pl, total };
  }
  feed(bytes) {
    for (const x of bytes) this.buf.push(x);
    const out = [];
    while (this.buf.length) {
      const r = this.probe(0);
      if (r.t === 'pkt') { out.push(Uint8Array.from(r.pl)); this.packets++; this.buf.splice(0, r.total); this.resyncing = false; }
      else if (r.t === 'inv') {
        const f = this.buf[0];
        if (f === 2 || f === 3 || f === 4) this.crcErrors++; else this.framingErrors++;
        this.buf.shift(); this.resyncing = true;
      } else {
        if (!this.resyncing) break;
        let found = -1;
        for (let i = 1; i < this.buf.length; i++) if (this.probe(i).t === 'pkt') { found = i; break; }
        if (found < 0) break;
        this.framingErrors++; this.buf.splice(0, found);

  }
}

// ---------- byte codec ----------
const f32buf = new DataView(new ArrayBuffer(4));

function f32autoBits(v) {

    const s = Math.round(v * scale);

    return this.i16(s);

    return this.i32(s);

class Reader {

  get remaining() { return this.b.length - this.i; }
  need(n) { if (this.remaining < n) throw new Error(`payload truncated (need ${n}, have ${this.remaining})`); }
  u8() { this.need(1); return this.b[this.i++]; }
  u16() { this.need(2); const v = (this.b[this.i] << 8) | this.b[this.i + 1]; this.i += 2; return v; }

// ---------- configuration layouts ----------

const TYPE = { a: ['u8', 1], b: ['u16', 2], c: ['i16', 2], d: ['u32', 4], e: ['i32', 4], f: ['f16', 2], g: ['f32s', 4], h: ['f32', 4] };
const layoutCache = {};
function getLayout(kind, sig) {
  const key = kind + sig;
  if (key in layoutCache) return layoutCache[key];
  const d = LAYOUT_DATA[kind][String(sig)];
  if (!d) return (layoutCache[key] = null);
  const fields = []; const map = {}; let off = 4;
  for (const tok of d.f.split(' ')) {
    const m = tok.match(/^(\d+)([a-h])(.*)$/);
    const [type, size] = TYPE[m[2]];
    const f = { name: LAYOUT_DATA.names[+m[1]], type, size, scale: m[3] ? parseFloat(m[3]) : 1, off };
    fields.push(f); map[f.name] = f; off += size;
  }
  return (layoutCache[key] = { kind, sig, fw: d.fw, fields, map, size: off });
}
const supportedFirmware = () => [...new Set(Object.values(LAYOUT_DATA.mcconf).flatMap((x) => x.fw))].sort();

class ConfigBlob {
  /** bytes = config blob without command id (starts with 32-bit signature). */
  constructor(kind, bytes) {
    if (bytes.length < 4) throw new Error('configuration too short');
    const sig = new Reader(bytes).u32();
    const layout = getLayout(kind, sig);
    if (!layout) throw new Error(`unknown configuration signature ${sig} — this firmware build is not in the verified layout table`);
    if (bytes.length !== layout.size) throw new Error(`configuration length mismatch (layout ${layout.size}, got ${bytes.length})`);
    this.kind = kind; this.layout = layout; this.bytes = Uint8Array.from(bytes);
  }
  static fromReply(kind, p) {
    expectCmd(p, kind === 'mcconf' ? CMD.GET_MCCONF : CMD.GET_APPCONF);
    return new ConfigBlob(kind, p.slice(1));
  }
  get sig() { return this.layout.sig; }
  clone() { return new ConfigBlob(this.kind, this.bytes); }
  has(n) { return n in this.layout.map; }
  get(n) {
    const f = this.layout.map[n]; if (!f) return null;
    const r = new Reader(this.bytes, f.off);
    switch (f.type) {
      case 'u8': return r.u8(); case 'u16': return r.u16(); case 'i16': return r.i16();
      case 'u32': return r.u32(); case 'i32': return r.i32();
      case 'f16': return r.f16(f.scale); case 'f32s': return r.f32(f.scale); case 'f32': return r.f32auto();
    }
  }
  set(n, v) {
    const f = this.layout.map[n]; if (!f) throw new Error(`field ${n} does not exist in this firmware`);
    if (!isFinite(v)) throw new Error(`invalid value for ${n}`);
    const w = new Writer(); const iv = Math.round(v);
    const range = (lo, hi) => { if (iv < lo || iv > hi) throw new Error(`${v} out of range for ${n}`); };
    switch (f.type) {
      case 'u8': range(0, 255); w.u8(iv); break;
      case 'u16': range(0, 65535); w.u16(iv); break;
      case 'i16': range(-32768, 32767); w.i16(iv); break;
      case 'u32': range(0, 4294967295); w.u32(iv); break;
      case 'i32': range(-2147483648, 2147483647); w.i32(iv); break;
      case 'f16': w.f16(v, f.scale); break;
      case 'f32s': w.f32(v, f.scale); break;
      case 'f32': w.f32auto(v); break;

    if (!orig || orig.sig !== this.sig) return [];

}

function speedKmh(erpm, g) {
  if (!geometryValid(g)) return 0;
  return erpm / g.polePairs / g.gearRatio * Math.PI * g.wheelDiameter * 60 / 1000;
}
function erpmForKmh(kmh, g) {
  if (!geometryValid(g)) return 0;
  return kmh * 1000 / 60 / (Math.PI * g.wheelDiameter) * g.gearRatio * g.polePairs;
}
const geometryValid = (g) => g && g.wheelDiameter > 0.05 && g.wheelDiameter < 2 && g.polePairs > 0 && g.polePairs < 100 && g.gearRatio > 0;
const tachoMeters = (steps, g) => geometryValid(g) ? steps / (g.polePairs * 6) / g.gearRatio * Math.PI * g.wheelDiameter : 0;

const CELL_CURVE = [[3.0, 0], [3.3, 5], [3.45, 10], [3.55, 20], [3.62, 30], [3.68, 40], [3.74, 50], [3.8, 60], [3.87, 70], [3.95, 80], [4.05, 90], [4.2, 100]];
function batteryPercent(v, b) {
  if (!(b.full > b.empty)) return 0;
  const t = Math.min(Math.max((v - b.empty) / (b.full - b.empty), 0), 1);
  const cell = 3.0 + t * 1.2;
  for (let i = 1; i < CELL_CURVE.length; i++) {
    const [v1, p1] = CELL_CURVE[i], [v0, p0] = CELL_CURVE[i - 1];
    if (cell <= v1) return p0 + (cell - v0) / (v1 - v0) * (p1 - p0);
  }
  return 100;
}
const nominalWh = (b) => b.cells * 3.6 * b.capacityAh;

class Trip {
  constructor() { this.reset(); }
  reset() { this.meters = 0; this.wh = 0; this.whRegen = 0; this.maxKmh = 0; this.last = null; }
  breakContinuity() { this.last = null; }
  ingest(v, g) {
    if (this.last) {
      const d = v.tachoAbs - this.last.tachoAbs;
      if (d > 0) { const m = tachoMeters(d, g); if (m < 1000) this.meters += m; }
      const dw = v.wh - this.last.wh; if (dw >= 0 && dw < 100) this.wh += dw;
      const dr = v.whCharged - this.last.whCharged; if (dr >= 0 && dr < 100) this.whRegen += dr;
    }
    this.last = { tachoAbs: v.tachoAbs, wh: v.wh, whCharged: v.whCharged };
    this.maxKmh = Math.max(this.maxKmh, Math.abs(speedKmh(v.erpm, g)));
  }
  get km() { return this.meters / 1000; }
  get netWh() { return this.wh - this.whRegen; }
  get whPerKm() { return this.km >= 0.3 && this.netWh > 0 ? this.netWh / this.km : null; }
}

      case C.CMD.GET_VALUES_SETUP_SELECTIVE: this.reply(W().u8(51).u32(1 << 20).u32(this.odo).bytes()); break;
      case C.CMD.GET_MCCONF: this.reply(this.mc.writePayload(C.CMD.GET_MCCONF)); break;
      case C.CMD.GET_APPCONF: this.reply(this.ap.writePayload(C.CMD.GET_APPCONF)); break;
      case C.CMD.SET_MCCONF: try { this.mc = new C.ConfigBlob('mcconf', p.slice(1)); Object.assign(this.temp, { maxERPM: this.mc.get('l_max_erpm'), minERPM: this.mc.get('l_min_erpm'), inCurrentMax: this.mc.get('l_in_current_max'), inCurrentMin: this.mc.get('l_in_current_min') }); this.reply([13]); } catch {} break;
      case C.CMD.SET_APPCONF: case C.CMD.SET_APPCONF_NO_STORE: try { this.ap = new C.ConfigBlob('appconf', p.slice(1)); this.reply([p[0]]); } catch {} break;
      case C.CMD.GET_MCCONF_TEMP: { const w = W().u8(91); for (const k of ['currentMinScale', 'currentMaxScale', 'minERPM', 'maxERPM', 'minDuty', 'maxDuty', 'wattMin', 'wattMax', 'inCurrentMin', 'inCurrentMax']) w.f32auto(this.temp[k]); w.u8(30).f32auto(1).f32auto(0.254); this.reply(w.bytes()); break; }
      case C.CMD.SET_MCCONF_TEMP: { const r = new C.Reader(p, 5); for (const k of ['currentMinScale', 'currentMaxScale', 'minERPM', 'maxERPM', 'minDuty', 'maxDuty', 'wattMin', 'wattMax']) this.temp[k] = r.f32auto(); if (r.remaining >= 8) { this.temp.inCurrentMin = r.f32auto(); this.temp.inCurrentMax = r.f32auto(); } if (p[3]) this.reply([48]); break; }
      case C.CMD.GET_DECODED_ADC: this.reply(W().u8(32).i32(Math.round(this.thr * 1e6)).i32(Math.round((0.9 + this.thr * 2.1) * 1e6)).i32(0).i32(0).bytes()); break;
    }
  }
  step() {
    const now = Date.now(), dt = Math.min((now - this.last) / 1000, 0.5); this.last = now;
    const t = ((now - this.t0) / 1000) % 60; this.thr = t < 4 ? 0 : t < 20 ? 1 : t < 40 ? 0.45 : 0; const brake = t >= 40 && t < 48;
    const perKmh = 15 * 1000 / 60 / (Math.PI * 0.254); const maxE = Math.min(this.temp.maxERPM, 70 * perKmh);
    const target = brake ? 0 : this.thr * maxE;
    if (brake) this.erpm = Math.max(0, this.erpm - 2500 * dt); else if (target > this.erpm) this.erpm = Math.min(target, this.erpm + 1500 * dt); else this.erpm = Math.max(target, this.erpm - 400 * dt);
    const kmh = this.erpm / perKmh;
    let pw = this.thr > 0 ? Math.min(this.temp.wattMax, 120 + kmh * kmh * 0.55 + (target > this.erpm ? 900 * this.thr : 0)) : 0;
    if (brake) pw = kmh > 3 ? -Math.min(Math.abs(this.temp.wattMin), 450) : 0;
    this.v = Math.max(48, 66.4 - this.wh / 1440 * 16 - Math.max(pw, 0) / 1000 * 1.6);
    this.ic = Math.min(pw / this.v, this.temp.inCurrentMax); this.duty = Math.min(0.95, this.erpm / (this.v * 400));
    this.mcur = Math.max(-60, Math.min(120, this.duty > 0.05 ? this.ic / this.duty : brake ? -20 : 0));
    if (pw > 0) this.wh += pw * dt / 3600; else this.whc -= pw * dt / 3600;
    this.ah += Math.max(this.ic, 0) * dt / 3600;
    const steps = this.erpm / 60 * 6 * dt; this.tacho += steps; this.odo += steps / 90 * Math.PI * 0.254;
    this.tf += (25 + Math.abs(this.mcur) * 0.35 - this.tf) * dt / 40; this.tm += (25 + Math.abs(this.mcur) * 0.45 - this.tm) * dt / 90;
  }
  values() {
    const w = new C.Writer().u8(4).f16(this.tf, 10).f16(this.tm, 10).f32(this.mcur, 100).f32(this.ic, 100).f32(0, 100).f32(this.mcur, 100)
      .f16(this.duty, 1000).f32(this.erpm, 1).f16(this.v, 10).f32(this.ah, 1e4).f32(0, 1e4).f32(this.wh, 1e4).f32(this.whc, 1e4)
      .i32(Math.round(this.tacho)).i32(Math.round(this.tacho)).u8(0).f32(0, 1e6).u8(0).f16(this.tf, 10).f16(this.tf, 10).f16(this.tf, 10).f32(0, 1e3).f32(0, 1e3).u8(0);
    return w.bytes();
  }
}

// ---------------- client ----------------
class Client {
  constructor(tr) {
    this.tr = tr; this.dec = new C.PacketDecoder(); this.waiters = {}; this.lastRx = 0; this.rx = 0; this.tx = 0;
    tr.onBytes = (b) => this.receive(b);
  }
  receive(b) {
    this.rx += b.length;
    if (Date.now() - this.lastRx > 1000) this.dec.reset();
    this.lastRx = Date.now();
    for (const p of this.dec.feed(b)) {
      if (st.traffic) log(`RX [${p.length}] ${C.hex(p.slice(0, 24))}${p.length > 24 ? '…' : ''}`);
      const q = this.waiters[p[0]];
      if (q && q.length) { const w = q.shift(); clearTimeout(w.timer); w.resolve(p); }
      else if (p[0] === C.CMD.PRINT) log('VESC: ' + new TextDecoder().decode(p.slice(1)));
    }
  }
  send(p) { if (st.traffic) log(`TX [${p.length}] ${C.hex(p.slice(0, 24))}`); const f = C.encodePacket(p); this.tx += f.length; this.tr.send(f); }
  request(p, expect, timeout = 1500) {
    return new Promise((resolve, reject) => {
      const q = (this.waiters[expect] = this.waiters[expect] || []);
      const w = { resolve, reject };
      w.timer = setTimeout(() => { const i = q.indexOf(w); if (i >= 0) q.splice(i, 1); reject(new Error(`controller did not answer (command ${expect})`)); }, timeout);
      q.push(w); this.send(p);
    });
  }
  cancelAll() { for (const q of Object.values(this.waiters)) for (const w of q.splice(0)) { clearTimeout(w.timer); w.reject(new Error('disconnected')); } }
  fw() { return this.request([0], 0).then(C.decodeFirmware); }
  values() { return this.request([4], 4, 800).then(C.decodeValues); }
  odo() { return this.request(C.ODO_REQUEST, 51).then(C.decodeOdometer); }
  temp() { return this.request([91], 91).then(C.decodeTempLimits); }
  throttle(ppm) { const c = ppm ? 31 : 32; return this.request([c], c).then(C.decodeThrottle); }
  readRaw(kind) { const c = kind === 'mcconf' ? 14 : 17; return this.request([c], c, 4000); }
  setTemp(t) { return this.request(C.encodeTempLimits(t), 48, 2000); }
  writeConfig(blob, store) {
    const cmd = blob.kind === 'mcconf' ? (store ? 13 : null) : (store ? 16 : 149);
    if (cmd == null) throw new Error('Temporary motor config must use COMM_SET_MCCONF_TEMP');
    return this.request(blob.writePayload(cmd), cmd, 5000);
  }
}

let transport = null, client = null, sessionId = 0;

// ---------------- session ----------------
async function connectBLE() {
  if (!navigator.bluetooth) { modalInfo('Bluetooth not available in this browser', bluetoothHelp()); return; }
  stopSession(true);
  const t = new BLETransport();
  try { await t.pick(); } catch (e) { if (e.name !== 'NotFoundError') modalInfo('Bluetooth', e.message); return; }
  transport = t; st.source = 'ble';
  try { await t.connect(); beginSession(t); } catch (e) { st.linkState = 'Connection failed'; log(e.message); modalInfo('Could not connect', e.message); st.source = 'none'; render(); }
}

function startDemo() { stopSession(true); transport = new DemoTransport(); st.source = 'demo'; st.linkState = 'Demo simulator'; st.trip.reset(); st.history = []; beginSession(transport); }

function disconnect() { stopSession(true); st.source = 'none'; st.linkState = 'Not connected'; render(); }

function stopSession(closeTransport) {
  sessionId++;
  if (client) client.cancelAll();
  if (closeTransport && transport) transport.close();
  if (closeTransport) transport = null;
  client = null;
  if (st.recording) stopRecording();
  Object.assign(st, { ready: false, fw: null, mc: null, app: null, mcErr: null, appErr: null, temp: null, tempOK: false, activeProfile: null, v: null, odo: null, odoSupported: null, handshake: '', editMc: null, editApp: null });
  st.alerts = st.alerts.filter((a) => a.kind === 'conn');
  st.trip.breakContinuity();
}

function connectionLost() {
  if (st.source !== 'ble') return;
  st.connLost = true;
  if (client) client.cancelAll();
  client = null; st.ready = false; sessionId++;
  st.alerts = [{ kind: 'conn', level: 'critical', title: 'Connection to controller lost', detail: 'No telemetry or alerts. The scooter keeps running on its own settings — use your brakes.' }];
  buzz('error'); log('Connection lost'); render();
}

async function beginSession(tr) {
  const id = ++sessionId;
  client = new Client(tr);
  const c = client;
  st.ready = false; st.trip.breakContinuity();
  st.handshake = 'Reading firmware version…'; render();
  let fw = null;
  for (let i = 0; i < 3 && !fw; i++) { try { fw = await c.fw(); } catch (e) { log(`FW attempt ${i + 1}: ${e.message}`); } if (id !== sessionId) return; }
  if (!fw) { st.handshake = 'No VESC response. Check the module is a VESC UART bridge, UART is enabled on the controller, and the baud rate matches (usually 115200).'; render(); return; }
  st.fw = fw; log(`Firmware ${fw.version} on ${fw.hw} (UUID ${fw.uuid})`);
  st.handshake = 'Reading limits…'; render();
  try { st.temp = await c.temp(); st.tempOK = true; } catch (e) { st.tempOK = false; log('Temporary limits not supported: ' + e.message); }
  st.handshake = 'Reading configuration…'; render();
  await refreshConfig('mcconf'); await refreshConfig('appconf');
  if (id !== sessionId) return;
  reconcileBaseline();
  st.ready = true; st.handshake = ''; st.connLost = false; st.alerts = st.alerts.filter((a) => a.kind !== 'conn');
  buzz(); render();
  pollLoop(id, c);
}

async function refreshConfig(kind) {
  if (!client) return;
  try {
    const raw = await client.readRaw(kind);
    try {
      const b = C.ConfigBlob.fromReply(kind, raw);
      if (kind === 'mcconf') { st.mc = b; st.mcErr = null; st.editMc = b.clone(); } else { st.app = b; st.appErr = null; st.editApp = b.clone(); }
      log(`${kind}: verified layout (firmware ${b.layout.fw.join('/')})`);
    } catch (e) {
      if (kind === 'mcconf') { st.mc = null; st.mcErr = e.message; } else { st.app = null; st.appErr = e.message; }
      log(`${kind}: ${e.message}. Read-only.`);
    }
  } catch (e) { if (kind === 'mcconf') st.mcErr = 'Could not read: ' + e.message; else st.appErr = 'Could not read: ' + e.message; }
}

function reconcileBaseline() {
  const id = uuid(); if (!id || !st.temp) return;
  st.tempUnknown = false;
  const b = baselines[id];
  if (!b) { baselines[id] = { limits: st.temp, appHex: st.app ? C.hex(st.app.bytes) : null, at: Date.now() }; st.profileStatus = 'Baseline captured from the controller\'s current configuration.'; st.activeProfile = null; }
  else if (C.tempLimitsEqual(st.temp, b.limits)) { st.activeProfile = null; b.lastProfile = null; b.lastLimits = null; st.profileStatus = 'Normal configuration (no profile active).'; }
  else if (b.lastLimits && C.tempLimitsEqual(st.temp, b.lastLimits)) { st.activeProfile = b.lastProfile; st.profileStatus = `${(b.lastProfile || '').toUpperCase()} still active (controller not power-cycled).`; }
  else { st.tempUnknown = true; st.profileStatus = 'Controller limits differ from the saved baseline (changed by another tool?). Review, then use "Use current as baseline".'; }
  saveBaselines();
}

async function pollLoop(id, c) {
  let lastOdo = 0;
  while (id === sessionId && client === c) {
    const t0 = Date.now();
    try { ingest(await c.values()); st.timeouts = 0; }
    catch { if (id !== sessionId) return; if (++st.timeouts === 5) { st.alerts.unshift({ kind: 'conn', level: 'critical', title: 'Controller not responding', detail: 'No telemetry for several requests.' }); buzz('error'); renderAlerts(); } }
    if (st.odoSupported !== false && Date.now() - lastOdo > 5000) {
      lastOdo = Date.now();
      try { st.odo = await c.odo(); st.odoSupported = st.odo != null; } catch { st.odoSupported = false; }
    }
    const wait = 1000 / Math.max(2, Math.min(S.pollHz, 20)) - (Date.now() - t0);
    if (wait > 0) await sleep(wait);
  }
}

function ingest(v) {
  const now = Date.now();
  st.v = v; st.vAt = now;
  st.trip.ingest(v, geo());
  const kmh = C.speedKmh(v.erpm, geo());
  st.history.push({ t: now, speed: kmh, watts: v.voltage * v.inputCurrent, voltage: v.voltage, motorA: v.motorCurrent, battA: v.inputCurrent, fet: v.tempMosfet });
  if (st.history.length > 6000) st.history.splice(0, st.history.length - 6000);
  if (st.recording) st.rec.push({ t: now, speed: kmh, erpm: v.erpm, voltage: v.voltage, batteryCurrent: v.inputCurrent, motorCurrent: v.motorCurrent, watts: v.voltage * v.inputCurrent, duty: v.duty, tempMosfet: v.tempMosfet, tempMotor: motorSensor() ? v.tempMotor : null, tripKm: st.trip.km, fault: v.fault });
  if (v.fault && v.fault !== st.lastFault) { st.faults.unshift({ t: now, code: v.fault }); log('FAULT: ' + C.faultName(v.fault)); }
  st.lastFault = v.fault;
  const prev = new Set(st.alerts.map((a) => a.kind + a.level));
  const fresh = C.evaluateAlerts(v, pct(), S.battery, thresholds());
  if (fresh.some((a) => !prev.has(a.kind + a.level))) buzz(fresh[0].level === 'critical' ? 'error' : 'warn');
  st.alerts = st.alerts.filter((a) => a.kind === 'conn' && st.timeouts >= 5).concat(fresh);
  renderLive();
}

// ---------------- safety-gated writes ----------------
async function stationary() {
  if (!client) return { ok: false, failures: ['Not connected.'] };
  let v = null; try { v = await client.values(); ingest(v); } catch {}
  const p = caps().throttlePrefix; let thr = null;
  if (p) try { thr = await client.throttle(p === 'app_ppm_conf'); } catch {}
  return C.stationaryCheck(v, v ? 0 : Infinity, thr, !!p);
}

function planFor(kind) {
  if (!st.temp || !st.tempOK) throw new Error('Temporary limits are not supported by this controller.');
  const b = baselines[uuid()]; if (!b) throw new Error('No baseline for this controller.');
  if (st.tempUnknown) throw new Error('Controller limits don\'t match the saved baseline. Review them, then tap "Use current as baseline".');
  if (!S.geometryConfirmed) throw new Error('Confirm wheel size and pole pairs in Setup first.');
  let baseApp = st.app;
  if (b.appHex) try { baseApp = new C.ConfigBlob('appconf', C.unhex(b.appHex)); } catch {}
  return C.planProfile(S.profiles.find((p) => p.kind === kind), b.limits, st.temp, geo(), caps(), baseApp);
}

async function applyPlan(plan) {
  if (S.readOnly) throw new Error('Read-only mode is on.');
  const chk = await stationary(); if (!chk.ok) throw new Error(chk.failures.join('\n'));
  await client.setTemp(plan.limits);
  if (plan.app) await client.writeConfig(plan.app, false);
  const back = await client.temp(); st.temp = back;
  if (!C.tempLimitsEqual(back, plan.limits)) throw new Error('Controller reports different limits than requested (hardware clamp?).');
  if (plan.app) await refreshConfig('appconf');
  const b = baselines[uuid()]; b.lastProfile = plan.profile.kind; b.lastLimits = back; saveBaselines();
  st.activeProfile = plan.profile.kind; st.profileStatus = `${plan.profile.name} active (temporary until power-off).`;
  log(`Applied ${plan.profile.name}: max ERPM ${Math.round(back.maxERPM)}, max ${Math.round(back.wattMax)} W`);
  return `${plan.profile.name} applied and verified.`;
}

async function restoreBaseline() {
  if (S.readOnly) throw new Error('Read-only mode is on.');
  const b = baselines[uuid()]; if (!b) throw new Error('No baseline.');
  const chk = await stationary(); if (!chk.ok) throw new Error(chk.failures.join('\n'));
  await client.setTemp(b.limits);
  if (caps().fwNumber >= 600 && b.appHex && st.app && C.hex(st.app.bytes) !== b.appHex) {
    try { const blob = new C.ConfigBlob('appconf', C.unhex(b.appHex)); if (blob.sig === st.app.sig) { await client.writeConfig(blob, false); await refreshConfig('appconf'); } } catch (e) { log(e.message); }
  }
  st.temp = await client.temp(); b.lastProfile = null; b.lastLimits = null; saveBaselines();
  st.activeProfile = null; st.tempUnknown = false; st.profileStatus = 'Normal configuration restored.';
  return 'Normal limits restored.';
}

function addBackup(blob, note) {
  backups.unshift({ id: Date.now() + Math.random().toString(36).slice(2, 6), at: Date.now(), uuid: st.fw.uuid, hw: st.fw.hw, fw: st.fw.version, kind: blob.kind, sig: blob.sig, hex: C.hex(blob.bytes), note });
  saveBackups();
}

async function writeConfig(orig, edited) {
  if (S.readOnly) throw new Error('Read-only mode is on.');
  if (C.validate(orig, edited, S.hw, geo()).some((i) => i.severity === 'blocked')) throw new Error('Blocked by validation.');
  if (edited.kind === 'mcconf' && (st.activeProfile || st.tempUnknown)) throw new Error('A temporary profile is active. Restore normal limits on the Profiles tab first.');
  const fresh = C.ConfigBlob.fromReply(edited.kind, await client.readRaw(edited.kind));
  if (!fresh.equals(orig)) throw new Error('The controller configuration changed since it was read. Reload and try again.');
  addBackup(fresh, 'Automatic backup before editing ' + edited.changes(orig).map((c) => c.name).join(', '));
  const chk = await stationary(); if (!chk.ok) throw new Error(chk.failures.join('\n'));
  await client.writeConfig(edited, true);
  const after = C.ConfigBlob.fromReply(edited.kind, await client.readRaw(edited.kind));
  if (edited.kind === 'mcconf') { st.mc = after; st.editMc = after.clone(); try { st.temp = await client.temp(); baselines[uuid()].limits = st.temp; saveBaselines(); } catch {} }
  else { st.app = after; st.editApp = after.clone(); if (baselines[uuid()]) { baselines[uuid()].appHex = C.hex(after.bytes); saveBaselines(); } }
  const bad = edited.changes(orig).filter((c) => Math.abs((after.get(c.name) ?? NaN) - c.new) > Math.max(1e-3, Math.abs(c.new) * 1e-4));
  if (bad.length) throw new Error(`Written, but the controller adjusted: ${bad.map((c) => c.name).join(', ')} (hardware clamp). A backup was saved.`);
  log(`Wrote ${edited.kind}: ${edited.changes(orig).map((c) => `${c.name}=${c.new}`).join(', ')}`);
  return 'Saved to the controller and verified. A backup was stored first.';
}

async function restoreBackup(bk) {
  if (S.readOnly) throw new Error('Read-only mode is on.');
  if (bk.uuid !== uuid()) throw new Error('This backup belongs to a different controller.');
  const target = new C.ConfigBlob(bk.kind, C.unhex(bk.hex));
  const cur = bk.kind === 'mcconf' ? st.mc : st.app;
  if (!cur || cur.sig !== target.sig) throw new Error('Different firmware configuration layout — cannot restore here.');
  if (bk.kind === 'mcconf' && (st.activeProfile || st.tempUnknown)) throw new Error('Restore normal limits on the Profiles tab first.');
  const fresh = C.ConfigBlob.fromReply(bk.kind, await client.readRaw(bk.kind));
  addBackup(fresh, 'Automatic backup before rollback');
  const chk = await stationary(); if (!chk.ok) throw new Error(chk.failures.join('\n'));
  await client.writeConfig(target, true);
  const after = C.ConfigBlob.fromReply(bk.kind, await client.readRaw(bk.kind));
  if (bk.kind === 'mcconf') { st.mc = after; st.editMc = after.clone(); try { st.temp = await client.temp(); baselines[uuid()].limits = st.temp; saveBaselines(); } catch {} } else { st.app = after; st.editApp = after.clone(); }
  return after.equals(target) ? 'Restored and verified.' : 'Restored, but read-back differs (firmware may clamp values).';
}

async function backupNow() {
  for (const kind of ['mcconf', 'appconf']) {
    const raw = await client.readRaw(kind); const bytes = raw.slice(1);
    let sig = 0; try { sig = new C.Reader(bytes).u32(); } catch {}
    backups.unshift({ id: Date.now() + kind, at: Date.now(), uuid: st.fw.uuid, hw: st.fw.hw, fw: st.fw.version, kind, sig, hex: C.hex(bytes), note: 'Manual backup' });
  }
  saveBackups(); downloadBackups();
  return 'Backed up both configurations and downloaded a copy.';
}

function downloadBackups() { download(`vescdash-backups-${stamp()}.json`, JSON.stringify(backups, null, 1), 'application/json'); }

// ---------------- recording ----------------
function startRecording() { st.rec = []; st.recStart = Date.now(); st.recording = true; render(); }
function stopRecording() {
  st.recording = false;
  if (st.rec.length) { download(`ride_${stamp(st.recStart)}.csv`, C.renderCSV(st.rec), 'text/csv'); log(`Ride log saved (${st.rec.length} samples)`); }
  st.rec = []; render();
}
function stamp(t = Date.now()) { const d = new Date(t), p = (n) => String(n).padStart(2, '0'); return `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())}_${p(d.getHours())}-${p(d.getMinutes())}-${p(d.getSeconds())}`; }
function download(name, text, type) {
  const url = URL.createObjectURL(new Blob([text], { type }));
  const a = Object.assign(document.createElement('a'), { href: url, download: name }); document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 5000);
}

// ---------------- UI: shell ----------------
const TABS = [['dash', 'Dashboard', 'M12 21a9 9 0 1 1 9-9M12 12l5-5'], ['profiles', 'Profiles', 'M4 6h16M4 12h10M4 18h6'], ['graphs', 'Graphs', 'M3 17l5-6 4 4 8-10'], ['settings', 'Settings', 'M6 4v16M18 4v16M12 4v16M4 9h4M10 14h4M16 7h4'], ['bt', 'Bluetooth', 'M7 7l10 10-5 5V2l5 5L7 17']];

function render() {
  $('#demo').hidden = st.source !== 'demo';
  $('#tabs').innerHTML = TABS.map(([id, label, d]) => `<button class="tab ${st.tab === id ? 'on' : ''}" data-tab="${id}"><svg viewBox="0 0 24 24"><path d="${d}"/></svg><span>${label}</span></button>`).join('');
  renderAlerts();
  const v = $('#view');
  v.innerHTML = ({ dash: viewDash, profiles: viewProfiles, graphs: viewGraphs, settings: viewSettings, bt: viewBT })[st.tab]();
  if (st.tab === 'graphs') drawCharts();
  if (st.tab === 'bt') renderConsole();
}
function renderAlerts() {
  $('#alerts').innerHTML = st.alerts.slice(0, 3).map((a) => `<div class="alert ${a.level}"><b>${esc(a.title)}</b><span>${esc(a.detail)}</span></div>`).join('');
}
function renderLive() {
  renderAlerts();
  if (st.tab === 'dash') { if ($('#speed')) updateDash(); else render(); }
  else if (st.tab === 'graphs') { if (!st._chartPending) { st._chartPending = true; requestAnimationFrame(() => { st._chartPending = false; drawCharts(); }); } }
  else if (st.tab === 'bt' && $('#linkstats')) $('#linkstats').innerHTML = linkStats();
  if (st.recording && $('#reccount')) $('#reccount').textContent = `${st.rec.length} samples`;
}

// ---------------- UI: dashboard ----------------
function gaugeArc(frac, r, w, cls) {
  const a0 = 135, sweep = 270 * Math.min(Math.max(frac, 0), 1), rad = (d) => d * Math.PI / 180;
  const p = (d) => `${150 + r * Math.cos(rad(d))} ${150 + r * Math.sin(rad(d))}`;
  const track = `M${p(a0)} A${r} ${r} 0 1 1 ${p(a0 + 270)}`;
  const fill = sweep < 0.5 ? '' : `M${p(a0)} A${r} ${r} 0 ${sweep > 180 ? 1 : 0} 1 ${p(a0 + sweep)}`;
  return `<path class="track" d="${track}" stroke-width="${w}"/><path class="${cls}" d="${fill}" stroke-width="${w}"/>`;
}

function viewDash() {
  if (!st.ready) return `<section class="card center"><h2>No controller connected</h2>
    <p class="dim">${esc(st.handshake || 'Connect your VESC Bluetooth module, or try the demo. Nothing is shown until real data arrives.')}</p>
    <button class="btn primary" data-act="connect">Connect Bluetooth</button> <button class="btn" data-act="demo">Try demo</button>
    ${!navigator.bluetooth ? `<p class="warn small">${bluetoothHelp()}</p>` : ''}</section>`;
  return `<section class="card gauge-card">
    <div class="head"><span class="brand">KUKIRIN G2 MASTER</span>${st.activeProfile ? `<span class="pill">${st.activeProfile.toUpperCase()}</span>` : ''}</div>
    <div class="gauge"><svg viewBox="0 0 300 300" id="gsvg"></svg>
      <div class="gcenter"><div id="speed" class="big">—</div><div class="unit">km/h</div><div id="watts" class="watts">— W</div></div></div>
    <div class="batt"><span id="bpct">— %</span><small>est.</small><span class="sp"></span><span id="bvolt">— V</span></div>
    <div class="bar"><div id="bbar"></div></div></section>
    <section class="grid" id="tiles"></section>
    <section class="card row"><button class="btn ${st.recording ? 'danger' : 'primary'}" data-act="rec">${st.recording ? '■ Stop & download log' : '● Record ride log'}</button>
    <span id="reccount" class="dim small">${st.recording ? st.rec.length + ' samples' : ''}</span><span class="sp"></span><button class="btn ghost small" data-act="resettrip">Reset trip</button></section>
    <p class="foot">Speed and distance come from controller ERPM and tachometer using your Setup values. Battery % is estimated from voltage.</p>`;
}

function tile(title, val, unit, cls = '', foot = '') {
  return `<div class="tile"><div class="tt">${title}</div><div class="tv ${val === '—' ? 'faint' : cls}">${val}<small>${unit}</small></div>${foot ? `<div class="tf">${foot}</div>` : ''}</div>`;
}
function tempCls(t, start) { return t == null ? '' : t >= start ? 'red' : t >= start - 10 ? 'amber' : ''; }

function updateDash() {
  const v = st.v; if (!v) return;
  const kmh = Math.abs(C.speedKmh(v.erpm, geo())), w = v.voltage * v.inputCurrent, p = pct(), th = thresholds();
  const maxPow = Math.max(2000, ...S.profiles.map((x) => x.power));
  $('#gsvg').innerHTML = gaugeArc(kmh / 80, 130, 16, 'fill') + gaugeArc(Math.max(w, 0) / maxPow, 104, 5, 'fill2');
  $('#speed').textContent = show(kmh); $('#watts').textContent = `${show(w)} W`; $('#watts').className = 'watts' + (w < 0 ? ' green' : '');
  const bc = p <= S.battery.critical ? 'red' : p <= S.battery.low ? 'amber' : 'green';
  $('#bpct').textContent = `${show(p)} %`; $('#bpct').className = bc; $('#bvolt').textContent = `${show(v.voltage, 1)} V`;
  $('#bbar').style.width = `${p}%`; $('#bbar').className = bc;
  const remWh = C.nominalWh(S.battery) * p / 100, wpk = st.trip.whPerKm;
  $('#tiles').innerHTML = [
    tile('Battery current', show(v.inputCurrent, 1), 'A', v.inputCurrent < 0 ? 'green' : ''),
    tile('Motor current', show(v.motorCurrent, 1), 'A'),
    tile('Motor RPM', show(v.erpm / geo().polePairs), 'rpm', '', `ERPM ${show(v.erpm)}`),
    tile('Duty cycle', show(v.duty * 100), '%', Math.abs(v.duty) > 0.9 ? 'amber' : ''),
    tile('Controller temp', show(v.tempMosfet), '°C', tempCls(v.tempMosfet, th.fetStart)),
    tile('Motor temp', motorSensor() ? show(v.tempMotor) : '—', '°C', motorSensor() ? tempCls(v.tempMotor, th.motorStart) : '', motorSensor() ? '' : 'no sensor reported'),
    tile('Trip', show(st.trip.km, 2), 'km', '', `max ${show(st.trip.maxKmh)} km/h`),
    tile('Odometer', show(st.odo == null ? null : st.odo / 1000, 1), 'km', '', st.odoSupported === false ? 'not reported' : 'controller'),
    tile('Consumption', show(wpk, 1), 'Wh/km', '', wpk == null ? 'needs ≥ 0.3 km' : `${show(st.trip.netWh, 1)} Wh trip`),
    tile('Est. range', show(wpk ? remWh / wpk : null), 'km', '', `≈${show(remWh)} Wh left`),
  ].join('');
}

function curveSVG(expo, w = 90, h = 56) {
  let d = ''; for (let i = 0; i <= 20; i++) { const x = i / 20, y = C.throttleCurve(x, expo); d += `${i ? 'L' : 'M'}${(x * (w - 8) + 4).toFixed(1)} ${(h - 4 - y * (h - 8)).toFixed(1)}`; }
  return `<svg class="curve" viewBox="0 0 ${w} ${h}" width="${w}" height="${h}"><path d="${d}"/></svg>`;
}

    ${S.profiles.map((p) => `<section class="card"><div class="head"><span class="pname ${st.activeProfile === p.kind ? 'neon' : ''}">${p.name}</span>${st.activeProfile === p.kind ? '<span class="pill solid">ACTIVE</span>' : ''}<span class="sp"></span><button class="btn ghost small" data-act="editprofile" data-k="${p.kind}">Edit</button></div>

// ---------------- UI: graphs ----------------
const METRICS = [['speed', 'Speed', 'km/h', '#00b8ff'], ['watts', 'Power', 'W', '#3de3ff'], ['voltage', 'Battery voltage', 'V', '#33f29a'], ['motorA', 'Motor current', 'A', '#ffb021'], ['battA', 'Battery current', 'A', '#b07cff'], ['fet', 'Controller temperature', '°C', '#ff3b4f']];
let graphRange = 60;
function viewGraphs() {
  return `<h1>Live graphs</h1><div class="seg">${[30, 60, 300, 600].map((r) => `<button data-range="${r}" class="${graphRange === r ? 'on' : ''}">${r < 60 ? r + ' s' : r / 60 + ' min'}</button>`).join('')}</div>
    ${st.history.length ? METRICS.map(([k, t, u]) => `<section class="card chart"><div class="head"><span class="lbl">${t}</span><span class="sp"></span><span id="cv-${k}" class="mono"></span></div><canvas id="c-${k}"></canvas><div class="mm small faint" id="mm-${k}"></div></section>`).join('') : '<section class="card dim">No telemetry yet. Graphs show real controller data once connected.</section>'}
    <section class="card"><div class="lbl">Controller faults this session</div>${st.faults.length ? st.faults.map((f) => `<div class="chg"><b class="red mono">${new Date(f.t).toLocaleTimeString()} ${C.faultName(f.code)}</b><div class="small dim">${C.faultHelp(f.code)}</div></div>`).join('') : '<p class="green">✓ No faults reported</p>'}</section>
    <section class="card"><div class="head"><span class="lbl">Ride log (CSV)</span><span class="sp"></span><button class="btn ${st.recording ? 'danger' : 'primary'} small" data-act="rec" ${st.ready || st.recording ? '' : 'disabled'}>${st.recording ? 'Stop & download' : 'Start recording'}</button></div>
    <p class="small dim">${st.recording ? `<span id="reccount">${st.rec.length} samples</span>` : 'Recording downloads a CSV file when you stop.'}</p></section>`;
}
function drawCharts() {
  if (st.tab !== 'graphs') return;
  const now = Date.now(), from = now - graphRange * 1000;
  let pts = st.history.filter((p) => p.t >= from); const stride = Math.ceil(pts.length / 400); if (stride > 1) pts = pts.filter((_, i) => i % stride === 0);
  for (const [k, , u, col] of METRICS) {
    const cv = $('#c-' + k); if (!cv) continue;
    const dpr = window.devicePixelRatio || 1, W = cv.clientWidth, H = 110;
    if (cv.width !== W * dpr) { cv.width = W * dpr; cv.height = H * dpr; }
    const g = cv.getContext('2d'); g.setTransform(dpr, 0, 0, dpr, 0, 0); g.clearRect(0, 0, W, H);
    if (!pts.length) continue;
    const vals = pts.map((p) => p[k]); let lo = Math.min(...vals), hi = Math.max(...vals); if (hi - lo < 1e-6) { hi += 1; lo -= 1; } const pad = (hi - lo) * 0.1; lo -= pad; hi += pad;
    const X = (t) => 34 + (t - from) / (now - from) * (W - 38), Y = (v) => 6 + (1 - (v - lo) / (hi - lo)) * (H - 16);
    g.strokeStyle = 'rgba(255,255,255,.06)'; g.fillStyle = 'rgba(255,255,255,.35)'; g.font = '10px ui-rounded, system-ui'; g.lineWidth = 1;
    for (let i = 0; i <= 2; i++) { const v = lo + (hi - lo) * i / 2, y = Y(v); g.beginPath(); g.moveTo(34, y); g.lineTo(W, y); g.stroke(); g.fillText(Math.abs(v) >= 100 ? v.toFixed(0) : v.toFixed(1), 0, y + 3); }
    g.beginPath(); pts.forEach((p, i) => (i ? g.lineTo : g.moveTo).call(g, X(p.t), Y(p[k])));
    g.strokeStyle = col; g.lineWidth = 2; g.shadowColor = col; g.shadowBlur = 6; g.stroke(); g.shadowBlur = 0;
    g.lineTo(X(pts[pts.length - 1].t), H - 10); g.lineTo(X(pts[0].t), H - 10); g.closePath();
    const gr = g.createLinearGradient(0, 0, 0, H); gr.addColorStop(0, col + '40'); gr.addColorStop(1, col + '00'); g.fillStyle = gr; g.fill();
    $('#cv-' + k).textContent = `${show(vals[vals.length - 1], 1)} ${u}`; $('#cv-' + k).style.color = col;
    $('#mm-' + k).textContent = `min ${show(Math.min(...vals), 1)} · max ${show(Math.max(...vals), 1)}`;
  }
}

function viewSettings() {

  const defs = C.supportedSettings(st.mc, st.app);
  const groups = [...new Set(defs.map((d) => d.group))];
  const n = pending().length;
  return `<h1>VESC settings</h1><section class="card small">
    <div>Firmware <b>${st.fw.version}</b> · Motor config: ${st.mc ? 'verified layout' : `<span class="amber">${esc(st.mcErr || 'not available')}</span>`} · App config: ${st.app ? 'verified layout' : `<span class="amber">${esc(st.appErr || 'not available')}</span>`}</div>
    ${S.readOnly ? '<p class="amber">🔒 Read-only mode: you can try edits, but writing is disabled (Bluetooth tab).</p>' : ''}
    ${!S.hwConfirmed ? '<p class="amber">Confirm your controller and battery ratings in Bluetooth › Hardware limits. Validation uses them.</p>' : ''}

    <div class="row"><button class="btn small" data-act="reloadcfg">Reload from controller</button><span class="sp"></span><button class="btn primary" data-act="review" ${n ? '' : 'disabled'}>Review changes (${n})</button></div></section>
    ${groups.map((g) => `<section class="card"><div class="lbl">${g}</div>${defs.filter((d) => d.group === g).map(settingRow).join('')}</section>`).join('')}`;
}
function settingRow(d) {
  const orig = (d.kind === 'mcconf' ? st.mc : st.app).get(d.field), ed = (d.kind === 'mcconf' ? st.editMc : st.editApp).get(d.field);
  const dec = d.step >= 1 ? 0 : d.step >= 0.1 ? 1 : 2, changed = Math.abs(orig - ed) > 1e-9;
  const kmh = /erpm/.test(d.field) && C.geometryValid(geo()) ? ` · ≈ ${show(Math.abs(C.speedKmh(ed, geo())))} km/h` : '';
  return `<div class="set ${changed ? 'changed' : ''}"><label><span>${d.title}</span><span class="in"><input type="number" inputmode="decimal" step="${d.step}" value="${(ed * d.factor).toFixed(dec)}" data-field="${d.field}" data-kind="${d.kind}" data-factor="${d.factor}"><small>${d.unit}</small></span></label>
    <div class="small dim">Controller: ${(orig * d.factor).toFixed(dec)} ${d.unit}${kmh}${changed ? ' · <b class="neon">EDITED</b>' : ''}</div><div class="small faint">${d.help}</div></div>`;
}
function pending() {
  const out = [];
  if (st.mc && st.editMc) { const c = st.editMc.changes(st.mc); if (c.length) out.push({ orig: st.mc, ed: st.editMc, c, issues: C.validate(st.mc, st.editMc, S.hw, geo()) }); }
  if (st.app && st.editApp) { const c = st.editApp.changes(st.app); if (c.length) out.push({ orig: st.app, ed: st.editApp, c, issues: C.validate(st.app, st.editApp, S.hw, geo()) }); }
  return out;
}
function reviewChanges() {
  const items = pending(); const title = (f) => (C.SETTINGS.find((s) => s.field === f) || {}).title || f;
  const blocked = items.some((i) => i.issues.some((x) => x.severity === 'blocked')), warn = items.some((i) => i.issues.some((x) => x.severity === 'warning'));
  modal('Review changes', items.map((i) => `<div class="lbl">${i.ed.kind === 'mcconf' ? 'Motor configuration' : 'App configuration'}</div>
      ${i.c.map((c) => `<div class="chg mono">${title(c.name)}: ${show(c.old, 2)} → <span class="neon">${show(c.new, 2)}</span></div>`).join('')}
      ${i.issues.map((x) => `<div class="issue ${x.severity}">${x.severity === 'blocked' ? '⛔' : '⚠️'} ${esc(x.message)}</div>`).join('')}`).join('')
    + `<ul class="small"><li>A full backup is saved before writing.</li><li>The scooter must be stationary with throttle released.</li><li>Values are read back and verified.</li></ul>
    ${warn && !blocked ? '<label class="chk"><input type="checkbox" id="ack"> I understand the warnings and accept the risk</label>' : ''}
    ${S.readOnly ? '<p class="amber">🔒 Read-only mode is on.</p>' : blocked ? '<p class="red">Some changes are blocked and cannot be written.</p>' : ''}`,
  [['Discard edits', () => { st.editMc = st.mc && st.mc.clone(); st.editApp = st.app && st.app.clone(); render(); }], ['Cancel'], ['Write', () => {
    if (warn && !$('#ack').checked) { modalInfo('Confirm', 'Tick the acknowledgement box first.'); return; }
    runTask(async () => { const msgs = []; for (const i of items) msgs.push(await writeConfig(i.orig, i.ed)); return msgs.join('\n'); });
  }, 'primary', blocked || S.readOnly]]);
}

    <span>Temporary limits</span><b>${st.tempOK ? 'Supported' : 'Not supported'}</b><span>Throttle app</span><b>${appToUse() == null ? '—' : apps[appToUse()] || appToUse()}</b>
    ${v ? `<span>Fault</span><b class="${v.fault ? 'red' : ''}">${C.faultName(v.fault)}</b>${v.tempMosfets ? `<span>MOSFET NTCs</span><b>${v.tempMosfets.map((x) => x.toFixed(1)).join(' / ')} °C</b>` : ''}
    ${v.status != null ? `<span>Kill switch</span><b>${v.status & 2 ? 'ACTIVE' : 'off'}</b>` : ''}<span>Ah used / charged</span><b>${show(v.ah, 2)} / ${show(v.ahCharged, 2)}</b><span>Wh used / charged</span><b>${show(v.wh, 1)} / ${show(v.whCharged, 1)}</b>` : ''}</div>` : '<p class="dim">Not connected</p>'}</section>
  <section class="card"><div class="lbl">Safety</div>
    <label class="chk big"><input type="checkbox" data-act="readonly" ${S.readOnly ? 'checked' : ''}> Read-only mode <span class="small ${S.readOnly ? 'green' : 'amber'}">${S.readOnly ? '— nothing is ever written' : '— writes allowed after confirmation'}</span></label>
    <label class="chk"><input type="checkbox" data-setting="vibrate" ${S.vibrate ? 'checked' : ''}> Vibrate on alerts (where supported)</label>
    <div class="row"><button class="btn" data-act="backupnow" ${st.ready ? '' : 'disabled'}>Back up configuration now</button><button class="btn" data-act="backups">Backups (${backups.length})</button></div>
    <p class="small faint">The app never sends motor commands, never accelerates the motor, and does not replace your brakes. Losing Bluetooth does not stop the scooter.</p></section>
  <section class="card"><div class="lbl">Setup</div><div class="row">
    <button class="btn" data-act="vehicle">Vehicle &amp; battery ${S.geometryConfirmed ? '✓' : '<span class="amber">(not confirmed)</span>'}</button>
    <button class="btn" data-act="hw">Hardware limits ${S.hwConfirmed ? '✓' : '<span class="amber">(not confirmed)</span>'}</button></div>
    <label>Telemetry rate: <b id="hzv">${S.pollHz}</b> Hz<input type="range" min="2" max="20" value="${S.pollHz}" data-setting="pollHz"></label></section>
  <section class="card"><div class="lbl">Link statistics</div><p class="small mono" id="linkstats">${linkStats()}</p></section>
  <section class="card"><div class="head"><span class="lbl">Console</span><span class="sp"></span><label class="chk small"><input type="checkbox" data-setting-st="traffic" ${st.traffic ? 'checked' : ''}> raw packets</label><button class="btn ghost small" data-act="clearlog">Clear</button></div><div id="console" class="console"></div></section>
  <p class="foot">VESCDash web · protocol verified against VESC firmware source (vedderb/bldc, GPL-3.0)</p>`;
}
function renderConsole() { const c = $('#console'); if (c) c.innerHTML = st.console.slice(-120).reverse().map((l) => `<div><span class="faint">${l.t.toLocaleTimeString()}</span> ${esc(l.s)}</div>`).join(''); }

function vehicleSetup() {
  const g = S.geometry, b = S.battery;
  modal('Vehicle & battery setup', `<div class="lbl">Wheel &amp; motor</div>
    <label>Wheel diameter (mm)<input type="number" id="vs-wheel" value="${Math.round(g.wheelDiameter * 1000)}"></label>
    <label>Motor pole pairs<input type="number" id="vs-pp" value="${g.polePairs}"></label>
    <label>Gear ratio (hub motor = 1)<input type="number" id="vs-gear" value="${g.gearRatio}" step="0.01"></label>
    ${st.mc || st.temp ? '<button class="btn small" id="vs-import">Import from controller</button>' : ''}
    <p class="small dim">Measure the loaded tyre's outer diameter. Pole pairs = magnets ÷ 2 (VESC Tool "motor poles" ÷ 2). Check: dashboard speed must match GPS speed.</p>
    <div class="lbl">Battery</div>
    <label>Cells in series<input type="number" id="vs-cells" value="${b.cells}"></label>
    <label>Full voltage (V)<input type="number" id="vs-full" value="${b.full}" step="0.1"></label>
    <label>Empty voltage (V)<input type="number" id="vs-empty" value="${b.empty}" step="0.1"></label>
    <label>Capacity (Ah)<input type="number" id="vs-ah" value="${b.capacityAh}" step="0.5"></label>
    <label>Low warning (%)<input type="number" id="vs-low" value="${b.low}"></label><label>Critical warning (%)<input type="number" id="vs-crit" value="${b.critical}"></label>
    <p class="small dim">16S Li-ion: full 67.2 V. Empty 48.0 V = 3.0 V/cell; raise it if your BMS cuts off earlier.</p>`,
  [['Cancel'], ['Save & confirm', () => {
    const ng = { wheelDiameter: +$('#vs-wheel').value / 1000, polePairs: Math.round(+$('#vs-pp').value), gearRatio: +$('#vs-gear').value };
    if (!C.geometryValid(ng)) { modalInfo('Setup', 'Wheel diameter, pole pairs or gear ratio look invalid.'); return; }
    S.geometry = ng; S.geometryConfirmed = true;
    S.battery = { cells: +$('#vs-cells').value, full: +$('#vs-full').value, empty: +$('#vs-empty').value, capacityAh: +$('#vs-ah').value, low: +$('#vs-low').value, critical: +$('#vs-crit').value };
    saveSettings(); render();
  }, 'primary']]);
  const imp = $('#vs-import');
  if (imp) imp.onclick = () => {
    const poles = st.mc ? st.mc.get('si_motor_poles') : st.temp && st.temp.poles, wheel = st.mc ? st.mc.get('si_wheel_diameter') : st.temp && st.temp.wheelDiameter, gear = st.mc ? st.mc.get('si_gear_ratio') : st.temp && st.temp.gearRatio;
    if (poles >= 2 && wheel > 0.05) { $('#vs-wheel').value = Math.round(wheel * 1000); $('#vs-pp').value = Math.round(poles / 2); $('#vs-gear').value = gear || 1; imp.textContent = 'Imported — check the values'; }
    else imp.textContent = 'Controller has no usable values';
  };
}

function hardwareSetup() {
  const h = S.hw;
  modal('Hardware limits', `<p class="small dim">Defaults: FSESC 75/200 Pro model designation (75 V / 200 A) and your current 55 A battery setting; 10 A regen is a placeholder. Enter your battery/BMS real ratings.</p>
    <label>Controller max voltage (V)<input type="number" id="hw-v" value="${h.maxVoltage}"></label>
    <label>Controller max motor current (A)<input type="number" id="hw-mc" value="${h.maxMotorCurrent}"></label>
    <label>Battery max discharge (A)<input type="number" id="hw-bd" value="${h.battMaxDischarge}"></label>
    <label>Battery max charge / regen (A)<input type="number" id="hw-bc" value="${h.battMaxCharge}"></label>
    <label>Max MOSFET cutoff (°C)<input type="number" id="hw-ft" value="${h.maxFetCutoff}"></label>
    <label>Max motor cutoff (°C)<input type="number" id="hw-mt" value="${h.maxMotorCutoff}"></label>
    <label>Field weakening ≤ % of motor current<input type="number" id="hw-fw" value="${Math.round(h.maxFwFraction * 100)}"></label>
    <label>Absolute speed limit (km/h)<input type="number" id="hw-sp" value="${h.maxSpeedKmh}"></label>`,
  [['Cancel'], ['Save & confirm', () => {
    Object.assign(S.hw, { maxVoltage: +$('#hw-v').value, maxMotorCurrent: +$('#hw-mc').value, battMaxDischarge: +$('#hw-bd').value, battMaxCharge: +$('#hw-bc').value, maxFetCutoff: +$('#hw-ft').value, maxMotorCutoff: +$('#hw-mt').value, maxFwFraction: +$('#hw-fw').value / 100, maxSpeedKmh: +$('#hw-sp').value });
    S.hwConfirmed = true; saveSettings(); render();
  }, 'primary']]);
}

function backupsView() {
  modal('Configuration backups', `<p class="small dim">Stored in this browser. Download a copy to keep it safe. Restoring only works on the same controller with the same firmware layout, and makes a new backup first.</p>
    <div class="row"><button class="btn small" id="bk-dl">Download all</button><label class="btn small">Import file<input type="file" id="bk-up" accept=".json" hidden></label></div>
    ${backups.length ? backups.map((b) => `<div class="chg"><b>${b.kind === 'mcconf' ? 'Motor' : 'App'} config · FW ${b.fw}</b> <span class="small dim">${new Date(b.at).toLocaleString()}</span>
      <div class="small dim">${esc(b.note)}${st.fw && b.uuid !== st.fw.uuid ? ' · <span class="amber">different controller</span>' : ''}</div>
      <button class="btn small" data-restore="${b.id}" ${st.ready ? '' : 'disabled'}>Restore…</button></div>`).join('') : '<p class="dim">No backups yet.</p>'}`, [['Close']]);
  $('#bk-dl').onclick = downloadBackups;
  $('#bk-up').onchange = async (e) => { try { const arr = JSON.parse(await e.target.files[0].text()); const ids = new Set(backups.map((b) => b.id)); backups = backups.concat(arr.filter((b) => b.hex && !ids.has(b.id))).sort((a, b) => b.at - a.at); saveBackups(); backupsView(); } catch (err) { modalInfo('Import', err.message); } };
  $('#modal').addEventListener('click', (e) => {
    const id = e.target.dataset.restore; if (!id) return;
    const bk = backups.find((b) => b.id === id); let summary = 'Cannot compare with the connected controller.';
    try { const t = new C.ConfigBlob(bk.kind, C.unhex(bk.hex)), cur = bk.kind === 'mcconf' ? st.mc : st.app; const ch = cur && cur.sig === t.sig ? t.changes(cur) : null; if (ch) summary = ch.length ? `${ch.length} field(s) will change:<br>` + ch.slice(0, 12).map((c) => `<span class="mono small">${esc(c.name)}: ${show(c.old, 3)} → ${show(c.new, 3)}</span>`).join('<br>') : 'Identical to current configuration.'; } catch {}
    modal('Restore this backup?', `<p>${summary}</p><p class="small">Scooter must be stationary with throttle released.</p>`, [['Cancel'], ['Restore', () => runTask(() => restoreBackup(bk)), 'danger', S.readOnly]]);
  });
}

// ---------------- modal helpers ----------------
function modal(title, body, buttons) {
  const m = $('#modal'); const fresh = m.cloneNode(false); m.replaceWith(fresh);
  fresh.innerHTML = `<div class="sheet"><h2>${esc(title)}</h2><div class="body">${body}</div><div class="actions">${buttons.map(([l, , cls, dis], i) => `<button class="btn ${cls || ''}" data-i="${i}" ${dis ? 'disabled' : ''}>${l}</button>`).join('')}</div></div>`;
  fresh.hidden = false;
  fresh.querySelectorAll('.actions button').forEach((b) => b.onclick = () => { const fn = buttons[+b.dataset.i][1]; closeModal(); fn && fn(); });
  fresh.onclick = (e) => { if (e.target === fresh) closeModal(); };
}
function closeModal() { $('#modal').hidden = true; }
function modalInfo(title, html) { modal(title, `<p>${html.replace(/\n/g, '<br>')}</p>`, [['OK', null, 'primary']]); }
async function runTask(fn) {
  modal('Working…', '<div class="spinner"></div><p class="center dim">Checking the scooter is stationary and talking to the controller…</p>', []);
  try { const msg = await fn(); modalInfo('Done', esc(msg)); } catch (e) { modalInfo('Not done', esc(e.message)); }
  render();
}

// ---------------- events ----------------
document.addEventListener('click', (e) => {
  const tb = e.target.closest('[data-tab]'); if (tb) { st.tab = tb.dataset.tab; render(); window.scrollTo(0, 0); return; }
  const rg = e.target.closest('[data-range]'); if (rg) { graphRange = +rg.dataset.range; render(); return; }
  const el = e.target.closest('[data-act]'); if (!el) return;
  const k = el.dataset.k;
  switch (el.dataset.act) {
    case 'connect': connectBLE(); break;
    case 'demo': startDemo(); break;
    case 'disconnect': disconnect(); break;
    case 'retry': if (transport) beginSession(transport); break;
    case 'rec': st.recording ? stopRecording() : startRecording(); break;
    case 'resettrip': st.trip.reset(); break;
    case 'plan': reviewPlan(k); break;
    case 'editprofile': editProfile(k); break;
    case 'restore': modal('Restore normal limits?', '<p>Scooter must be stationary with the throttle released.</p>', [['Cancel'], ['Restore', () => runTask(restoreBaseline), 'primary']]); break;
    case 'recapture': baselines[uuid()] = { limits: st.temp, appHex: st.app ? C.hex(st.app.bytes) : null, at: Date.now() }; saveBaselines(); st.tempUnknown = false; st.activeProfile = null; st.profileStatus = 'Baseline re-captured.'; render(); break;
    case 'reloadcfg': runTask(async () => { await refreshConfig('mcconf'); await refreshConfig('appconf'); return 'Configuration reloaded.'; }); break;
    case 'review': reviewChanges(); break;
    case 'backupnow': runTask(backupNow); break;
    case 'backups': backupsView(); break;
    case 'vehicle': vehicleSetup(); break;
    case 'hw': hardwareSetup(); break;
    case 'clearlog': st.console = []; renderConsole(); break;
    case 'readonly':
      e.preventDefault();
      if (S.readOnly) modal('Enable writing to the controller?', '<p>Profiles and settings changes will be sent to your controller after confirmation. Wrong settings can damage the controller, motor or battery, or make the scooter unsafe. Backups are made automatically before every write.</p>',
        [['Keep read-only'], ['Enable writes', () => { S.readOnly = false; saveSettings(); render(); }, 'danger']]);
      else { S.readOnly = true; saveSettings(); render(); }
      break;
  }
});
document.addEventListener('change', (e) => {
  const t = e.target;
  if (t.dataset.setting) { S[t.dataset.setting] = t.type === 'checkbox' ? t.checked : +t.value; saveSettings(); if (t.dataset.setting === 'pollHz') $('#hzv').textContent = t.value; }
  if (t.dataset.settingSt) st[t.dataset.settingSt] = t.checked;
  if (t.dataset.field) {
    const blob = t.dataset.kind === 'mcconf' ? st.editMc : st.editApp;
    try { blob.set(t.dataset.field, +t.value / +t.dataset.factor); } catch (err) { modalInfo('Invalid value', esc(err.message)); }
    render();
  }
});
document.addEventListener('input', (e) => { if (e.target.dataset.setting === 'pollHz') $('#hzv').textContent = e.target.value; });
setInterval(() => { if (st.tab === 'bt' && $('#linkstats')) $('#linkstats').innerHTML = linkStats(); }, 1000);

render();

})();
</script></body></html>
