function gaugeArc(frac, r, w, cls) {
  const a0 = 135, sweep = 270 * Math.min(Math.max(frac, 0), 1), rad = (d) => d * Math.PI / 180;
  const p = (d) => `${150 + r * Math.cos(rad(d))} ${150 + r * Math.sin(rad(d))}`;
  const track = `M${p(a0)} A${r} ${r} 0 1 1 ${p(a0 + 270)}`;
  const fill = sweep < 0.5 ? '' : `M${p(a0)} A${r} ${r} 0 ${sweep > 180 ? 1 : 0} 1 ${p(a0 + sweep)}`;
  return `<path class="track" d="${track}" stroke-width="${w}"/><path class="${cls}" d="${fill}" stroke-width="${w}"/>`;
}
function gaugeTicks(max) {
  let out = '';
  const step = max <= 50 ? 5 : 10;
  for (let v = 0; v <= max; v += step) {
    const a = (135 + 270 * v / max) * Math.PI / 180, major = v % (step * 2) === 0;
    const r1 = 112, r2 = major ? 100 : 105;
    out += `<line x1="${150 + r1 * Math.cos(a)}" y1="${150 + r1 * Math.sin(a)}" x2="${150 + r2 * Math.cos(a)}" y2="${150 + r2 * Math.sin(a)}" class="tick${major ? ' major' : ''}"/>`;
    if (major) out += `<text x="${150 + 88 * Math.cos(a)}" y="${150 + 88 * Math.sin(a) + 4}" class="ticklbl">${v}</text>`;
  }
  return out;
}

function tile(title, val, unit, cls = '', foot = '', icon = '') {
  return `<div class="tile">${icon ? `<div class="ticon">${icon}</div>` : ''}<div class="tt">${title}</div><div class="tv ${val === '—' ? 'faint' : cls}">${val}<small>${unit}</small></div>${foot ? `<div class="tf">${foot}</div>` : ''}</div>`;

function tempCls(t, start) { return t == null ? '' : t >= start ? 'red' : t >= start - 10 ? 'amber' : ''; }

function gaugeSVG(frac, powFrac, regenFrac, gmax, limFrac, over) {
  const cx = 150, cy = 150, a0 = 135, rad = (d) => d * Math.PI / 180, P = (r, d) => [cx + r * Math.cos(rad(d)), cy + r * Math.sin(rad(d))];
  const arc = (r, f) => { const to = a0 + 270 * Math.min(Math.max(f, 0), 1); if (to - a0 < 0.5) return ''; const [x0, y0] = P(r, a0), [x1, y1] = P(r, to); return `M${x0.toFixed(1)} ${y0.toFixed(1)} A${r} ${r} 0 ${to - a0 > 180 ? 1 : 0} 1 ${x1.toFixed(1)} ${y1.toFixed(1)}`; };
  const N = 60; let s = '';
  const lit = Math.round(Math.min(Math.max(frac, 0), 1) * N);
  for (let i = 0; i <= N; i++) {
    const d = a0 + 270 * i / N, [x0, y0] = P(116, d), [x1, y1] = P(i % 5 === 0 ? 140 : 136, d), on = i <= lit && lit > 0;
    s += `<line x1="${x0.toFixed(1)}" y1="${y0.toFixed(1)}" x2="${x1.toFixed(1)}" y2="${y1.toFixed(1)}" class="seg${on ? (over ? ' over' : ' on') : ''}${on && i === lit ? ' tip' : ''}" style="${on ? `opacity:${(0.35 + 0.65 * i / Math.max(lit, 1)).toFixed(2)}` : ''}"/>`;
  }
  const step = gmax <= 50 ? 10 : 20;
  for (let v = step; v < gmax; v += step) { const [x, y] = P(96, a0 + 270 * v / gmax); s += `<text x="${x.toFixed(1)}" y="${(y + 4).toFixed(1)}" class="glbl">${v}</text>`; }
  s += `<path class="ptrack" d="${arc(106, 1)}"/>`;
  if (regenFrac > 0.005) s += `<path class="regenarc" d="${arc(106, regenFrac)}"/>`;
  else s += `<path class="powarc" d="${arc(106, powFrac)}"/>`;
  if (limFrac != null && limFrac < 1) { const d = a0 + 270 * limFrac, [x0, y0] = P(112, d), [x1, y1] = P(146, d); s += `<line x1="${x0}" y1="${y0}" x2="${x1}" y2="${y1}" class="limit"/>`; }
  return s;
}

// ======================= PREMIUM: battery health (internal resistance) =======================
// R = -ΔV/ΔI between consecutive samples with a big current step. A rising pack resistance
// over the months means an ageing pack (more sag, less range and power).
function trackResistance(v, now) {
  const l = st._rLast; st._rLast = { V: v.voltage, I: v.inputCurrent, t: now };
  if (!l || now - l.t > 350) return;
  const dI = v.inputCurrent - l.I, dV = v.voltage - l.V;
  if (Math.abs(dI) < 8) return;
  const R = -dV / dI; if (R > 0.005 && R < 1) { st.rSamples.push(R); if (st.rSamples.length > 400) st.rSamples.shift(); }
}
const median = (a) => { if (!a.length) return null; const s = [...a].sort((x, y) => x - y); return s[Math.floor(s.length / 2)]; };
function batteryHealth() {
  const pts = rides.filter((r) => !r.demo && r.rOhm).map((r) => ({ t: r.start, R: r.rOhm })).reverse();
  const cur = median(st.rSamples) || (pts.length ? pts[pts.length - 1].R : null);
  const first = pts.length ? median(pts.slice(0, 3).map((p) => p.R)) : null;
  const health = cur && first ? Math.max(0, Math.min(100, 100 - (cur / first - 1) * 100)) : null;
  return { pts, cur, first, health };
}

function settingRow(d) {
  const orig = (d.kind === 'mcconf' ? st.mc : st.app).get(d.field), ed = (d.kind === 'mcconf' ? st.editMc : st.editApp).get(d.field);
  const dec = d.step >= 1 ? 0 : d.step >= 0.1 ? 1 : 2, changed = Math.abs(orig - ed) > 1e-9;
  const kmh = /erpm/.test(d.field) && C.geometryValid(geo()) ? ` · ≈ ${show(Math.abs(C.speedKmh(ed, geo())))} km/h` : '';
  return `<div class="set ${changed ? 'changed' : ''}"><label><span>${d.title}</span><span class="in"><input type="number" inputmode="decimal" step="${d.step}" value="${(ed * d.factor).toFixed(dec)}" data-field="${d.field}" data-kind="${d.kind}" data-factor="${d.factor}"><small>${d.unit}</small></span></label>
    <div class="small dim">Controller: ${(orig * d.factor).toFixed(dec)} ${d.unit}${kmh}${changed ? ' · <b class="neon">EDITED</b>' : ''}</div><div class="small faint">${d.help}</div></div>`;
}
function pending() {
  const out = [];
  if (st.mc && st.editMc) { const c = st.editMc.changes(st.mc); if (c.length) out.push({ orig: st.mc, ed: st.editMc, c, issues: C.validate(st.mc, st.editMc, S.hw, geo()) }); }
  if (st.app && st.editApp) { const c = st.editApp.changes(st.app); if (c.length) out.push({ orig: st.app, ed: st.editApp, c, issues: C.validate(st.app, st.editApp, S.hw, geo()) }); }
  return out;
}
function reviewChanges() {
  const items = pending(); const title = (f) => (C.SETTINGS.find((s) => s.field === f) || {}).title || f;
  const blocked = items.some((i) => i.issues.some((x) => x.severity === 'blocked')), warn = items.some((i) => i.issues.some((x) => x.severity === 'warning'));
  modal('Review changes', items.map((i) => `<div class="lbl">${i.ed.kind === 'mcconf' ? 'Motor configuration' : 'App configuration'}</div>
      ${i.c.map((c) => `<div class="chg mono">${title(c.name)}: ${show(c.old, 2)} → <span class="neon">${show(c.new, 2)}</span></div>`).join('')}
      ${i.issues.map((x) => `<div class="issue ${x.severity}">${x.severity === 'blocked' ? '⛔' : '⚠️'} ${esc(x.message)}</div>`).join('')}`).join('')
    + `<ul class="small"><li>A full backup is saved before writing.</li><li>The scooter must be stationary with throttle released.</li><li>Values are read back and verified.</li></ul>
    ${warn && !blocked ? '<label class="chk"><input type="checkbox" id="ack"> I understand the warnings and accept the risk</label>' : ''}
    ${S.readOnly ? '<p class="amber">🔒 Read-only mode is on.</p>' : blocked ? '<p class="red">Some changes are blocked and cannot be written.</p>' : ''}`,
  [['Discard edits', () => { st.editMc = st.mc && st.mc.clone(); st.editApp = st.app && st.app.clone(); render(); }], ['Cancel'], ['Write', () => {
    if (warn && !$('#ack').checked) { modalInfo('Confirm', 'Tick the acknowledgement box first.'); return; }
    runTask(async () => { const msgs = []; for (const i of items) msgs.push(await writeConfig(i.orig, i.ed)); return msgs.join('\n'); });
  }, 'primary', blocked || S.readOnly]]);
}

// GPS wheel calibration: compares GPS ground speed with controller-derived speed while riding
// steadily, then suggests a corrected wheel diameter.
let gpsWatch = null;
function gpsCalibrate() {
  if (!navigator.geolocation) return modalInfo('GPS', 'This browser has no location access.');
  const samples = [];
  modal('Calibrate speed with GPS', `<p class="small">Ride in a straight line at a steady speed above 15 km/h for about 20 seconds, somewhere safe with open sky. Keep the phone mounted — don't look at it while riding.</p>
    <div class="kv"><span>GPS speed</span><b id="gp-g">—</b><span>App speed</span><b id="gp-a">—</b><span>Good samples</span><b id="gp-n">0</b><span>Suggested wheel</span><b id="gp-w">—</b></div>`,
  [['Cancel', stopGps], ['Use suggested size', () => {
    stopGps(); if (samples.length < 10) return modalInfo('GPS', 'Not enough steady samples yet (need 10).');
    const ratio = samples.reduce((a, b) => a + b, 0) / samples.length;
    S.geometry.wheelDiameter = Math.round(S.geometry.wheelDiameter * ratio * 1000) / 1000; saveSettings();
    modalInfo('Calibrated', `Wheel diameter set to ${Math.round(S.geometry.wheelDiameter * 1000)} mm (correction ${((ratio - 1) * 100).toFixed(1)} %).`); render();
  }, 'primary']]);
  gpsWatch = navigator.geolocation.watchPosition((pos) => {
    const g = pos.coords.speed == null ? null : pos.coords.speed * 3.6, a = st.v ? Math.abs(C.speedKmh(st.v.erpm, geo())) : null;
    if ($('#gp-g')) { $('#gp-g').textContent = g == null ? 'no speed from GPS yet' : `${g.toFixed(1)} km/h (±${(pos.coords.accuracy || 0).toFixed(0)} m)`; $('#gp-a').textContent = a == null ? '—' : `${a.toFixed(1)} km/h`; }
    if (g != null && a != null && g > 15 && a > 15 && (pos.coords.accuracy || 99) < 20) {
      samples.push(g / a); if (samples.length > 60) samples.shift();
      const r = samples.reduce((x, y) => x + y, 0) / samples.length;
      if ($('#gp-n')) { $('#gp-n').textContent = samples.length; $('#gp-w').textContent = `${Math.round(S.geometry.wheelDiameter * r * 1000)} mm`; }
    }
  }, (err) => { if ($('#gp-g')) $('#gp-g').textContent = 'GPS error: ' + err.message; }, { enableHighAccuracy: true, maximumAge: 0 });
}
function stopGps() { if (gpsWatch != null) navigator.geolocation.clearWatch(gpsWatch); gpsWatch = null; }

}

async function searchPlaces(q, signal) {
  const u = new URL(API.search); u.searchParams.set('q', q); u.searchParams.set('limit', '8');
  if (nav.pos) { u.searchParams.set('lat', nav.pos.lat.toFixed(4)); u.searchParams.set('lon', nav.pos.lon.toFixed(4)); }
  const j = await getJSON(u.toString(), { signal }), seen = new Set();
  return (j.features || []).map((f) => {
    const p = f.properties || {}, [lon, lat] = f.geometry.coordinates;
    const street = [p.street, p.housenumber].filter(Boolean).join(' ');
    const name = p.name || street || p.city || 'Unnamed place';
    return { name, sub: [p.name ? street : '', p.city || p.county, p.country].filter(Boolean).join(', '), lat, lon, kind: p.osm_value || '' };
  }).filter((r) => { const k = r.name + r.lat.toFixed(3) + r.lon.toFixed(3); if (seen.has(k)) return false; seen.add(k); return true; });
}
async function loadNearby(cat) {

  nav.nearbyCat = cat; nav.nearby = null; nav.nearbyErr = ''; navSheet();
  const q = `[out:json][timeout:15];nwr["${c[3]}"~"^(${c[4]})$"](around:2500,${nav.pos.lat.toFixed(5)},${nav.pos.lon.toFixed(5)});out center 40;`;
  try {

    nav.nearby = (j.elements || []).map((e) => ({ name: e.tags && e.tags.name, sub: [e.tags['addr:street'], e.tags['addr:housenumber']].filter(Boolean).join(' ') || c[2].replace(/s$/, ''), lat: e.lat ?? (e.center && e.center.lat), lon: e.lon ?? (e.center && e.center.lon), kind: cat }))

// ---- routing ----
async function fetchRoute(from, to) {
  const j = await getJSON(API.route(from, to), {}, 20000);
  if (j.code !== 'Ok' || !j.routes || !j.routes.length) throw new Error(j.message || 'No cycling route found to this destination.');
  const rt = j.routes[0], coords = rt.geometry.coordinates;
  if (coords.length < 2) throw new Error('Route too short.');
  const cum = C.cumulative(coords), total = cum[cum.length - 1], f = total / (rt.distance || total || 1);
  const steps = []; let acc = 0;
  for (const leg of rt.legs) for (const s of leg.steps) { steps.push({ ...C.stepInstruction(s), along: acc * f, type: s.maneuver.type }); acc += s.distance; }
  return { coords, cum, total, steps, elev: null, elevErr: '' };
}
async function routeElevation(R) {
  const n = Math.max(2, Math.min(100, Math.ceil(R.total / 40))), pts = C.samplePoints(R.coords, R.cum, n);
  const u = `${API.elevation}?latitude=${pts.map((p) => p[1].toFixed(5)).join(',')}&longitude=${pts.map((p) => p[0].toFixed(5)).join(',')}`;
  try {
    const j = await getJSON(u, {}, 12000);
    if (!Array.isArray(j.elevation) || j.elevation.length !== n) throw new Error('unexpected answer');
    R.elev = { h: j.elevation, along: pts.map((_, k) => R.total * k / (n - 1)), ...C.elevationStats(j.elevation) };
  } catch (e) { R.elevErr = 'Elevation unavailable (' + e.message + '): flat route assumed, wider uncertainty.'; }
}
function remainingElev(R, along) {
  if (!R.elev) return { ascent: 0, descent: 0 };
  const hs = R.elev.h.filter((_, i) => R.elev.along[i] >= along - 1);
  return hs.length > 1 ? C.elevationStats(hs) : { ascent: 0, descent: 0 };
}
async function selectDest(p) {
  $('#nv-q').value = ''; $('#nv-x').hidden = true; nav.results = []; renderResults(); $('#nv-q').blur(); $('#nv-sb').classList.remove('focus');
  if (nav.active) return modalInfo('Navigation', 'End the current navigation first.');
  nav.dest = { name: p.name, sub: p.sub || '', lat: +p.lat, lon: +p.lon }; nav.state = 'preview'; nav.route = null; nav.err = ''; nav.opt = false;
  places.recent = [nav.dest, ...places.recent.filter((x) => !(x.name === p.name && Math.abs(x.lat - p.lat) < 1e-4))].slice(0, 12); savePlaces();
  if (!nav.pos) { nav.pendingDest = p; nav.loading = 'Waiting for your location…'; navSheet(); return; }
  nav.loading = 'Finding a cycling route…'; navSheet(); drawDest();
  try { nav.route = await fetchRoute(nav.pos, nav.dest); nav.loading = 'Checking elevation…'; drawRoute(true); navSheet(); await routeElevation(nav.route); }
  catch (e) { nav.err = 'Route not available: ' + e.message; }
  nav.loading = ''; navSheet();
}
function drawDest() {
  if (!nav.map) return; const L = nav.L;
  if (nav.ly.dest) nav.map.removeLayer(nav.ly.dest);
  if (nav.dest) nav.ly.dest = L.marker([nav.dest.lat, nav.dest.lon], { icon: L.divIcon({ className: 'dest-ic', html: '<i></i>', iconSize: [26, 34], iconAnchor: [13, 32] }) }).addTo(nav.map);

function drawRoute(fit) {
  if (!nav.map) return; const L = nav.L;
  for (const k of ['rglow', 'rline']) if (nav.ly[k]) { nav.map.removeLayer(nav.ly[k]); nav.ly[k] = null; }

// ---- prediction ----
function typicalKmh(cap) {
  const rs = rides.filter((r) => !r.demo === (st.source !== 'demo') && r.km > 1 && r.avgKmh > 3).slice(0, 10).map((r) => r.avgKmh);
  let v = rs.length ? median(rs) * 0.85 : 16;          // 15 % for traffic lights and junctions
  if (cap) v = Math.min(v, cap * 0.8);
  return { kmh: Math.max(v, 6), measured: rs.length > 0 };
}
function navPredict(key, cap, along = 0) {
  const R = nav.route; if (!R) return null;
  const remKm = Math.max(0, R.total - along) / 1000, e = remainingElev(R, along), sp = typicalKmh(cap);
  let kmh = sp.kmh;
  if (nav.active && nav.movKm > 1 && nav.movMs > 60000) kmh = nav.movKm / (nav.movMs / 3.6e6) * 0.9;
  const out = { remKm, ascent: e.ascent, descent: e.descent, kmh, speedMeasured: sp.measured, min: remKm / kmh * 60, elevKnown: !!R.elev };
  if (!socReady()) return out;
  const m = C.modeWhKm(energyStats(), key, cap, S.energy);
  let whKm = m.whKm;
  if (nav.active && key === modeKey() && nav.liveKm > 1.5 && nav.liveWhKm > 0) whKm = 0.5 * whKm + 0.5 * nav.liveWhKm;   // blend in this ride's own consumption
  const regenOn = !!(coastCalFor() && st.app && C.currentCoastRegen(st.app, coastCalFor()) > 0);
  const r = C.predictRoute({ distanceKm: remKm, ascentM: e.ascent, descentM: e.descent, whKm, confidence: m.confidence, socPct: st.soc.pct, socUnc: st.soc.unc, bat: S.battery, regenOn, p: S.energy, extraPct: R.elev ? 0 : 6, sagPct: sagMarginPct() });
  return { ...out, ...r, whKm, confidence: m.confidence, dataKm: m.dataKm, socNow: st.soc.pct, regenOn };
}
const pctTxt = (x) => `${Math.max(0, Math.round(x))} %`;
const arrivalTxt = (r) => r.high - r.low > 6 ? `${Math.max(0, Math.round(r.low))}–${Math.max(0, Math.round(r.high))} %` : pctTxt(r.arrival);
const clock = (min) => new Date(Date.now() + min * 60000).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
function batteryWarn(r) {
  if (!r || r.status == null) return '';
  if (r.status === 'insufficient' || r.status === 'uncertain') return `<div class="warnbox red"><b>⚠ Battery may not be sufficient to reach this destination.</b><small>${r.status === 'insufficient' ? 'The estimate is below your reserve.' : 'The pessimistic end of the estimate is below your reserve.'} Charge first, choose a closer destination or try ⚡ Optimize range.</small></div>`;
  if (r.status === 'tight') return '<div class="warnbox amber"><b>Arrival battery will be low.</b><small>Voltage sag at low charge can make the controller reduce power before the end.</small></div>';
  return '';
}

  sh.className = 'nv-sheet';

  const rg = rangeNow();
  sh.innerHTML = `<div class="grab"></div>
    <div class="nv-batt">${socReady() ? `<span class="nv-bpct">🔋 ${show(st.soc.pct)} %</span><span class="dim small">estimated · range ≈ ${rg ? show(U.dist(rg.km)) : '—'} ${U.d} in ${esc(modeLabel(modeKey()))}</span>${conn}` : '<span class="dim small">🔌 Scooter not connected — routes work, but arrival-battery prediction needs live data from your controller.</span>'}</div>

}

function navTick() {

// ---------------- AI Mechanic ----------------
// Rule-based analysis of real telemetry. Every finding lists the evidence it is based on and
// says "possible causes" — it never states that a part is damaged.
function diagnose() {
  const F = [], add = (level, title, evidence, causes = [], steps = []) => F.push({ level, title, evidence, causes, steps });
  const h = st.history.filter((x) => Date.now() - x.t < 15 * 60000), th = thresholds(), b = S.battery;
  const g = (k) => st.mc && st.mc.has(k) ? st.mc.get(k) : null;
  const loadSamples = h.filter((x) => x.battA > 15);
  const enough = h.length > 300 && loadSamples.length > 20;
  // voltage sag
  const R = median(st.rSamples) || null, bh = batteryHealth();
  if (R) {
    const peakA = Math.max(...h.map((x) => x.battA), 0), sagCell = R * Math.max(peakA, 30) / b.cells;
    if (sagCell > 0.3) add('warn', 'Battery voltage drops significantly during acceleration', [`Measured pack resistance ≈ ${show(R * 1000)} mΩ`, `≈ ${show(sagCell, 2)} V per cell sag at ${show(Math.max(peakA, 30))} A`],
      ['Higher internal resistance (ageing cells, cold battery)', 'Low state of charge', 'High current demand', 'Loose, corroded or undersized connectors and wiring'],
      ['Compare with a fully charged, warm battery', 'Check the main battery connector and wiring for heat or discolouration (power off first)', 'Try Better Range or a lower battery-current mode']);
    else add('ok', 'Battery voltage sag is moderate', [`Pack resistance ≈ ${show(R * 1000)} mΩ (${show(sagCell, 2)} V/cell at ${show(Math.max(peakA, 30))} A)`]);
    if (bh.first && R > bh.first * 1.3) add('info', 'Pack resistance is higher than when first measured', [`Now ${show(R * 1000)} mΩ vs ${show(bh.first * 1000)} mΩ at first`], ['Normal ageing', 'Colder temperature today', 'Lower charge today'], ['Watch the trend in Battery Lab over several rides at similar charge and temperature']);
  }
  // low voltage under load
  const cutS = g('l_battery_cut_start'), minV = h.length ? Math.min(...h.map((x) => x.voltage)) : null;
  if (cutS > 0 && minV != null && minV < cutS + 1) add('warn', 'Voltage reached the controller\'s low-battery cut-back zone', [`Lowest voltage ${show(minV, 1)} V, cut-back starts at ${show(cutS, 1)} V`], ['Low charge', 'Voltage sag at high current'], ['Charge the battery', 'Ride with lower battery current until charged']);
  // temperatures
  const maxFet = h.length ? Math.max(...h.map((x) => x.fet)) : null;
  if (maxFet != null && maxFet >= th.fetStart - 5) add('warn', 'Controller ran close to its temperature limit', [`Peak ${show(maxFet)} °C, power is reduced from ${th.fetStart} °C`], ['Sustained high current (hills, high speed)', 'Poor airflow around the controller', 'High motor current setting'], ['Let it cool down', 'Check the controller has airflow and good thermal contact', 'Consider a lower motor-current mode on long climbs']);
  else if (maxFet != null) add('ok', 'Controller temperature normal', [`Peak ${show(maxFet)} °C in the last 15 min (limit from ${th.fetStart} °C)`]);
  const mot = h.filter((x) => x.mot != null).map((x) => x.mot);
  if (!th.motorSensor) add('info', 'No motor temperature sensor', ['The controller reports no motor sensor'], [], ['Without a sensor the controller cannot protect the motor from overheating — avoid long full-power climbs', 'A hub-motor temperature sensor (NTC) can be added to the controller\'s temp input']);
  else if (mot.length && Math.max(...mot) >= th.motorStart - 10) add('warn', 'Motor ran hot', [`Peak ${show(Math.max(...mot))} °C (limit from ${th.motorStart} °C)`], ['Long climbs or high speed', 'High motor current'], ['Let it cool', 'Use a lower torque mode on long climbs']);
  // faults
  const fc = {}; for (const f of st.faults) fc[f.code] = (fc[f.code] || 0) + 1;
  for (const [code, n] of Object.entries(fc)) add(n > 2 ? 'bad' : 'warn', `Controller fault: ${C.faultName(+code)}`, [`${n}× this session`], [C.faultHelp(+code)], ['Note when it happens (speed, throttle, battery level)', 'Check wiring and connectors related to this fault']);
  if (!st.faults.length && st.ready) add('ok', 'No controller faults this session', []);
  // duty saturation
  const moving = h.filter((x) => Math.abs(x.speed) > 5);
  if (moving.length > 100) {

  if (!rest) { st._restT = null; return; }
  st._restT = st._restT || now; if (now - st._restT < 30000) return;
  const p = C.batteryPercent(v.voltage, S.battery);

  const dP = st._capA.p - p, dAh = ah - st._capA.ah;

}

      ${tile('Peak battery current', show(p.maxBattA, 1), 'A', '', 'measured', ICON.batt)}

      ${tile('Top speed', show(U.spd(p.maxKmh), 1), U.s, '', `all-time ${show(U.spd(allTimeTop(demo)), 1)} ${U.s}`, ICON.rpm)}
    </div>
    <section class="card"><div class="lbl">Motor temperature</div>${thresholds().motorSensor ? '<canvas id="pl-mot" class="chart2"></canvas>' : '<p class="small dim">No motor temperature sensor on this controller.</p>'}<canvas id="pl-fet" class="chart2"></canvas><p class="tiny faint">Controller temperature (red)${thresholds().motorSensor ? ' and motor (amber)' : ''}, last 10 minutes.</p></section>
    <section class="card"><div class="lbl">Personal records</div>
      <div class="chg"><b>Drag runs</b><div class="small">${drags.length ? `${drags.length} runs · best reaction ${show(Math.min(...drags.map((d) => d.react ?? 9)), 2)} s` : 'None yet — try Drag mode.'}</div></div>
      ${runs.slice(0, 5).map((r) => `<div class="chg"><b>${new Date(r.t).toLocaleDateString()} · ${esc(r.mode)}</b><div class="small mono">${[25, 30, 40, 50].map((t) => r.hit[t] ? `0–${t} ${r.hit[t].toFixed(1)} s` : '').filter(Boolean).join(' · ')} · peak ${show(r.peakW)} W</div></div>`).join('')}
      <button class="btn wide" data-act="drag">🚦 Open Drag mode</button></section>
    <p class="foot">Timing uses controller speed (ERPM) sampled at ${S.pollHz}–20 Hz, so resolution is about ±0.1 s — fine for comparing your own runs, not for certified times. Phone GPS is not used for timing and is not accurate enough for millisecond-level results; a dedicated 10–25 Hz GNSS logger would be needed (not supported yet).</p>`;
}
function drawPerfLab() {
  const demo = st.source === 'demo', runs = store.get('perfRuns', []).filter((r) => !!r.demo === demo);
  if ($('#pl-acc') && runs.length) {
    const best = runs.filter((r) => r.hit[30]).sort((a, b) => a.hit[30] - b.hit[30])[0], series = [{ pts: runs[0].trace.map((x) => [x[0] / 1000, U.spd(x[1])]), col: '#3de3ff' }];
    if (best && best !== runs[0]) series.push({ pts: best.trace.map((x) => [x[0] / 1000, U.spd(x[1])]), col: '#ffb021' });
    drawLine($('#pl-acc'), series, { min: 0 });
  } else if ($('#pl-acc')) drawLine($('#pl-acc'), []);
  const h = st.history.filter((x) => Date.now() - x.t < 600000), s = Math.ceil(h.length / 300) || 1, hh = h.filter((_, i) => i % s === 0);
  if ($('#pl-fet')) drawLine($('#pl-fet'), [{ pts: hh.map((x) => [x.t, x.fet]), col: '#ff3b4f' }]);
  if ($('#pl-mot')) drawLine($('#pl-mot'), [{ pts: hh.map((x) => [x.t, x.mot]), col: '#ffb021' }]);
}

// ---------------- ride analytics & replay ----------------
function rideExtrasHTML(r) {
  const wk = (x) => x == null ? null : S.units === 'mph' ? x / MPH : x;
  const adv = Pro.has('rideAnalytics');
  return `<div class="grid">${[
    tile('Regen recovered', r.whRegen != null ? show(r.whRegen, 1) : '—', 'Wh', 'green', r.whUsed ? `${show(r.whRegen / r.whUsed * 100)} % of ${show(r.whUsed)} Wh used` : 'measured'),
    tile('Riding cost', r.cost != null ? show(r.cost, 2) : '—', '', '', `at ${S.energy.priceKwh}/kWh incl. charger loss · estimate`),
    tile('Battery', r.socStart != null ? `${Math.round(r.socStart)}→${Math.round(r.socEnd ?? 0)}` : '—', '%', '', 'start → end · estimated'),
    tile('Elevation', r.ascent != null ? `↑${Math.round(r.ascent)}` : '—', 'm', '', r.descent != null ? `↓${Math.round(r.descent)} m · GPS` : 'needs GPS altitude'),
  ].join('')}</div>
  ${adv && r.track && r.track[0] && r.track[0].length > 3 ? `<div class="lbl">Replay</div><div class="replay"><button class="iconbtn" id="rp-play">▶</button><input type="range" id="rp-pos" min="0" max="${r.track.length - 1}" value="0"><span id="rp-t" class="mono small">0:00</span></div><div id="rp-info" class="rp-info small"></div><canvas id="rp-chart" class="chart2"></canvas>`
    : r.track && !adv ? proLock('Ride replay') : r.track ? '<p class="tiny faint">Replay needs rides recorded with this version (GPS points with telemetry).</p>' : ''}`;
}
function setupReplay(r, map, L) {
  const pos = $('#rp-pos'); if (!pos || !r.track) return;
  const tr = r.track, pts = tr.map((p) => [p[0] / 1e5, p[1] / 1e5]);
  const mk = map ? L.circleMarker(pts[0], { radius: 8, color: '#fff', fillColor: '#00b8ff', fillOpacity: 1, weight: 3 }).addTo(map) : null;
  const fmtT = (s) => `${Math.floor(s / 60)}:${String(Math.round(s % 60)).padStart(2, '0')}`;
  const draw = (i) => drawLine($('#rp-chart'), [{ pts: tr.map((p) => [p[3], U.spd(p[2])]), col: '#3de3ff' }, { pts: tr.map((p) => [p[3], p[4] == null ? null : p[4] / 50]), col: '#ffb021' }], { min: 0, cursor: tr[i][3] });
  const upd = () => {
    const i = +pos.value, p = tr[i]; if (mk) mk.setLatLng(pts[i]);
    $('#rp-t').textContent = fmtT(p[3] || 0);
    $('#rp-info').innerHTML = `<span><b>${show(U.spd(p[2]))}</b> ${U.s}</span><span><b>${p[4] == null ? '—' : show(p[4])}</b> W</span><span><b>${p[5] == null ? '—' : p[5]}</b> % est.</span>`;
    draw(i);
  };
  let timer = null;
  $('#rp-play').onclick = () => {
    if (timer) { clearInterval(timer); timer = null; $('#rp-play').textContent = '▶'; return; }
    $('#rp-play').textContent = '❚❚'; if (+pos.value >= tr.length - 1) pos.value = 0;
    timer = setInterval(() => { if (!document.body.contains(pos)) { clearInterval(timer); return; } pos.value = +pos.value + 1; upd(); if (+pos.value >= tr.length - 1) { clearInterval(timer); timer = null; $('#rp-play').textContent = '▶'; } }, 120);
  };
  pos.oninput = upd; upd();
}

// ---------------- dashboard customization ----------------
function dashTilesModal() {
  if (!Pro.has('customDash')) return modal('Custom dashboard', proLock('Custom dashboards'), [['OK', null, 'primary']]);
  const cur = S.dashTiles || DASH_TILE_DEFAULT;
  modal('Customize dashboard', `<p class="small dim">Choose the live tiles shown under the gauge.</p>${Object.entries(DASH_TILE_NAMES).map(([k, n]) => `<label class="chk"><input type="checkbox" data-tile="${k}" ${cur.includes(k) ? 'checked' : ''}> ${n}</label>`).join('')}`,
    [['Reset', () => { S.dashTiles = null; saveSettings(); render(); }], ['Cancel'], ['Save', () => { S.dashTiles = Object.keys(DASH_TILE_NAMES).filter((k) => cur.includes(k)); saveSettings(); render(); }, 'primary']]);
  $('#modal').addEventListener('change', (e) => { const k = e.target.dataset.tile; if (!k) return; const i = cur.indexOf(k); if (e.target.checked && i < 0) cur.push(k); else if (!e.target.checked && i >= 0) cur.splice(i, 1); });
}

// ---------------- garage hub ----------------
function garageHub() {
  const lk = (f) => Pro.has(f) ? '' : '<span class="lock">⭐</span>';
  const rg = rangeNow(), d = st.ready ? diagnose() : null, issues = d ? d.findings.filter((f) => f.level === 'bad' || f.level === 'warn').length : null;
  return `<div class="g3">
    <button class="gcard" data-act="gsub" data-k="mech">${lk('mechanic')}<div class="gc-ico">🩺</div><b>AI Mechanic</b><small>${issues == null ? 'Diagnostics from telemetry' : issues ? `${issues} to check` : 'All normal'}</small></button>
    <button class="gcard" data-act="gsub" data-k="batt">${lk('batteryLab')}<div class="gc-ico">🔋</div><b>Battery Lab</b><small>${socReady() ? `${show(st.soc.pct)} % est.` : 'Health & history'}</small></button>
    <button class="gcard" data-act="gsub" data-k="range">${lk('rangeAI')}<div class="gc-ico">🧠</div><b>Range AI</b><small>${rg ? `${show(U.dist(rg.km))} ${U.d} est.` : 'Learns your riding'}</small></button>
    <button class="gcard" data-act="gsub" data-k="perf">${lk('perfLab')}<div class="gc-ico">🏁</div><b>Performance</b><small>0–30 · 0–50 · peaks</small></button>
    <button class="gcard" data-act="golive"><div class="gc-ico">📈</div><b>Live data</b><small>Graphs & faults</small></button>
    <button class="gcard pro" data-act="gsub" data-k="pro"><div class="gc-ico">⭐</div><b>ScooterV Pro</b><small>${Pro.active ? 'Active' : Pro.devPreview ? 'Dev preview' : 'Free'}</small></button>
  </div>`;
}
function labAction(act, k) {
  switch (act) {
    case 'gsub': st.garageSub = k; st.tab = 'garage'; render(); window.scrollTo(0, 0); return true;
    case 'golive': st.tab = 'data'; render(); window.scrollTo(0, 0); return true;
    case 'gopro': closeModal(); st.tab = 'garage'; st.garageSub = 'pro'; render(); window.scrollTo(0, 0); return true;
    case 'prorestore': PurchaseProvider.restore().catch((e) => modalInfo('Restore purchases', esc(e.message))); return true;
    case 'diagexport': exportDiag(); return true;
    case 'dashtiles': dashTilesModal(); return true;
    case 'resetenergy': modal('Reset learned consumption?', '<p>Range and arrival predictions return to the physics baseline until you ride again.</p>', [['Cancel'], ['Reset', () => { const e = energyStats(); e.bins = {}; e.grade = new C.EnergyStats().grade; saveEnergy(); render(); }, 'danger']]); return true;
  }
  return false;
}

// ScooterV start-up (runs after every module is defined)
applyAccent();
render();

})();
</script></body></html>
